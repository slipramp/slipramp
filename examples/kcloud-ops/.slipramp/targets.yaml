apiVersion: slipramp.com/v1alpha1
kind: Target
metadata:
  name: homelab-node-exporter
  title: Homelab node_exporter
spec:
  path: deploys
  watch:
    - deploys/inventory.py
    - deploys/node_exporter/**
    - deploys/slipramp/node-exporter.sh
  runtime: pyinfra
  placement: homelab-infrastructure
  credentials:
    ssh: ops-ci
  timeout: 20m
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  actions:
    preview:
      intent: preview
      command: [./slipramp/node-exporter.sh, plan, exporter_nodes]
    canary:
      intent: reconcile
      command:
        - ./slipramp/node-exporter.sh
        - apply
        - flows1.den1.kcloud.zone
    sync:
      intent: reconcile
      command: [./slipramp/node-exporter.sh, apply, exporter_nodes]
---
apiVersion: slipramp.com/v1alpha1
kind: Target
metadata:
  name: rustfs-homelab
  title: Homelab RustFS buckets
spec:
  path: terraform/environments/rustfs-homelab
  watch:
    - terraform/environments/rustfs-homelab/**
    - terraform/modules/rustfs-bucket/**
  runtime: terraform-rustfs
  placement: homelab-infrastructure
  credentials:
    ops-ci: ops-ci
  timeout: 45m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  actions:
    preview:
      intent: preview
      command: [./slipramp.sh, preview]
      artifacts:
        plan:
          path: /slipramp/artifacts/plan.tfplan
          mediaType: application/vnd.hashicorp.terraform.plan
          sensitive: true
    apply:
      intent: reconcile
      command: [./slipramp.sh, apply]
      inputs:
        plan:
          artifact:
            fromAction: preview
            compatibility: exact-catalog-revision
          mountPath: /slipramp/inputs/plan.tfplan
    sync:
      intent: reconcile
      command: [./slipramp.sh, sync]
---
apiVersion: slipramp.com/v1alpha1
kind: Target
metadata:
  name: homelab-kubernetes-upgrade
  title: Homelab Kubernetes upgrade
spec:
  path: deploys
  watch:
    - deploys/inventory.py
    - deploys/upgrade_k8s.py
    - deploys/k8s_ops.py
    - deploys/k8s/**
    - deploys/slipramp/upgrade-k8s.sh
  runtime: kubernetes-upgrade
  placement: homelab-infrastructure
  credentials:
    ops-ci: ops-ci
    ssh-known-hosts: homelab-known-hosts
  timeout: 12h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  actions:
    preview:
      intent: preview
      command: [./slipramp/upgrade-k8s.sh, preview]
      parameters:
        version:
          type: string
          argument:
            name: --to
    upgrade-node:
      intent: operation
      command: [./slipramp/upgrade-k8s.sh, node]
      parameters:
        host:
          type: enum
          required: true
          values:
            - controlplane100
            - controlplane101
            - controlplane102
            - compute105
            - compute104
            - compute103
            - compute6
            - compute5
            - compute4
            - compute2
            - compute1
          argument:
            name: --host
        maintenance:
          type: enum
          values: [none, reboot, apt-upgrade]
          argument:
            name: --maintenance
        version:
          type: string
          argument:
            name: --to
    upgrade-control-planes:
      intent: operation
      command: [./slipramp/upgrade-k8s.sh, control-planes]
      parameters:
        maintenance:
          type: enum
          values: [none, reboot, apt-upgrade]
          argument:
            name: --maintenance
        version:
          type: string
          argument:
            name: --to
    upgrade-compute:
      intent: operation
      command: [./slipramp/upgrade-k8s.sh, compute]
      parameters:
        maintenance:
          type: enum
          values: [none, reboot, apt-upgrade]
          argument:
            name: --maintenance
        version:
          type: string
          argument:
            name: --to
