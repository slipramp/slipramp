apiVersion: slipramp.com/v1alpha1
kind: PlacementConfig
placements:
  infrastructure-admin:
    cluster: primary
    jobNamespace: slipramp-runs
    serviceAccountName: infrastructure-admin
    timeout: 45m
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 2Gi
    credentials:
      operations:
        secretRef:
          name: infrastructure-operations
      ssh-known-hosts:
        secretRef:
          name: infrastructure-known-hosts
