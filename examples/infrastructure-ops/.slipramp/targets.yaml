apiVersion: slipramp.com/v1alpha1
kind: Target
metadata:
  name: node-exporter
  title: Fleet node_exporter
spec:
  path: deploys
  watch:
    - deploys/inventory.py
    - deploys/node_exporter/**
    - deploys/slipramp/node-exporter.sh
  runtime: pyinfra
  placement: infrastructure-admin
  credentials:
    ssh: operations
  timeout: 20m
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  actions:
    preview:
      title: Preview RustFS changes
      description: Creates a Terraform plan for the RustFS bucket configuration.
      documentationUrl: https://developer.hashicorp.com/terraform/cli/commands/plan
      intent: preview
      command: [./slipramp/node-exporter.sh, plan, exporter_nodes]
    canary:
      intent: reconcile
      command:
        - ./slipramp/node-exporter.sh
        - apply
        - node01.example.com
    sync:
      intent: reconcile
      command: [./slipramp/node-exporter.sh, apply, exporter_nodes]
---
apiVersion: slipramp.com/v1alpha1
kind: Target
metadata:
  name: rustfs-buckets
  title: RustFS buckets
spec:
  path: terraform/environments/rustfs
  watch:
    - terraform/environments/rustfs/**
    - terraform/modules/rustfs-bucket/**
  runtime: terraform-rustfs
  placement: infrastructure-admin
  credentials:
    operations: operations
  timeout: 45m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  actions:
    preview:
      intent: preview
      command: [./slipramp.sh, preview]
      artifacts:
        plan:
          description: Binary Terraform plan consumed by the apply action.
          path: /slipramp/artifacts/plan.tfplan
          mediaType: application/vnd.hashicorp.terraform.plan
          sensitive: true
    apply:
      title: Apply reviewed RustFS plan
      description: Applies one explicitly selected plan from a preview Run.
      documentationUrl: https://developer.hashicorp.com/terraform/cli/commands/apply
      intent: reconcile
      command: [./slipramp.sh, apply]
      inputs:
        plan:
          artifact:
            fromAction: preview
            compatibility: exact-catalog-revision
          mountPath: /slipramp/inputs/plan.tfplan
    sync:
      intent: reconcile
      command: [./slipramp.sh, sync]
      triggers:
        - name: sync-on-change
          git: {}
          review: required
---
apiVersion: slipramp.com/v1alpha1
kind: Target
metadata:
  name: kubernetes-upgrade
  title: Kubernetes upgrade
spec:
  path: deploys
  watch:
    - deploys/inventory.py
    - deploys/upgrade_k8s.py
    - deploys/k8s_ops.py
    - deploys/k8s/**
    - deploys/slipramp/upgrade-k8s.sh
  runtime: kubernetes-upgrade
  placement: infrastructure-admin
  credentials:
    operations: operations
    ssh-known-hosts: ssh-known-hosts
  timeout: 12h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  actions:
    preview:
      intent: preview
      command: [./slipramp/upgrade-k8s.sh, preview]
      parameters:
        host:
          type: enum
          required: true
          values:
            - control-plane-01
            - control-plane-02
            - control-plane-03
            - compute-01
            - compute-02
            - compute-03
          argument:
            name: --host
        version:
          type: string
          argument:
            name: --to
    upgrade-node:
      title: Upgrade one Kubernetes node
      description: Runs the guarded upgrade procedure against one selected node.
      documentationUrl: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
      intent: operation
      command: [./slipramp/upgrade-k8s.sh, node]
      parameters:
        host:
          title: Node
          description: Inventory hostname of the node to upgrade.
          type: enum
          required: true
          values:
            - control-plane-01
            - control-plane-02
            - control-plane-03
            - compute-01
            - compute-02
            - compute-03
          argument:
            name: --host
        apt-upgrade:
          title: Upgrade operating-system packages
          description: Includes a full apt package upgrade before rebooting.
          type: boolean
          argument:
            name: --apt-upgrade
        reboot:
          title: Reboot node
          description: Reboots the node as part of the guarded upgrade procedure.
          type: boolean
          argument:
            name: --reboot
        version:
          type: string
          argument:
            name: --to
    upgrade-control-planes:
      intent: operation
      command: [./slipramp/upgrade-k8s.sh, control-planes]
      parameters:
        apt-upgrade:
          type: boolean
          argument:
            name: --apt-upgrade
        reboot:
          type: boolean
          argument:
            name: --reboot
        version:
          type: string
          argument:
            name: --to
    upgrade-compute:
      intent: operation
      command: [./slipramp/upgrade-k8s.sh, compute]
      parameters:
        apt-upgrade:
          type: boolean
          argument:
            name: --apt-upgrade
        reboot:
          type: boolean
          argument:
            name: --reboot
        version:
          type: string
          argument:
            name: --to
