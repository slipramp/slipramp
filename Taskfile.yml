version: "3"

vars:
  AIR: "{{.ROOT_DIR}}/.bin/air"
  AIR_VERSION: v1.67.4
  GOLANGCI_LINT: "{{.ROOT_DIR}}/.bin/golangci-lint"
  GOLANGCI_LINT_VERSION: v2.14.0
  HELM: "{{.ROOT_DIR}}/.bin/helm"
  HELM_SHORT_VERSION: v3.19
  HELM_VERSION: v3.19.0
  KIND: "{{.ROOT_DIR}}/.bin/kind"
  KIND_VERSION: v0.33.0
  OAPI_CODEGEN: "{{.ROOT_DIR}}/.bin/oapi-codegen"
  OAPI_CODEGEN_VERSION: v2.8.0
  OPENAPI_BUNDLE: "{{.ROOT_DIR}}/ios/Slipramp/openapi.yaml"
  OPENAPI_TS: "{{.ROOT_DIR}}/node_modules/.bin/openapi-ts"
  PNPM: "{{.ROOT_DIR}}/.cache/pnpm/node_modules/.bin/pnpm"
  PNPM_STORE: "{{.ROOT_DIR}}/.cache/pnpm-store"
  PNPM_VERSION: 12.14.0
  REDOCLY: "{{.ROOT_DIR}}/node_modules/.bin/redocly"
  CATALOG_SCHEMA: "{{.ROOT_DIR}}/schemas/catalog-v1alpha1.json"
  SQLC: "{{.ROOT_DIR}}/.bin/sqlc"
  SQLC_VERSION: v1.31.1
  XCODE_DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

env:
  GOCACHE: "{{.ROOT_DIR}}/.cache/go-build"
  GOLANGCI_LINT_CACHE: "{{.ROOT_DIR}}/.cache/golangci-lint"

tasks:
  deps:
    desc: Install pinned development tools
    deps: [deps:air, deps:go, deps:helm, deps:web]

  deps:air:
    internal: true
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.bin"
      - GOBIN="{{.ROOT_DIR}}/.bin" go install github.com/air-verse/air@{{.AIR_VERSION}}
    status:
      - test -x "{{.AIR}}"
      - '"{{.AIR}}" -v | grep -Fq "{{.AIR_VERSION}}"'

  deps:go:
    internal: true
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.bin"
      - GOBIN="{{.ROOT_DIR}}/.bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - GOBIN="{{.ROOT_DIR}}/.bin" go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}}
      - GOBIN="{{.ROOT_DIR}}/.bin" go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
    status:
      - test -x "{{.GOLANGCI_LINT}}"
      - test "$("{{.GOLANGCI_LINT}}" version --short)" = "{{trimPrefix "v" .GOLANGCI_LINT_VERSION}}"
      - test -x "{{.OAPI_CODEGEN}}"
      - '"{{.OAPI_CODEGEN}}" -version | grep -Eq "^{{.OAPI_CODEGEN_VERSION}}$"'
      - test -x "{{.SQLC}}"
      - test "$("{{.SQLC}}" version)" = "{{.SQLC_VERSION}}"

  deps:pnpm:
    internal: true
    cmds:
      - npm install --prefix "{{.ROOT_DIR}}/.cache/pnpm" --no-save --ignore-scripts pnpm@{{.PNPM_VERSION}}
    status:
      - test -x "{{.PNPM}}"
      - test "$("{{.PNPM}}" --version)" = "{{.PNPM_VERSION}}"

  deps:web:
    internal: true
    deps: [deps:pnpm]
    cmds:
      - '"{{.PNPM}}" install --frozen-lockfile --store-dir "{{.PNPM_STORE}}"'

  deps:kind:
    internal: true
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.bin"
      - GOBIN="{{.ROOT_DIR}}/.bin" go install sigs.k8s.io/kind@{{.KIND_VERSION}}
    status:
      - test -x "{{.KIND}}"
      - '"{{.KIND}}" version | grep -Eq "^kind {{.KIND_VERSION}} "'

  deps:helm:
    desc: Install the pinned Helm release
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.bin"
      - GOBIN="{{.ROOT_DIR}}/.bin" go install helm.sh/helm/v3/cmd/helm@{{.HELM_VERSION}}
    status:
      - test -x "{{.HELM}}"
      - 'test "$("{{.HELM}}" version --short | cut -d+ -f1)" = "{{.HELM_SHORT_VERSION}}"'

  web:dev:
    desc: Run the web development server
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run dev'

  ios:test:
    desc: Test the iOS domain and networking layer
    deps: [mascot:check]
    env:
      DEVELOPER_DIR: "{{.XCODE_DEVELOPER_DIR}}"
    cmds:
      - swift test --package-path ios

  ios:build:
    desc: Build the native app for the iOS Simulator
    deps: [mascot:check]
    env:
      DEVELOPER_DIR: "{{.XCODE_DEVELOPER_DIR}}"
    cmds:
      - >-
        xcodebuild -project ios/Slipramp.xcodeproj -scheme Slipramp
        -configuration Debug -destination 'generic/platform=iOS Simulator'
        -derivedDataPath "{{.ROOT_DIR}}/.cache/ios-derived-data" build

  ios:build:release:
    desc: Build and validate the unsigned native app for an iOS device
    deps: [mascot:check]
    env:
      DEVELOPER_DIR: "{{.XCODE_DEVELOPER_DIR}}"
    cmds:
      - >-
        xcodebuild -project ios/Slipramp.xcodeproj -scheme Slipramp
        -configuration Release -destination 'generic/platform=iOS'
        -derivedDataPath "{{.ROOT_DIR}}/.cache/ios-release-derived-data"
        CODE_SIGNING_ALLOWED=NO build

  mascot:dev:
    desc: Run the public mascot gallery development server
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run dev:mascot'

  mascot:generate:
    desc: Generate the optimized iOS mascot pack and native catalog
    cmds:
      - node --experimental-strip-types scripts/generate-ios-mascots.mjs

  mascot:check:
    desc: Check the generated iOS mascot pack and native catalog
    cmds:
      - node --experimental-strip-types scripts/generate-ios-mascots.mjs --check

  mascot:build:
    desc: Build the public mascot gallery static site
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run build:mascot'

  mascot:deploy:
    desc: Build and deploy the public mascot gallery to Cloudflare
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run deploy:mascot'

  site:dev:
    desc: Run the public Slipramp site development server
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run dev:site'

  site:build:
    desc: Build the public Slipramp static site
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run build:site'

  site:deploy:
    desc: Build and deploy the public Slipramp site to Cloudflare
    deps: [deps:web]
    cmds:
      - '"{{.PNPM}}" --filter @slipramp/web run deploy:site'

  local:dependencies:
    internal: true
    cmds:
      - docker compose -f deploy/compose.yaml up -d --wait postgres rustfs dex
      - docker compose -f deploy/compose.yaml run --rm rustfs-init
      - |
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:5556/dex/.well-known/openid-configuration >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        printf 'Dex did not become ready\n' >&2
        exit 1

  local:up:
    desc: Start the local dependencies and observability stack
    deps: [local:dependencies]
    cmds:
      - docker compose -f deploy/compose.yaml up -d --wait prometheus grafana

  local:server:
    desc: Run the hot-reloading Server with local Dex and kcloud-ops integration configuration
    deps: [deps:air, local:up]
    env:
      SLIPRAMP_CONTROLLER_ENROLLMENT_TOKENS: '{"homelab":"slipramp-local-homelab-enrollment-token","prod-sjc1":"slipramp-local-prod-sjc1-enrollment-token"}'
      SLIPRAMP_KARGO_INTEGRATIONS_FILE: "{{.ROOT_DIR}}/deploy/local/kargo-integrations.yaml"
      SLIPRAMP_OIDC_CLIENT_ID: slipramp-local
      SLIPRAMP_OIDC_CLIENT_SECRET: slipramp-local-client-secret
      SLIPRAMP_OIDC_ISSUER: http://127.0.0.1:5556/dex
      SLIPRAMP_OIDC_REDIRECT_URL: http://localhost:5173/api/v1/auth/callback
      SLIPRAMP_OIDC_SUBJECT_ROLES: '{"ChRzbGlwcmFtcC1sb2NhbC1hZG1pbhIFbG9jYWw":"admin"}'
      SLIPRAMP_PLACEMENTS_FILE: "{{.ROOT_DIR}}/deploy/local/placements.yaml"
      SLIPRAMP_REPOSITORY_REFRESH_CREDENTIALS: '{"kcloud-ops":"{{.ROOT_DIR}}/deploy/local/kcloud-ops.gitconfig","universe":"{{.ROOT_DIR}}/deploy/local/universe.gitconfig"}'
      SLIPRAMP_REPOSITORY_REFRESH_INTERVAL: 10s
    cmds:
      - '"{{.AIR}}" -c .air.toml'

  local:down:
    desc: Stop local dependencies without deleting their data
    cmds:
      - docker compose -f deploy/compose.yaml stop

  generate:
    desc: Generate API, catalog schema, and database code
    cmds:
      - task: api:generate
      - task: catalog:schema:generate
      - task: store:generate

  catalog:schema:generate:
    desc: Generate the catalog JSON Schema
    cmds:
      - go run ./internal/catalogschema/generate "{{.CATALOG_SCHEMA}}"

  catalog:schema:check:
    desc: Check that the catalog JSON Schema is current
    cmds:
      - ./scripts/check-catalog-schema.sh

  store:generate:
    desc: Generate typed PostgreSQL queries
    deps: [deps:go]
    cmds:
      - '"{{.SQLC}}" generate'

  api:generate:
    desc: Validate and generate all API artifacts
    deps: [deps]
    cmds:
      - '"{{.REDOCLY}}" lint api/openapi.yaml'
      - '"{{.REDOCLY}}" bundle api/openapi.yaml --output "{{.OPENAPI_BUNDLE}}"'
      - task: api:swift:generate
      - '"{{.OAPI_CODEGEN}}" --config api/oapi-codegen.yaml "{{.OPENAPI_BUNDLE}}"'
      - '"{{.OPENAPI_TS}}" --file openapi-ts.config.ts'
      - '"{{.PNPM}}" --filter @slipramp/web exec oxfmt --write app/api/generated'

  api:swift:generate:
    internal: true
    desc: Generate the checked-in Swift client from the bundled API contract
    env:
      DEVELOPER_DIR: "{{.XCODE_DEVELOPER_DIR}}"
    cmds:
      - >-
        swift package --package-path ios --allow-writing-to-package-directory
        generate-code-from-openapi --target SliprampCore

  api:check:
    desc: Check generated API artifacts are current
    deps: [deps]
    cmds:
      - ./scripts/check-generated.sh

  store:check:
    desc: Check generated PostgreSQL queries are current
    deps: [deps:go]
    cmds:
      - ./scripts/check-sqlc-generated.sh

  format:
    desc: Format source
    deps: [deps]
    cmds:
      - '"{{.GOLANGCI_LINT}}" fmt'
      - '"{{.PNPM}}" --filter @slipramp/web run format'

  format:check:
    desc: Check formatting without changing files
    deps: [deps]
    cmds:
      - '"{{.GOLANGCI_LINT}}" fmt --diff'
      - '"{{.PNPM}}" --filter @slipramp/web run format:check'

  lint:
    desc: Run linters
    deps: [deps]
    cmds:
      - '"{{.GOLANGCI_LINT}}" run'
      - '"{{.PNPM}}" --filter @slipramp/web run lint'

  test:
    desc: Run Go tests with the race detector
    cmds:
      - go test -race ./...

  integration:
    desc: Run PostgreSQL and S3 integration tests against local dependencies
    deps: [local:dependencies]
    env:
      TEST_DATABASE_URL: postgres://slipramp:slipramp-development@127.0.0.1:5432/slipramp?sslmode=disable
      TEST_S3_ACCESS_KEY_ID: slipramp
      TEST_S3_BUCKET: slipramp
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_REGION: us-east-1
      TEST_S3_SECRET_ACCESS_KEY: slipramp-development
    cmds:
      - go test -race -count=1 ./internal/store ./internal/objectstore ./internal/server

  charts:check:
    desc: Lint and test deterministic Helm chart rendering
    deps: [deps:helm]
    env:
      SLIPRAMP_HELM_BIN: "{{.HELM}}"
    cmds:
      - ./scripts/check-charts.sh

  charts:package:
    desc: Package both Helm charts for an OCI release
    deps: [charts:check]
    requires:
      vars: [CHART_VERSION]
    env:
      SLIPRAMP_HELM_BIN: "{{.HELM}}"
    cmds:
      - ./scripts/package-charts.sh "{{.CHART_VERSION}}" "{{.ROOT_DIR}}/dist/charts"

  acceptance:kind:
    desc: Run execution and Kargo acceptance in a disposable kind cluster
    deps: [deps:helm, deps:kind]
    env:
      SLIPRAMP_HELM_BIN: "{{.HELM}}"
      SLIPRAMP_RUN_KIND_ACCEPTANCE: "1"
    cmds:
      - go test -v -count=1 -timeout=30m ./internal/acceptance/kind

  build:
    desc: Build all processes
    deps: [deps]
    cmds:
      - go build ./...
      - '"{{.PNPM}}" --filter @slipramp/web run build'
      - '"{{.PNPM}}" --filter @slipramp/web run build:mascot'
      - '"{{.PNPM}}" --filter @slipramp/web run build:site'

  check:
    desc: Run all local quality checks
    deps: [deps]
    cmds:
      - task: api:check
      - task: catalog:schema:check
      - task: store:check
      - task: charts:check
      - task: mascot:check
      - '"{{.GOLANGCI_LINT}}" fmt --diff'
      - '"{{.GOLANGCI_LINT}}" run'
      - go test -race ./...
      - go build ./...
      - '"{{.PNPM}}" --filter @slipramp/web run test'
      - '"{{.PNPM}}" --filter @slipramp/web run lint'
      - '"{{.PNPM}}" --filter @slipramp/web run format:check'
      - '"{{.PNPM}}" --filter @slipramp/web run typecheck'
      - '"{{.PNPM}}" --filter @slipramp/web run build'
      - '"{{.PNPM}}" --filter @slipramp/web run build:mascot'
      - '"{{.PNPM}}" --filter @slipramp/web run build:site'
