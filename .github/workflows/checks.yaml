name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Verify pinned Xcode
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task ios:test
      - run: task ios:build
      - run: task ios:build:release

  check:
    name: Check
    runs-on: slipramp-prod
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Swift and C toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            dirmngr \
            file \
            gcc \
            git \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            pkg-config \
            tzdata \
            unzip \
            zip \
            zlib1g-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.1.0"

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task check

  integration:
    name: Integration
    runs-on: slipramp-prod
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libc6-dev

      - uses: docker/setup-compose-action@v2
        with:
          version: v5.6.1

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task integration

  acceptance:
    name: Disposable kind acceptance
    runs-on: slipramp-prod
    timeout-minutes: 40
    continue-on-error: true
    env:
      SLIPRAMP_ACCEPTANCE_CLUSTER_NAME: slipramp-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task acceptance:kind

      - name: Clean up disposable cluster
        if: always()
        shell: bash
        run: |
          if [[ -x .bin/kind ]]; then
            .bin/kind delete cluster --name "$SLIPRAMP_ACCEPTANCE_CLUSTER_NAME"
          fi
