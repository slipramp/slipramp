name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: slipramp-prod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task check

      - name: Upload mascot gallery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mascot-site
          path: web/dist/mascot
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration
    runs-on: slipramp-prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task integration

  deploy-mascot:
    name: Deploy mascot gallery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - integration
    runs-on: slipramp-prod
    environment:
      name: mascot-production
      url: https://mascot.slipramp.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mascot-site
          path: web/dist/mascot

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          workingDirectory: web
          command: deploy --config wrangler.mascot.jsonc
