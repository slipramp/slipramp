name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: slipramp-prod
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libc6-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task check

      - name: Upload mascot gallery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mascot-site
          path: web/dist/mascot
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration
    runs-on: slipramp-prod
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libc6-dev

      - uses: docker/setup-compose-action@v2
        with:
          version: v5.6.1

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task integration

  acceptance:
    name: Disposable kind acceptance
    runs-on: slipramp-prod
    timeout-minutes: 40
    continue-on-error: true
    env:
      SLIPRAMP_ACCEPTANCE_CLUSTER_NAME: slipramp-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - run: task acceptance:kind

      - name: Clean up disposable cluster
        if: always()
        shell: bash
        run: |
          if [[ -x .bin/kind ]]; then
            .bin/kind delete cluster --name "$SLIPRAMP_ACCEPTANCE_CLUSTER_NAME"
          fi

  deploy-mascot:
    name: Deploy mascot gallery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - integration
    runs-on: slipramp-prod
    environment:
      name: mascot-production
      url: https://mascot.slipramp.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mascot-site
          path: web/dist/mascot

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          workingDirectory: web
          command: deploy --config wrangler.mascot.jsonc
