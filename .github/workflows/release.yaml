name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: slipramp-prod
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf 'Unsupported release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Validate and package charts
        run: task charts:package CHART_VERSION="${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: dist/charts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Publish ${{ matrix.target }} image
    needs: validate
    runs-on: slipramp-prod
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - checkout
          - controller
          - harness
          - kargo-tools
          - server
          - web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/slipramp-${{ matrix.target }}
          tags: type=raw,value=${{ needs.validate.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish-charts:
    name: Publish Helm charts
    needs:
      - validate
      - publish-images
    runs-on: slipramp-prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Install Helm
        run: task deps:helm

      - uses: actions/download-artifact@v4
        with:
          name: helm-charts
          path: dist/charts

      - name: Log in to GHCR
        shell: bash
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            .bin/helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish charts
        env:
          CHART_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          registry_owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          registry="oci://ghcr.io/$registry_owner/slipramp-charts"
          .bin/helm push "dist/charts/slipramp-$CHART_VERSION.tgz" "$registry"
          .bin/helm push "dist/charts/slipramp-controller-$CHART_VERSION.tgz" "$registry"
