name: Deploy sites

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sites.yaml
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs-site/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Deploy user guide
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: docs-production
      url: https://docs.slipramp.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install site dependencies
        run: |
          npm install --prefix .cache/pnpm --no-save --ignore-scripts pnpm@12.14.0
          .cache/pnpm/node_modules/.bin/pnpm install \
            --frozen-lockfile \
            --store-dir .cache/pnpm-store

      - name: Check and build user guide
        run: |
          .cache/pnpm/node_modules/.bin/pnpm --filter @slipramp/docs-site run check
          .cache/pnpm/node_modules/.bin/pnpm --filter @slipramp/docs-site run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          workingDirectory: docs-site
          command: deploy --config wrangler.jsonc

  deploy-mascot:
    name: Deploy mascot gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: mascot-production
      url: https://mascot.slipramp.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install site dependencies
        run: |
          npm install --prefix .cache/pnpm --no-save --ignore-scripts pnpm@12.14.0
          .cache/pnpm/node_modules/.bin/pnpm install \
            --frozen-lockfile \
            --store-dir .cache/pnpm-store

      - name: Build mascot gallery
        run: .cache/pnpm/node_modules/.bin/pnpm --filter @slipramp/web run build:mascot

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          workingDirectory: web
          command: deploy --config wrangler.mascot.jsonc

  deploy-site:
    name: Deploy public site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: mascot-production
      url: https://slipramp.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install site dependencies
        run: |
          npm install --prefix .cache/pnpm --no-save --ignore-scripts pnpm@12.14.0
          .cache/pnpm/node_modules/.bin/pnpm install \
            --frozen-lockfile \
            --store-dir .cache/pnpm-store

      - name: Build public site
        run: .cache/pnpm/node_modules/.bin/pnpm --filter @slipramp/web run build:site

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          workingDirectory: web
          command: deploy --config wrangler.site.jsonc
