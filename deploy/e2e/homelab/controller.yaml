apiVersion: apps/v1
kind: Deployment
metadata:
  name: slipramp-controller
  namespace: slipramp-system
  labels:
    app.kubernetes.io/name: slipramp-controller
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slipramp-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slipramp-controller
    spec:
      serviceAccountName: slipramp-controller
      containers:
        - name: controller
          image: registry.invalid/slipramp-controller:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: slipramp-controller-config
            - secretRef:
                name: slipramp-controller-credentials
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
