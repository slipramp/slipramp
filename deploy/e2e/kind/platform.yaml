apiVersion: v1
kind: ServiceAccount
metadata:
  name: slipramp-runner
  namespace: slipramp-runs
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acceptance-git
  namespace: slipramp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acceptance-git
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acceptance-git
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: initialize
          image: slipramp-acceptance-git:acceptance
          command: [/bin/sh, -ec]
          args:
            - |
              git clone --bare /fixtures/repository.bundle /srv/repository.git
              chown -R git:git /srv/repository.git
              mkdir -p /home/git/.ssh
              cp /client/authorized_key /home/git/.ssh/authorized_keys
              chmod 0755 /home/git
              chmod 0700 /home/git/.ssh
              chmod 0600 /home/git/.ssh/authorized_keys
              chown -R git:git /home/git
          volumeMounts:
            - name: client-public-key
              mountPath: /client
              readOnly: true
            - name: fixture
              mountPath: /fixtures
              readOnly: true
            - name: git-home
              mountPath: /home/git
            - name: repository
              mountPath: /srv
      containers:
        - name: git
          image: slipramp-acceptance-git:acceptance
          command: [/usr/sbin/sshd]
          args:
            - -D
            - -e
            - -f
            - /etc/ssh/acceptance/sshd_config
          ports:
            - containerPort: 2222
              name: git
          readinessProbe:
            tcpSocket:
              port: git
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: git-home
              mountPath: /home/git
            - name: host-keys
              mountPath: /etc/ssh/keys
              readOnly: true
            - name: repository
              mountPath: /srv
            - name: sshd-config
              mountPath: /etc/ssh/acceptance
              readOnly: true
      volumes:
        - name: client-public-key
          configMap:
            name: acceptance-git-client-public
        - name: fixture
          configMap:
            name: acceptance-repository
        - name: git-home
          emptyDir: {}
        - name: host-keys
          secret:
            secretName: acceptance-git-host-keys
            defaultMode: 0400
        - name: repository
          emptyDir: {}
        - name: sshd-config
          configMap:
            name: acceptance-git-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: acceptance-git
  namespace: slipramp-system
spec:
  selector:
    app.kubernetes.io/name: acceptance-git
  ports:
    - name: git
      port: 2222
      targetPort: git
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acceptance-dex
  namespace: slipramp-system
data:
  config.yaml: |
    issuer: http://acceptance-dex.slipramp-system.svc.cluster.local:5556/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    oauth2:
      alwaysShowLoginScreen: true
      skipApprovalScreen: true
    staticClients:
      - id: slipramp-acceptance
        name: Slipramp Acceptance
        secret: acceptance-client-secret
        redirectURIs:
          - {{ getenv "SLIPRAMP_ACCEPTANCE_OIDC_REDIRECT_URL" }}
    connectors:
      - type: mockCallback
        id: mock
        name: Acceptance Identity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acceptance-dex
  namespace: slipramp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acceptance-dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acceptance-dex
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dex
          image: slipramp-acceptance-dex:acceptance
          imagePullPolicy: Never
          args: [dex, serve, /etc/dex/config.yaml]
          env:
            - name: SLIPRAMP_ACCEPTANCE_OIDC_REDIRECT_URL
              value: http://127.0.0.1:13000/api/v1/auth/callback
          ports:
            - containerPort: 5556
              name: http
            - containerPort: 5558
              name: telemetry
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsGroup: 1001
            runAsUser: 1001
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: temporary
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: acceptance-dex
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: acceptance-dex
  namespace: slipramp-system
spec:
  selector:
    app.kubernetes.io/name: acceptance-dex
  ports:
    - name: http
      port: 5556
