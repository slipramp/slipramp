apiVersion: apps/v1
kind: Deployment
metadata:
  name: acceptance-ssh
  namespace: slipramp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acceptance-ssh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acceptance-ssh
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: initialize
          image: slipramp-acceptance-ssh:acceptance
          command: [/bin/sh, -ec]
          args:
            - |
              install -d -m 0755 -o ansible -g ansible /home/ansible
              install -d -m 0700 -o ansible -g ansible /home/ansible/.ssh
              install -m 0600 -o ansible -g ansible /client/authorized_key /home/ansible/.ssh/authorized_keys
          volumeMounts:
            - name: client-public-key
              mountPath: /client
              readOnly: true
            - name: home
              mountPath: /home/ansible
      containers:
        - name: ssh
          image: slipramp-acceptance-ssh:acceptance
          command: [/usr/sbin/sshd]
          args:
            - -D
            - -e
            - -f
            - /etc/ssh/acceptance/sshd_config
          ports:
            - containerPort: 22
              name: ssh
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: home
              mountPath: /home/ansible
            - name: host-keys
              mountPath: /etc/ssh/keys
              readOnly: true
            - name: sshd-config
              mountPath: /etc/ssh/acceptance
              readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: client-public-key
          configMap:
            name: acceptance-ssh-client-public
        - name: home
          emptyDir: {}
        - name: host-keys
          secret:
            secretName: acceptance-ssh-host-keys
            defaultMode: 0400
        - name: sshd-config
          configMap:
            name: acceptance-ssh-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: acceptance-ssh
  namespace: slipramp-system
spec:
  selector:
    app.kubernetes.io/name: acceptance-ssh
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
