apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  namespace: slipramp-system
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: rustfs-init
          image: rustfs/rc:v0.1.36
          command: [/bin/sh, -ec]
          args:
            - |
              /usr/bin/rc alias set acceptance http://rustfs:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_ACCESS_KEY"
              /usr/bin/rc bucket create --ignore-existing --region us-east-1 acceptance/slipramp
          env:
            - name: RUSTFS_ACCESS_KEY
              value: slipramp
            - name: RUSTFS_SECRET_ACCESS_KEY
              value: slipramp-acceptance
