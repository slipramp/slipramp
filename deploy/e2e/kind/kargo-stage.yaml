apiVersion: kargo.akuity.io/v1alpha1
kind: Freight
metadata:
  name: acceptance-freight
  namespace: kargo-acceptance
origin:
  kind: Warehouse
  name: acceptance
commits:
  - repoURL: ssh://git@acceptance-git.slipramp-system.svc.cluster.local:2222/srv/repository.git
    id: acceptance-source
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: acceptance
  namespace: kargo-acceptance
  labels:
    slipramp.com/integration: acceptance
  annotations:
    slipramp.com/promotion-application: acceptance
    slipramp.com/promotion-environment: acceptance
    slipramp.com/promotion-repository-url: ssh://git@acceptance-git.slipramp-system.svc.cluster.local:2222/srv/repository.git
    slipramp.com/promotion-target-branch: stage/acceptance/acceptance
    slipramp.com/promotion-source-paths: '["review/manifest.yaml"]'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: acceptance
      sources:
        direct: true
        stages: []
status:
  freightHistory:
    - items:
        Warehouse/acceptance:
          name: acceptance-freight
          commits:
            - repoURL: ssh://git@acceptance-git.slipramp-system.svc.cluster.local:2222/srv/repository.git
              id: acceptance-source
