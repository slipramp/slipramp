name: slipramp

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: slipramp
      POSTGRES_PASSWORD: slipramp-development
      POSTGRES_USER: slipramp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipramp -d slipramp"]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: slipramp
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SECRET_KEY: slipramp-development
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true

  rustfs-init:
    image: rustfs/rc:v0.1.36
    profiles: [tools]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: slipramp
      RUSTFS_SECRET_KEY: slipramp-development
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/bin/rc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        /usr/bin/rc bucket create --ignore-existing --region us-east-1 local/slipramp
    security_opt:
      - no-new-privileges:true

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    command: [dex, serve, /etc/dex/config.yaml]
    ports:
      - "127.0.0.1:5556:5556"
      - "127.0.0.1:5558:5558"
    volumes:
      - ./local/dex.yaml:/etc/dex/config.yaml:ro
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./local/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: slipramp-development
      GF_SECURITY_ADMIN_USER: slipramp
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./local/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true

volumes:
  grafana-data:
  postgres-data:
  prometheus-data:
  rustfs-data:
