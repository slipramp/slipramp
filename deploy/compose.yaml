name: slipramp

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: slipramp
      POSTGRES_PASSWORD: slipramp-development
      POSTGRES_USER: slipramp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipramp -d slipramp"]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: slipramp
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SECRET_KEY: slipramp-development
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true

  rustfs-init:
    image: rustfs/rc:v0.1.36
    profiles: [tools]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: slipramp
      RUSTFS_SECRET_KEY: slipramp-development
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/bin/rc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        /usr/bin/rc bucket create --ignore-existing --region us-east-1 local/slipramp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  rustfs-data:
