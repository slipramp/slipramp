{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "slipramp.fullname" . }}
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when HTTPRoute is enabled" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        {{- range $path := list "/api/v1/auth/login" "/api/v1/auth/callback" }}
        - path:
            type: Exact
            value: {{ $path }}
        {{- end }}
      backendRefs:
        - name: {{ include "slipramp.webName" . }}
          port: {{ .Values.web.service.port }}
    - matches:
        {{- range $path := list "/api" "/controller" "/execution" "/mcp" "/.well-known/oauth-protected-resource/mcp" "/healthz" "/readyz" }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      backendRefs:
        - name: {{ include "slipramp.serverName" . }}
          port: {{ .Values.server.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "slipramp.webName" . }}
          port: {{ .Values.web.service.port }}
{{- end }}
