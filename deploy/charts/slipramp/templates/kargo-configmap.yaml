apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slipramp.serverName" . }}-kargo
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
data:
  integrations.yaml: |
    apiVersion: slipramp.com/v1alpha1
    kind: KargoIntegrationConfig
    integrations:
      {{- .Values.server.kargo.integrations | toYaml | nindent 6 }}
