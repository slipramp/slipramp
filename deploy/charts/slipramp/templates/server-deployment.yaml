apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slipramp.serverName" . }}
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/placements: {{ include (print $.Template.BasePath "/placements-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      {{- if .Values.server.repositoryRefresh.credentials }}
      initContainers:
        {{- range $name, $credential := .Values.server.repositoryRefresh.credentials }}
        - name: prepare-repository-credential-{{ $name }}
          image: {{ include "slipramp.image" $.Values.server.image | quote }}
          imagePullPolicy: {{ $.Values.server.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /credentials/{{ $name }}
              cp -R /source/. /credentials/{{ $name }}/
              find /credentials/{{ $name }} -type d -exec chmod 0700 {} +
              find /credentials/{{ $name }} -type f -exec chmod 0600 {} +
              chown -R {{ required "server.podSecurityContext.runAsUser is required for repository credentials" $.Values.server.podSecurityContext.runAsUser }}:{{ required "server.podSecurityContext.runAsGroup is required for repository credentials" $.Values.server.podSecurityContext.runAsGroup }} /credentials/{{ $name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: repository-credential-source-{{ $name }}
              mountPath: /source
              readOnly: true
            - name: repository-credentials
              mountPath: /credentials
        {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "slipramp.image" .Values.server.image | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          env:
            - name: SLIPRAMP_SERVER_ADDRESS
              value: :8080
            - name: SLIPRAMP_SERVER_SHUTDOWN_TIMEOUT
              value: {{ .Values.server.shutdownTimeout | quote }}
            - name: SLIPRAMP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "slipramp.secretName" (dict "root" . "secret" .Values.server.database.url) }}
                  key: {{ include "slipramp.secretKey" (dict "secret" .Values.server.database.url "managedKey" "database-url") }}
            - name: SLIPRAMP_DATABASE_CONNECT_TIMEOUT
              value: {{ .Values.server.database.connectTimeout | quote }}
            - name: SLIPRAMP_S3_ENDPOINT
              value: {{ .Values.server.objectStore.endpoint | quote }}
            - name: SLIPRAMP_S3_REGION
              value: {{ .Values.server.objectStore.region | quote }}
            - name: SLIPRAMP_S3_BUCKET
              value: {{ .Values.server.objectStore.bucket | quote }}
            - name: SLIPRAMP_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "slipramp.secretName" (dict "root" . "secret" .Values.server.objectStore.accessKeyID) }}
                  key: {{ include "slipramp.secretKey" (dict "secret" .Values.server.objectStore.accessKeyID "managedKey" "s3-access-key-id") }}
            - name: SLIPRAMP_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "slipramp.secretName" (dict "root" . "secret" .Values.server.objectStore.secretAccessKey) }}
                  key: {{ include "slipramp.secretKey" (dict "secret" .Values.server.objectStore.secretAccessKey "managedKey" "s3-secret-access-key") }}
            - name: SLIPRAMP_S3_STARTUP_TIMEOUT
              value: {{ .Values.server.objectStore.startupTimeout | quote }}
            - name: SLIPRAMP_CONTROLLER_ENROLLMENT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "slipramp.secretName" (dict "root" . "secret" .Values.server.controllerEnrollmentTokens) }}
                  key: {{ include "slipramp.secretKey" (dict "secret" .Values.server.controllerEnrollmentTokens "managedKey" "controller-enrollment-tokens") }}
            - name: SLIPRAMP_ARTIFACT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "slipramp.secretName" (dict "root" . "secret" .Values.server.artifactTokenSecret) }}
                  key: {{ include "slipramp.secretKey" (dict "secret" .Values.server.artifactTokenSecret "managedKey" "artifact-token-secret") }}
            - name: SLIPRAMP_ARTIFACT_RETENTION_PERIOD
              value: {{ .Values.server.artifacts.retentionPeriod | quote }}
            - name: SLIPRAMP_ARTIFACT_RECONCILIATION_INTERVAL
              value: {{ .Values.server.artifacts.reconciliationInterval | quote }}
            - name: SLIPRAMP_ARTIFACT_ORPHAN_GRACE_PERIOD
              value: {{ .Values.server.artifacts.orphanGracePeriod | quote }}
            - name: SLIPRAMP_OIDC_ISSUER
              value: {{ .Values.server.oidc.issuer | quote }}
            - name: SLIPRAMP_OIDC_CLIENT_ID
              value: {{ .Values.server.oidc.clientID | quote }}
            - name: SLIPRAMP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "slipramp.secretName" (dict "root" . "secret" .Values.server.oidc.clientSecret) }}
                  key: {{ include "slipramp.secretKey" (dict "secret" .Values.server.oidc.clientSecret "managedKey" "oidc-client-secret") }}
            - name: SLIPRAMP_OIDC_REDIRECT_URL
              value: {{ .Values.server.oidc.redirectURL | quote }}
            - name: SLIPRAMP_OIDC_SUBJECT_ROLES
              value: {{ .Values.server.oidc.subjectRoles | toJson | quote }}
            - name: SLIPRAMP_PRODUCT_SESSION_LIFETIME
              value: {{ .Values.server.oidc.sessionLifetime | quote }}
            - name: SLIPRAMP_PLACEMENTS_FILE
              value: /etc/slipramp/placements.yaml
            - name: SLIPRAMP_REPOSITORY_REFRESH_INTERVAL
              value: {{ .Values.server.repositoryRefresh.interval | quote }}
            - name: SLIPRAMP_REPOSITORY_FETCH_TIMEOUT
              value: {{ .Values.server.repositoryRefresh.fetchTimeout | quote }}
            - name: SLIPRAMP_REPOSITORY_REFRESH_CREDENTIALS
              {{- $credentials := dict }}
              {{- range $name, $credential := .Values.server.repositoryRefresh.credentials }}
              {{- $_ := set $credentials $name (printf "/var/run/slipramp/repository-credentials/%s/%s" $name $credential.gitConfigKey) }}
              {{- end }}
              value: {{ $credentials | toJson | quote }}
            - name: SLIPRAMP_KARGO_INTEGRATIONS
              value: {{ .Values.server.kargo.integrations | toJson | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.server.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.server.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.server.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.server.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.server.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.server.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: placements
              mountPath: /etc/slipramp
              readOnly: true
            - name: temporary
              mountPath: /tmp
            {{- if .Values.server.repositoryRefresh.credentials }}
            - name: repository-credentials
              mountPath: /var/run/slipramp/repository-credentials
              readOnly: true
            {{- end }}
      volumes:
        - name: placements
          configMap:
            name: {{ include "slipramp.serverName" . }}-placements
        - name: temporary
          emptyDir: {}
        {{- range $name, $credential := .Values.server.repositoryRefresh.credentials }}
        - name: repository-credential-source-{{ $name }}
          secret:
            secretName: {{ $credential.secretName }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.server.repositoryRefresh.credentials }}
        - name: repository-credentials
          emptyDir: {}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
