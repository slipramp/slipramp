{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "slipramp.fullname" . }}
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $path := list "/api" "/controller" "/execution" "/healthz" "/readyz" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "slipramp.serverName" $ }}
                port:
                  number: {{ $.Values.server.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "slipramp.webName" . }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
