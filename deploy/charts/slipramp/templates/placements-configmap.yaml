apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slipramp.serverName" . }}-placements
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
data:
  placements.yaml: |
    apiVersion: slipramp.com/v1alpha1
    kind: PlacementConfig
    clusters:
      {{- .Values.server.clusters | toYaml | nindent 6 }}
    placements:
      {{- .Values.server.placements | toYaml | nindent 6 }}
