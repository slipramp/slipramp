{{- $create := false -}}
{{- if and .Values.server.artifactTokenSecret.value (lt (len .Values.server.artifactTokenSecret.value) 32) -}}
{{- fail "server.artifactTokenSecret.value must contain at least 32 bytes" -}}
{{- end -}}
{{- $hasAdministrator := false -}}
{{- range $_, $role := .Values.server.oidc.subjectRoles -}}
{{- if eq $role "admin" }}{{ $hasAdministrator = true }}{{ end -}}
{{- end -}}
{{- if not $hasAdministrator -}}
{{- fail "server.oidc.subjectRoles must contain at least one administrator" -}}
{{- end -}}
{{- range $secret := list .Values.server.database.url .Values.server.objectStore.accessKeyID .Values.server.objectStore.secretAccessKey .Values.server.controllerEnrollmentTokens .Values.server.artifactTokenSecret .Values.server.oidc.clientSecret -}}
{{- if $secret.value }}{{ $create = true }}{{ end -}}
{{- end -}}
{{- if $create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slipramp.managedSecretName" . }}
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.server.database.url.value }}
  database-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.objectStore.accessKeyID.value }}
  s3-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.objectStore.secretAccessKey.value }}
  s3-secret-access-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.controllerEnrollmentTokens.value }}
  controller-enrollment-tokens: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.artifactTokenSecret.value }}
  artifact-token-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.oidc.clientSecret.value }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
{{- end }}
