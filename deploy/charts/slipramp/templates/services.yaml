apiVersion: v1
kind: Service
metadata:
  name: {{ include "slipramp.serverName" . }}
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "slipramp.webName" . }}
  labels:
    {{- include "slipramp.labels" . | nindent 4 }}
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "slipramp.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
