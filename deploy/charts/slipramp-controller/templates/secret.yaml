{{- if or .Values.credentials.enrollmentToken.value .Values.credentials.bearerToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slipramp-controller.managedSecretName" . }}
  labels:
    {{- include "slipramp-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.enrollmentToken.value }}
  enrollment-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.bearerToken.value }}
  controller-token: {{ . | quote }}
  {{- end }}
{{- end }}
