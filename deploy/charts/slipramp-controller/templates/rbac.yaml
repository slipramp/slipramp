{{- if .Values.rbac.create }}
{{- range $index, $namespace := .Values.executionNamespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "slipramp-controller.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slipramp-controller.labels" $ | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, update]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "slipramp-controller.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slipramp-controller.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "slipramp-controller.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "slipramp-controller.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.rbac.create }}
{{- $root := . }}
{{- $namespaces := dict }}
{{- range .Values.kargo.integrations }}
{{- range .stageNamespaces }}
{{- $_ := set $namespaces . true }}
{{- end }}
{{- end }}
{{- range $namespace, $_ := $namespaces }}
{{- $roleName := printf "%s-kargo" (include "slipramp-controller.fullname" $root) | trunc 63 | trimSuffix "-" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slipramp-controller.labels" $root | nindent 4 }}
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [stages]
    verbs: [get, list, promote]
  - apiGroups: [kargo.akuity.io]
    resources: [freights]
    verbs: [get, list]
  - apiGroups: [kargo.akuity.io]
    resources: [promotions]
    verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slipramp-controller.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "slipramp-controller.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
