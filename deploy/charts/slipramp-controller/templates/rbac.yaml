{{- if .Values.rbac.create }}
{{- range $index, $namespace := .Values.executionNamespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "slipramp-controller.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slipramp-controller.labels" $ | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, update]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "slipramp-controller.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slipramp-controller.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "slipramp-controller.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "slipramp-controller.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
