nameOverride: ""
fullnameOverride: ""

replicaCount: 1
clusterName: ""
serverURL: ""
executionNamespaces: []
maximumActiveRuns: 4

image:
  repository: ghcr.io/slipramp/slipramp-controller
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
checkoutImage:
  repository: ghcr.io/slipramp/slipramp-checkout
  tag: ""
  digest: ""
harnessImage:
  repository: ghcr.io/slipramp/slipramp-harness
  tag: ""
  digest: ""

metrics:
  port: 9091
  service:
    annotations: {}

credentials:
  enrollmentToken:
    value: ""
    existingSecret:
      name: slipramp-controller-credentials
      key: enrollment-token
  bearerToken:
    value: ""
    existingSecret:
      name: slipramp-controller-credentials
      key: controller-token

gitCredentials: {}
kargo:
  integrations: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
rbac:
  create: true

imagePullSecrets: []
resources: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
terminationGracePeriodSeconds: 10
