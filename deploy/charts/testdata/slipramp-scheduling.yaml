imagePullSecrets:
  - name: registry-credentials
server:
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution: []
  tolerations:
    - key: dedicated
      operator: Equal
      value: slipramp
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: server
web:
  trustedProxyHops: 1
  livenessProbe:
    periodSeconds: 15
  readinessProbe:
    periodSeconds: 10
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution: []
  tolerations:
    - key: dedicated
      operator: Equal
      value: slipramp
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: web
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  host: slipramp.test
  tls:
    - hosts: [slipramp.test]
      secretName: slipramp-tls
