version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/slipramp/slipramp

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - modernize
    - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
