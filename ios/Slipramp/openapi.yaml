  /controller/v1/runs/{runId}/log-chunks:
    post:
      operationId: appendRunLogChunk
      summary: Append a Run log chunk
      description: Durably stores a log chunk for a Run managed by the authenticated controller. Repeating the same bytes at the same offset is idempotent.
      security:
        - ControllerBearer: []
      tags:
        - Controllers
      parameters:
        - name: runId
          in: path
          required: true
          description: Run whose action output produced this chunk.
