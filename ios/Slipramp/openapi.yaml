openapi: 3.1.0
info:
  title: Slipramp API
  version: 0.1.0
  description: HTTP API for the Slipramp Server.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check server health
      description: Reports whether the Slipramp Server process is serving HTTP requests.
      security: []
      tags:
        - System
      responses:
        '200':
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check server readiness
      description: Reports whether the Slipramp Server can reach the PostgreSQL database and artifact storage required to serve product, controller, and execution requests. Dependency errors are intentionally omitted.
      security: []
      tags:
        - System
      responses:
        '200':
          description: The server and its required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: One or more required dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/repositories:
    get:
      operationId: listRepositories
      summary: List repositories
      description: Lists active repository registrations ordered by name.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: refreshStatus
          in: query
          description: Limit results to the latest repository refresh result.
          schema:
            type: string
            enum:
              - pending
              - succeeded
              - failed
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Active repository registrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryList'
        '400':
          description: The list window is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Repository registrations could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createRepository
      summary: Register a repository
      description: Registers one Git repository and branch for later refresh. Credential name fields refer to configured secret sources; secret values are not accepted.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryConfig'
      responses:
        '201':
          description: Repository registered.
          headers:
            Location:
              description: URL of the repository registration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '400':
          description: The repository configuration is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Administrator permission and scope are required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: An active repository already uses the requested name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The repository could not be registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/repository-connection-tests:
    post:
      operationId: testRepositoryConnection
      summary: Test a repository connection
      description: Probes a proposed clone URL and branch with an optional configured Server refresh credential. The bounded probe does not register, update, refresh, or otherwise persist a Repository, and it never returns credential values.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryConnectionTestRequest'
      responses:
        '200':
          description: Completed connection probe, whether successful or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryConnectionTestResult'
        '400':
          description: The proposed connection configuration is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Administrator permission and scope are required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The repository connection could not be tested.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inbox:
    get:
      operationId: getInbox
      summary: Get the current operational Inbox
      description: Returns a complete role-aware projection of pending decisions, visible unacknowledged problems, and current Run activity. The operation fails instead of returning a knowingly partial projection.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Inbox
      responses:
        '200':
          description: The complete operational Inbox evaluated at one point in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '401':
          $ref: '#/components/responses/InboxUnauthorized'
        '403':
          $ref: '#/components/responses/InboxForbidden'
        '405':
          $ref: '#/components/responses/InboxMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InboxInternalError'
  /api/v1/inbox/problem-acknowledgements:
    post:
      operationId: acknowledgeInboxProblems
      summary: Acknowledge an exact batch of current Inbox problems
      description: Persists acknowledgements only for requested IDs that are current problem occurrences. Unknown, resolved, replaced, decision, and already acknowledged IDs are ignored.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxProblemAcknowledgements'
      responses:
        '204':
          description: The matching current problem occurrences were acknowledged.
        '400':
          $ref: '#/components/responses/InboxBadRequest'
        '401':
          $ref: '#/components/responses/InboxUnauthorized'
        '403':
          $ref: '#/components/responses/InboxForbidden'
        '405':
          $ref: '#/components/responses/InboxMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InboxInternalError'
  /api/v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      summary: List notification delivery history
      description: Returns non-sensitive outbound delivery state. Destination credentials, secret-file paths, event payload snapshots, and provider response bodies are never exposed.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Notifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Notification delivery history in newest-first order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeliveryList'
        '400':
          description: The requested page is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Notification delivery history could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/repositories/{repositoryId}:
    patch:
      operationId: updateRepository
      summary: Update a repository
      description: Atomically updates mutable presentation, credential-reference, and commit indexing settings for an active repository registration. Secret values are not accepted.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: repositoryId
          in: path
          required: true
          description: Stable identity of the repository registration.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUpdate'
      responses:
        '200':
          description: Updated repository registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '400':
          description: The repository update is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Administrator permission and scope are required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active repository does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The repository could not be updated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: removeRepository
      summary: Remove a repository
      description: Removes a repository from the active set without erasing its durable identity or future historical references.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: repositoryId
          in: path
          required: true
          description: Stable identity of the repository registration.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Repository removed.
        '400':
          description: The repository identity is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Administrator permission and scope are required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active repository does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The repository could not be removed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/repositories/{repositoryId}/refresh-attempts:
    get:
      operationId: listRepositoryRefreshAttempts
      summary: List repository refresh attempts
      description: Lists the retained immutable refresh attempts for one active repository, newest first.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Retained refresh attempt history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryRefreshAttemptList'
        '400':
          description: The list window or repository identity is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active repository does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Refresh attempts could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: refreshRepository
      summary: Refresh a repository now
      description: Starts one requested repository refresh through the same serialized fetch, validation, catalog activation, and Git-trigger delivery path used by periodic refreshes. The response is the completed durable attempt.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Requested refresh completed and its attempt was recorded.
          headers:
            Location:
              description: API collection containing the retained attempt history.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryRefreshAttempt'
        '400':
          description: The repository identity is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Administrator permission and scope are required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active repository does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The repository refresh could not be completed or recorded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/git-trigger-deliveries/failed:
    get:
      operationId: listFailedGitTriggerDeliveries
      summary: List failed Git-trigger deliveries
      description: Terminal failures creating automatic Runs, newest failure first. Delivery retries never retry execution of a Run. Diagnostics exclude underlying errors, credentials, and parameter values.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Terminal failed Git-trigger deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedGitTriggerDeliveryList'
        '400':
          description: The list window is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Failed deliveries could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/commits:
    get:
      operationId: listCommits
      summary: List indexed commits
      description: Lists commits reachable from the most recently indexed tracked branch head, newest first. The result may lag the observed branch head while a history index is pending.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: repositoryId
          in: query
          description: Limit results to one repository registration.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Match a commit SHA, title, or author name.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Indexed commits reachable from the tracked branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryCommitList'
        '400':
          description: The list window is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Indexed commits could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/repositories/{repositoryId}/commits/{commitSha}:
    get:
      operationId: getCommit
      summary: Get a known commit
      description: Gets a commit known to Slipramp for an active repository. Known commits include indexed branch history and commits referenced by product state.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Repositories
      parameters:
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commitSha
          in: path
          required: true
          schema:
            type: string
            pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      responses:
        '200':
          description: The known commit and its repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryCommit'
        '400':
          description: The repository ID or commit SHA is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active repository or known commit does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The commit could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/repositories/{repositoryId}/catalog:
    get:
      operationId: getRepositoryCatalog
      summary: Get the active repository catalog
      description: Returns the immutable catalog revision currently active for an existing repository. A repository without an accepted catalog does not have this resource yet.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Catalog
      parameters:
        - name: repositoryId
          in: path
          required: true
          description: Stable identity of the repository registration.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The repository's active catalog revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRevision'
        '400':
          description: The repository identity is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active repository does not exist or does not have an accepted catalog revision.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The active catalog could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/targets/{targetId}/actions/{actionName}/explanation:
    get:
      operationId: explainTargetAction
      summary: Explain an Action from an active Target
      description: Returns the effective execution contract for one Action using the Slipramp Server's current Placement configuration. Required parameters may be omitted for this read-only explanation; Run creation remains strict. Credential values and arbitrary Placement pod configuration are never returned.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Catalog
      parameters:
        - name: targetId
          in: path
          required: true
          description: Stable identity of the Target.
          schema:
            type: string
            format: uuid
        - name: actionName
          in: path
          required: true
          description: Stable technical name of the Action.
          schema:
            $ref: '#/components/schemas/CatalogName'
      responses:
        '200':
          description: The effective Action execution contract and provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogExplanation'
        '400':
          description: A path parameter is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active Target or Action does not exist.
          content:
            application/problem+json:
              schema:
