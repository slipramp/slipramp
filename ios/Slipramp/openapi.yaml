    post:
      operationId: rerunRun
      summary: Rerun a finished Run
      description: Creates a new immutable queued Run from a finished Run. Exact mode reuses the original frozen execution snapshot. Latest mode resolves the same target, action, and parameters against the active catalog and current placement configuration. Latest mode is unavailable when the original Run has artifact inputs.
      security:
        - ProductSession: []
        - ProductBearer: []
