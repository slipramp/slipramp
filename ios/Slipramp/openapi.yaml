  /api/v1/runs:
    get:
      operationId: listRuns
      summary: List recent Runs
      description: Lists Runs in descending creation order with offset pagination. Repository, commit, input artifact, target, cluster, phase, and review state filters scope execution history.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Runs
      parameters:
        - name: repositoryId
          in: query
          required: false
          description: Limit results to one repository.
          schema:
            type: string
            format: uuid
        - name: targetId
          in: query
          required: false
          description: Limit results to one durable Target.
          schema:
            type: string
            format: uuid
        - name: commitSha
          in: query
          required: false
          description: Limit results to Runs pinned to this full Git object ID. Requires repositoryId.
          schema:
            type: string
            pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
        - name: inputArtifactId
          in: query
          required: false
          description: Limit results to Runs that consume this exact artifact.
          schema:
            type: string
            format: uuid
        - name: cluster
          in: query
          required: false
          description: Limit results to Runs assigned to one execution cluster.
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: phase
          in: query
          required: false
          description: Limit results to one durable lifecycle phase.
          schema:
            type: string
            enum:
              - queued
              - assigned
              - preparing
              - running
              - finished
        - name: reviewState
          in: query
          required: false
          description: Limit results to one Run review state.
          schema:
            $ref: '#/components/schemas/RunReviewState'
        - name: limit
          in: query
          required: false
          description: Maximum number of recent Runs to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Zero-based offset into the matching Runs.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Recent Runs matching the requested filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          description: A filter or pagination value is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated principal cannot read product state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Run history could not be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createRun
      summary: Create an action run
      description: Resolves an action against the repository's active catalog revision, or the producing revision when explicit artifact inputs are selected, and persists an immutable queued Run. The Run remains pinned to the resolved catalog revision and Git commit even if the repository refreshes later.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Runs
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key that makes retries of the same run request return the originally created Run. Authenticated keys are scoped to the calling principal. Reusing a key for a different request is a conflict.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '201':
          description: The queued Run was created or recovered by idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: The run request or supplied parameters are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid product session or bearer credential is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Operator permission and runs-write scope are required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active Target, catalog, action, runtime, or placement required by the request does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The idempotency key was already used for another request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The Run could not be created.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
