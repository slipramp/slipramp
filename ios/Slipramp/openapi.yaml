  /controller/v1/enroll:
    post:
      operationId: enrollController
      summary: Enroll a cluster controller
      description: Uses a cluster-scoped enrollment credential to bind a controller-generated bearer credential to its cluster. Repeating an enrollment with the same credential digest is idempotent.
