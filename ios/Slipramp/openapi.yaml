  responses:
    InboxUnauthorized:
      description: A valid product session or bearer credential is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InboxForbidden:
      description: The authenticated principal lacks the required role or scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InboxMethodNotAllowed:
      description: The HTTP method is not supported for this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InboxInternalError:
      description: The complete Inbox projection or acknowledgement could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InboxBadRequest:
      description: The request body or problem occurrence IDs are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid credential is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal lacks the required role or scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested integration, Stage, or Promotion does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with durable Promotion state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The operation could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    KargoServiceUnavailable:
      description: A durable dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PromotionId:
