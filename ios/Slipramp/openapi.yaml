    post:
      operationId: reportKargoPromotionDispatch
      summary: Report Kargo Promotion creation
      description: Reports the result of materializing an operator-started Kargo Promotion. Repeating a report for the same attempt and result is idempotent. A stale report cannot move a Promotion backward.
      security:
        - ControllerBearer: []
      tags:
        - Controllers
      parameters:
        - name: promotionId
          in: path
          required: true
          description: Slipramp Promotion whose Kargo resource was dispatched.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KargoPromotionDispatchReport'
      responses:
        '204':
          description: The dispatch result was recorded or was already reflected in newer state.
        '400':
          description: The dispatch report is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The controller credential is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The Promotion is not assigned to this controller's cluster.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The report conflicts with the materialized Kargo Promotion identity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The dispatch result could not be recorded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /controller/v1/promotions/{promotionId}/reconciliation:
    post:
      operationId: reportKargoPromotionReconciliation
      summary: Report terminal Kargo Promotion reconciliation
      description: Reports a terminal phase observed on a materialized operator-started Kargo Promotion before its callback hydrated Slipramp state. Identity is checked against both the canonical Kargo name and Kubernetes UID. Repeating an accepted report is idempotent, and a callback that wins the row lock first cannot be moved backward.
      security:
        - ControllerBearer: []
      tags:
        - Controllers
      parameters:
        - name: promotionId
          in: path
          required: true
          description: Slipramp Promotion whose Kargo resource was reconciled.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KargoPromotionReconciliationReport'
      responses:
        '204':
          description: The terminal phase was recorded or newer callback state already won the race.
        '400':
          description: The reconciliation report is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The controller credential is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The Promotion is not assigned to this controller's cluster.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The report conflicts with the canonical Kargo Promotion identity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The reconciliation result could not be recorded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
