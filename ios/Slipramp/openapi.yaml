            maxLength: 200
        - name: cluster
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: archived
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Observed Kargo Stages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionStageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/promotion-stages/{stageId}/promotions:
    post:
      operationId: createPromotion
      summary: Create a Kargo Promotion for exact observed Freight
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Promotions
      parameters:
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionCreate'
      responses:
        '201':
          description: The durable Promotion creation request.
          headers:
            Location:
              description: URL of the Promotion.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/promotion-stages/{stageId}/policy:
    put:
      operationId: updatePromotionStagePolicy
      summary: Update review policy for an observed Kargo Stage
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Promotions
      parameters:
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionStagePolicyUpdate'
      responses:
        '200':
          description: The updated configured and effective policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionStagePolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/promotion-pipelines:
    get:
      operationId: listPromotionPipelines
      summary: Compare current Freight across ordered Kargo environments
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Promotions
      parameters:
        - name: integration
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: project
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: application
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: cluster
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: repository
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: attention
          in: query
          description: Include pipelines with Stage drift, newer Freight available to a manual Stage, or either condition. Stage drift requires comparable Freight in at least two environments.
          schema:
            $ref: '#/components/schemas/PromotionPipelineAttention'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active Kargo Stages grouped into ordered Freight comparisons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionPipelineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/promotion-branch-drift:
    get:
      operationId: listPromotionBranchDrift
      summary: Inspect cached Kargo Stage branch drift grouped by Repository
      description: Pagination counts matching Stages after all filters, ordered by Repository name, integration, project, application, environment, Stage name, and Stage ID. Each page groups its Stages by Repository and may contain part of a Repository's Stages.
      security:
        - ProductSession: []
        - ProductBearer: []
      tags:
        - Promotions
      parameters:
        - name: integration
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: project
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - name: application
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PromotionBranchDriftStatus'
        - name: repository
          in: query
          schema:
            $ref: '#/components/schemas/CatalogName'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Cached branch comparisons for active observed Kargo Stages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionBranchDriftList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /controller/v1/kargo/{integration}/stages:
    put:
      operationId: replaceKargoStageSnapshot
      summary: Submit one complete observed Kargo Stage snapshot
      security:
        - ControllerBearer: []
      tags:
        - Controllers
        - Promotions
      parameters:
        - name: integration
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CatalogName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KargoStageSnapshot'
      responses:
        '204':
          description: The complete snapshot was accepted or had already been accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ProductSession:
      type: apiKey
      in: cookie
      name: slipramp_session
      description: Opaque local browser session issued by the Slipramp Server.
    ProductBearer:
      type: http
      scheme: bearer
      description: Slipramp API key for a product principal.
    ControllerBearer:
      type: http
      scheme: bearer
    ControllerEnrollmentBearer:
      type: http
      scheme: bearer
    RunArtifactBearer:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      required:
        - status
        - database
        - artifactStorage
      properties:
        status:
          type: string
          enum:
            - ready
            - not-ready
        database:
          $ref: '#/components/schemas/DependencyStatus'
        artifactStorage:
          $ref: '#/components/schemas/DependencyStatus'
    DependencyStatus:
      type: string
      enum:
        - available
        - unavailable
    GitCommit:
      type: object
      additionalProperties: false
      required:
        - sha
      properties:
        sha:
          type: string
          pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
          description: Exact Git object identity.
        title:
          type: string
          description: Commit subject when it has been read from the Git object.
        author:
          type: string
          description: Commit author name when it has been read from the Git object.
        authoredAt:
          type: string
          format: date-time
          description: Commit author timestamp when it has been read from the Git object.
        committedAt:
          type: string
          format: date-time
          description: Commit timestamp when it has been read from the Git object.
        url:
          type: string
          format: uri
          description: Provider commit page when the repository supports web links.
    Problem:
      type: object
      description: An RFC 9457 problem detail.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code generated for this occurrence.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence.
    Inbox:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - capabilities
        - decisions
        - problems
        - activity
      properties:
        generatedAt:
          type: string
          format: date-time
          description: UTC evaluation time shared by every item in this projection.
        capabilities:
          $ref: '#/components/schemas/InboxCapabilities'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/InboxItem'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/InboxItem'
        activity:
          $ref: '#/components/schemas/InboxActivity'
    InboxCapabilities:
      type: object
      additionalProperties: false
      required:
        - acknowledgeProblems
      properties:
        acknowledgeProblems:
          type: boolean
          description: Whether this credential may acknowledge current Inbox problems.
    InboxActivity:
      type: object
      additionalProperties: false
      required:
        - queued
        - starting
        - running
      properties:
        queued:
          type: integer
          minimum: 0
        starting:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
    InboxItem:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - title
        - description
        - occurredAt
        - actionLabel
        - destination
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque identity for this decision or exact problem occurrence.
        kind:
          type: string
          enum:
            - promotion-review
            - run-review
            - promotion-error
            - git-trigger-failure
            - repository-refresh
            - cluster-unreachable
            - run-observation
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4096
        occurredAt:
          type: string
          format: date-time
        actionLabel:
          type: string
          minLength: 1
          maxLength: 100
        destination:
          $ref: '#/components/schemas/InboxDestination'
    InboxDestination:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - promotion
            - repository
            - cluster
            - run
        id:
          type: string
          minLength: 1
          maxLength: 253
          description: Resource identity for the destination.
    InboxProblemAcknowledgements:
      type: object
      additionalProperties: false
      required:
        - problemIds
      properties:
        problemIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            pattern: ^[0-9a-f]{64}$
          description: Exact current problem-occurrence IDs to acknowledge.
    NotificationDelivery:
      type: object
      required:
        - id
        - eventId
        - eventType
        - subjectType
        - subjectId
        - occurredAt
        - destinationName
        - destinationType
        - state
        - attemptCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - review.requested
        subjectType:
          type: string
          enum:
            - promotion
            - run
        subjectId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        destinationName:
          type: string
          minLength: 1
          maxLength: 63
        destinationType:
          type: string
          enum:
            - slack
        state:
          type: string
          enum:
            - pending
            - delivered
            - failed
        attemptCount:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: string
          format: date-time
        lastError:
          type: string
          minLength: 1
          maxLength: 512
          description: Bounded non-sensitive diagnostic summary for the latest attempt.
        firstAttemptedAt:
          type: string
          format: date-time
        lastAttemptedAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationDeliveryList:
      type: object
      required:
        - items
        - limit
        - offset
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDelivery'
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    ProductPrincipal:
      type: object
      additionalProperties: false
      required:
        - principalId
        - kind
        - displayName
        - role
      properties:
        principalId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - user
            - service-account
          x-go-type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
          x-go-type: string
    APIKey:
      type: object
      unevaluatedProperties: false
      required:
        - id
        - principalId
        - name
        - tokenPrefix
        - scopes
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        tokenPrefix:
          type: string
          minLength: 1
          maxLength: 64
          description: Non-secret prefix suitable for identifying the credential.
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/APIKeyScope'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    APIKeyList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    APIKeyCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/APIKeyScope'
        expiresAt:
          type: string
          format: date-time
    APIKeyCredential:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              minLength: 1
              description: Complete secret returned only when the API key is created.
      unevaluatedProperties: false
    Principal:
      type: object
      additionalProperties: false
      required:
        - principalId
        - kind
        - displayName
        - role
        - createdAt
        - updatedAt
      properties:
        principalId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - user
            - service-account
          x-go-type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
          x-go-type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time
    PrincipalList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Principal'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    PrincipalUpdate:
      type: object
      additionalProperties: false
      required:
        - disabled
      properties:
        disabled:
          type: boolean
    ServiceAccountCreate:
      type: object
      additionalProperties: false
      required:
        - displayName
        - role
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
          x-go-type: string
    Repository:
      allOf:
        - $ref: '#/components/schemas/RepositoryConfig'
        - type: object
          required:
            - id
            - createdAt
            - refresh
          properties:
            id:
              type: string
              format: uuid
              description: Stable identity of the repository registration.
            createdAt:
              type: string
              format: date-time
              description: Time at which the repository was registered.
            refresh:
              $ref: '#/components/schemas/RepositoryRefresh'
            commitHistoryIndex:
              $ref: '#/components/schemas/RepositoryCommitHistoryIndex'
    RepositoryList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    RepositoryCommitList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryCommit'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    RepositoryCommit:
      type: object
      required:
        - repositoryId
        - repositoryName
        - commit
      properties:
        repositoryId:
          type: string
          format: uuid
        repositoryName:
          type: string
        commit:
          $ref: '#/components/schemas/GitCommit'
    RepositoryCommitHistoryIndex:
      type: object
      required:
        - status
        - commitCount
      properties:
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
          x-enum-varnames:
            - RepositoryCommitHistoryIndexStatusPending
            - RepositoryCommitHistoryIndexStatusSucceeded
            - RepositoryCommitHistoryIndexStatusFailed
        desiredHeadSha:
          type: string
          pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
          description: Current tracked branch head awaiting or represented by the index.
        indexedHeadSha:
          type: string
          pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
          description: Tracked branch head represented by the indexed commit set.
        commitCount:
          type: integer
          minimum: 0
          description: Number of commits currently reachable from the indexed tracked branch head.
        lastAttemptedAt:
          type: string
          format: date-time
        lastSucceededAt:
          type: string
          format: date-time
        failureReason:
          type: string
          minLength: 1
    RepositoryConfig:
      type: object
      required:
        - name
        - cloneUrl
        - branch
        - commitIndexing
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: Unique human-readable name of the active repository.
        cloneUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: HTTPS, SSH, or SCP-style Git clone URL without embedded secrets.
        branch:
          type: string
          minLength: 1
          maxLength: 255
          description: Git branch tracked by repository refresh.
        commitIndexing:
          $ref: '#/components/schemas/RepositoryCommitIndexingMode'
        commitUrlTemplate:
          type: string
          minLength: 1
          maxLength: 2048
          description: Optional absolute HTTP or HTTPS commit-page template containing one {sha} placeholder. Known public Git providers are inferred when this is omitted.
        refreshCredentialName:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: Optional name of a Server credential source used to refresh this repository. The referenced secret value is never persisted in PostgreSQL.
        checkoutCredentialName:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: Optional logical credential name resolved by each execution cluster to a cluster-local Kubernetes Secret.
    RepositoryCommitIndexingMode:
      type: string
      enum:
        - disabled
        - observedHeads
        - trackedBranchHistory
      x-enum-varnames:
        - RepositoryCommitIndexingDisabled
        - RepositoryCommitIndexingObservedHeads
        - RepositoryCommitIndexingTrackedBranchHistory
      description: Controls whether refresh records no presentation metadata, metadata only for observed branch heads, or metadata for the complete tracked branch history. Exact commit SHAs required by product records are retained in all modes.
    RepositoryUpdate:
      type: object
      required:
        - commitIndexing
        - commitUrlTemplate
        - refreshCredentialName
        - checkoutCredentialName
      properties:
        commitIndexing:
          $ref: '#/components/schemas/RepositoryCommitIndexingMode'
        commitUrlTemplate:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 2048
          description: Replacement commit-page template, or null to use provider inference.
        refreshCredentialName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: Replacement Server refresh credential reference, or null for no credential. Secret values are not accepted or persisted.
        checkoutCredentialName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: Replacement logical execution checkout credential reference, or null for no credential.
    RepositoryConnectionTestRequest:
      type: object
      required:
        - cloneUrl
        - branch
      properties:
        cloneUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: Proposed HTTPS, SSH, or SCP-style Git clone URL without embedded secrets.
        branch:
          type: string
          minLength: 1
          maxLength: 255
          description: Proposed Git branch to probe without fetching repository contents.
        refreshCredentialName:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: Optional Server refresh credential reference. The referenced secret is resolved only for the probe and is never returned or persisted.
    RepositoryConnectionTestResult:
      type: object
      required:
        - status
        - durationMilliseconds
      properties:
        status:
          type: string
          enum:
            - succeeded
            - failed
          x-enum-varnames:
            - RepositoryConnectionTestSucceeded
            - RepositoryConnectionTestFailed
        durationMilliseconds:
          type: integer
          format: int64
          minimum: 0
          description: Elapsed Git probe time in milliseconds.
        commitSha:
          type: string
