          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /controller/v1/poll:
    post:
      operationId: pollForControllerCommand
      summary: Poll for a controller command
      description: Records the authenticated cluster controller as healthy and waits to assign or cancel a Run, create a Kargo Promotion, or reconcile a materialized Promotion awaiting callback for its cluster. An empty response means no command became available before the requested wait elapsed.
      security:
        - ControllerBearer: []
      tags:
        - Controllers
      parameters:
        - name: timeoutSeconds
          in: query
          required: false
          description: Maximum time to wait for a controller command.
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 25
      responses:
        '200':
          description: A command for this cluster. Commands may be returned again until the controller reports that the requested state was materialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerCommand'
        '204':
          description: No controller command became available before the poll completed.
        '400':
          description: The poll timeout is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The controller credential is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The HTTP method is not supported for this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The controller poll could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
