openapi: 3.1.0
info:
  title: Slipramp API
  version: 0.1.0
  description: HTTP API for the Slipramp Server.
servers:
  - url: /
paths:
  /healthz:
    $ref: ./paths/system.yaml#/health
  /readyz:
    $ref: ./paths/system.yaml#/readiness
  /api/v1/repositories:
    $ref: ./paths/repositories.yaml#/repositories
  /api/v1/inbox:
    $ref: ./paths/inbox.yaml#/inbox
  /api/v1/inbox/problem-acknowledgements:
    $ref: ./paths/inbox.yaml#/problemAcknowledgements
  /api/v1/notification-deliveries:
    $ref: ./paths/notifications.yaml#/notificationDeliveries
  /api/v1/repositories/{repositoryId}:
    $ref: ./paths/repositories.yaml#/repository
  /api/v1/git-trigger-deliveries/failed:
    $ref: ./paths/repositories.yaml#/failedGitTriggerDeliveries
  /api/v1/commits:
    $ref: ./paths/repositories.yaml#/repositoryCommits
  /api/v1/repositories/{repositoryId}/commits/{commitSha}:
    $ref: ./paths/repositories.yaml#/repositoryCommit
  /api/v1/repositories/{repositoryId}/catalog:
    $ref: ./paths/catalog.yaml#/repositoryCatalog
  /api/v1/repositories/{repositoryId}/catalog/targets/{targetName}/actions/{actionName}/explanation:
    $ref: ./paths/catalog.yaml#/actionExplanation
  /api/v1/targets:
    $ref: ./paths/catalog.yaml#/targets
  /api/v1/clusters:
    $ref: ./paths/controllers.yaml#/clusters
  /controller/v1/enroll:
    $ref: ./paths/controllers.yaml#/enroll
  /controller/v1/poll:
    $ref: ./paths/controllers.yaml#/poll
  /controller/v1/promotions/{promotionId}/dispatch:
    $ref: ./paths/controllers.yaml#/promotionDispatch
  /controller/v1/promotions/{promotionId}/reconciliation:
    $ref: ./paths/controllers.yaml#/promotionReconciliation
  /controller/v1/runs/{runId}/observations:
    $ref: ./paths/controllers.yaml#/runObservations
  /controller/v1/runs/{runId}/log-chunks:
    $ref: ./paths/controllers.yaml#/runLogChunks
  /controller/v1/runs/{runId}/log:
    $ref: ./paths/controllers.yaml#/runLog
  /controller/v1/runs/{runId}/log/failure:
    $ref: ./paths/controllers.yaml#/runLogFailure
  /execution/v1/runs/{runId}/artifacts/{artifactName}:
    $ref: ./paths/artifacts.yaml#/executionArtifact
  /execution/v1/runs/{runId}/inputs/{inputName}:
    $ref: ./paths/artifacts.yaml#/executionInput
  /api/v1/runs:
    $ref: ./paths/runs.yaml#/runs
  /api/v1/runs/{runId}:
    $ref: ./paths/runs.yaml#/run
  /api/v1/runs/{runId}/cancel:
    $ref: ./paths/runs.yaml#/cancelRun
  /api/v1/runs/{runId}/rerun:
    $ref: ./paths/runs.yaml#/rerunRun
  /api/v1/runs/{runId}/artifacts:
    $ref: ./paths/artifacts.yaml#/runArtifacts
  /api/v1/runs/{runId}/logs:
    $ref: ./paths/artifacts.yaml#/runLogs
  /api/v1/artifacts/{artifactId}/download:
    $ref: ./paths/artifacts.yaml#/artifactDownload
  /api/v1/auth/login:
    $ref: ./paths/authentication.yaml#/login
  /api/v1/auth/callback:
    $ref: ./paths/authentication.yaml#/callback
  /api/v1/auth/session:
    $ref: ./paths/authentication.yaml#/session
  /api/v1/auth/logout:
    $ref: ./paths/authentication.yaml#/logout
  /api/v1/auth/api-keys:
    $ref: ./paths/authentication.yaml#/apiKeys
  /api/v1/auth/api-keys/{apiKeyId}:
    $ref: ./paths/authentication.yaml#/apiKey
  /api/v1/service-accounts:
    $ref: ./paths/authentication.yaml#/serviceAccounts
  /api/v1/service-accounts/{principalId}:
    $ref: ./paths/authentication.yaml#/serviceAccount
  /api/v1/service-accounts/{principalId}/api-keys:
    $ref: ./paths/authentication.yaml#/serviceAccountAPIKeys
  /api/v1/kargo/{integration}/promotions:
    $ref: ./paths/promotions.yaml#/kargoPromotion
  /api/v1/promotions:
    $ref: ./paths/promotions.yaml#/promotions
  /api/v1/promotions/{promotionId}:
    $ref: ./paths/promotions.yaml#/promotion
  /api/v1/promotions/{promotionId}/decision:
    $ref: ./paths/promotions.yaml#/promotionDecision
  /api/v1/promotion-projects:
    $ref: ./paths/promotions.yaml#/promotionProjects
  /api/v1/promotion-stages:
    $ref: ./paths/promotions.yaml#/promotionStages
  /api/v1/promotion-stages/{stageId}/promotions:
    $ref: ./paths/promotions.yaml#/promotionStagePromotions
  /api/v1/promotion-stages/{stageId}/policy:
    $ref: ./paths/promotions.yaml#/promotionStagePolicy
  /api/v1/promotion-pipelines:
    $ref: ./paths/promotions.yaml#/promotionPipelines
  /api/v1/promotion-branch-drift:
    $ref: ./paths/promotions.yaml#/promotionBranchDrift
  /controller/v1/kargo/{integration}/stages:
    $ref: ./paths/promotions.yaml#/controllerKargoStages
components:
  securitySchemes:
    ProductSession:
      type: apiKey
      in: cookie
      name: slipramp_session
      description: Opaque local browser session issued by the Slipramp Server.
    ProductBearer:
      type: http
      scheme: bearer
      description: Slipramp API key for a product principal.
    ControllerBearer:
      type: http
      scheme: bearer
    ControllerEnrollmentBearer:
      type: http
      scheme: bearer
    RunArtifactBearer:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      $ref: ./components/common.yaml#/HealthResponse
    ReadinessResponse:
      $ref: ./components/common.yaml#/ReadinessResponse
    DependencyStatus:
      $ref: ./components/common.yaml#/DependencyStatus
    GitCommit:
      $ref: ./components/common.yaml#/GitCommit
    Problem:
      $ref: ./components/common.yaml#/Problem
    Inbox:
      $ref: ./components/inbox.yaml#/Inbox
    InboxCapabilities:
      $ref: ./components/inbox.yaml#/InboxCapabilities
    InboxActivity:
      $ref: ./components/inbox.yaml#/InboxActivity
    InboxItem:
      $ref: ./components/inbox.yaml#/InboxItem
    InboxDestination:
      $ref: ./components/inbox.yaml#/InboxDestination
    InboxProblemAcknowledgements:
      $ref: ./components/inbox.yaml#/InboxProblemAcknowledgements
    NotificationDelivery:
      $ref: ./components/notifications.yaml#/NotificationDelivery
    NotificationDeliveryList:
      $ref: ./components/notifications.yaml#/NotificationDeliveryList
    ProductPrincipal:
      $ref: ./components/authentication.yaml#/ProductPrincipal
    APIKey:
      $ref: ./components/authentication.yaml#/APIKey
    APIKeyList:
      $ref: ./components/authentication.yaml#/APIKeyList
    APIKeyCreate:
      $ref: ./components/authentication.yaml#/APIKeyCreate
    APIKeyCredential:
      $ref: ./components/authentication.yaml#/APIKeyCredential
    ServiceAccount:
