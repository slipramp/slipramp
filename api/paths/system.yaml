health:
  get:
    operationId: getHealth
    summary: Check server health
    description: Reports whether the Slipramp Server process is serving HTTP requests.
    security: []
    tags:
      - System
    responses:
      "200":
        description: The server is healthy.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/HealthResponse
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

readiness:
  get:
    operationId: getReadiness
    summary: Check server readiness
    description: >-
      Reports whether the Slipramp Server can reach the PostgreSQL database and
      artifact storage required to serve product, controller, and execution
      requests. Dependency errors are intentionally omitted.
    security: []
    tags:
      - System
    responses:
      "200":
        description: The server and its required dependencies are ready.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ReadinessResponse
      "503":
        description: One or more required dependencies are unavailable.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ReadinessResponse
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

clientCompatibility:
  get:
    operationId: getClientCompatibility
    summary: Check client compatibility
    description: >-
      Reports the Server release, exact pre-stable product API contract, and
      authentication methods available to native clients before they submit a
      credential, plus non-sensitive feature availability needed to shape the
      product shell. The response excludes identity-provider details and
      sensitive deployment configuration.
    security: []
    tags:
      - System
    responses:
      "200":
        description: Client compatibility information for this Server.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ClientCompatibility
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

search:
  get:
    operationId: searchResources
    summary: Search Targets, Kargo Stages, and Pipelines
    description: >-
      Matches all whitespace-separated terms across names and their context,
      ignoring case. Returns up to five matches per kind, with exact names and
      prefixes first. Kargo results include only active, configured observations.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - System
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    responses:
      "200":
        description: Ranked results grouped by resource kind.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/SearchResults
      "400":
        description: The search query is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Search could not be completed.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
