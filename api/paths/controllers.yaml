clusters:
  get:
    operationId: listClusters
    summary: List execution clusters
    description: >-
      Lists clusters observed through authenticated controller requests and
      reports whether each controller has checked in recently enough to be
      considered connected.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Controllers
    parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: connection
        in: query
        schema:
          type: string
          enum: [connected, unreachable]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Execution clusters ordered by name.
        content:
          application/json:
            schema:
              $ref: ../components/controllers.yaml#/ClusterList
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "400":
        description: The list window is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Cluster observations could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

enroll:
  post:
    operationId: enrollController
    summary: Enroll a cluster controller
    description: >-
      Uses a cluster-scoped enrollment credential to bind a
      controller-generated bearer credential to its cluster. Repeating an
      enrollment with the same credential digest is idempotent.
    security:
      - ControllerEnrollmentBearer: []
    tags:
      - Controllers
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/controllers.yaml#/ControllerEnrollment
    responses:
      "204":
        description: The controller credential is enrolled.
      "400":
        description: The enrollment request is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: The enrollment credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The cluster is already enrolled with another credential.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The controller could not be enrolled.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

poll:
  post:
    operationId: pollForControllerCommand
    summary: Poll for a controller command
    description: >-
      Records the authenticated cluster controller as healthy and waits to
      assign or cancel a Run or create a Kargo Promotion for its cluster. An
      empty response means no command became available before the requested
      wait elapsed.
    security:
      - ControllerBearer: []
    tags:
      - Controllers
    parameters:
      - name: timeoutSeconds
        in: query
        required: false
        description: Maximum time to wait for a controller command.
        schema:
          type: integer
          minimum: 0
          maximum: 30
          default: 25
    responses:
      "200":
        description: >-
          A command for this cluster. Commands may be returned again until the
          controller reports that the requested state was materialized.
        content:
          application/json:
            schema:
              $ref: ../components/controllers.yaml#/ControllerCommand
      "204":
        description: No controller command became available before the poll completed.
      "400":
        description: The poll timeout is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: The controller credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The controller poll could not be completed.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

promotionDispatch:
  post:
    operationId: reportKargoPromotionDispatch
    summary: Report Kargo Promotion creation
    description: >-
      Reports the result of materializing an operator-started Kargo Promotion.
      Repeating a report for the same attempt and result is idempotent. A stale
      report cannot move a Promotion backward.
    security:
      - ControllerBearer: []
    tags:
      - Controllers
    parameters:
      - name: promotionId
        in: path
        required: true
        description: Slipramp Promotion whose Kargo resource was dispatched.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/controllers.yaml#/KargoPromotionDispatchReport
    responses:
      "204":
        description: The dispatch result was recorded or was already reflected in newer state.
      "400":
        description: The dispatch report is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: The controller credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Promotion is not assigned to this controller's cluster.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The report conflicts with the materialized Kargo Promotion identity.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The dispatch result could not be recorded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

runObservations:
  post:
    operationId: reportRunObservation
    summary: Report a Run observation
    description: >-
      Records the phase, terminal outcome, and diagnostic details observed by
      the authenticated controller managing the Run's execution cluster.
      Repeating the current observation refreshes its freshness timestamp. An
      accepted observation also refreshes the cluster's connection status.
    security:
      - ControllerBearer: []
    tags:
      - Controllers
    parameters:
      - name: runId
        in: path
        required: true
        description: Run observed by this controller.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/controllers.yaml#/RunObservation
    responses:
      "204":
        description: The observation was recorded.
      "400":
        description: The reported observation is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: The controller credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run is not assigned to this controller's cluster.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The observation conflicts with the Run or its Job.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Run observation could not be recorded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

runLogChunks:
  post:
    operationId: appendRunLogChunk
    summary: Append a Run log chunk
    description: >-
      Durably stores a log chunk for a Run managed by the authenticated
      controller. Repeating the same bytes at the same offset is idempotent.
    security:
      - ControllerBearer: []
    tags:
      - Controllers
    parameters:
      - name: runId
        in: path
        required: true
        description: Run whose action output produced this chunk.
        schema:
          type: string
          format: uuid
      - name: offsetBytes
        in: query
        required: true
        description: Zero-based byte offset of the chunk in the complete log.
        schema:
          type: integer
          format: int64
          minimum: 0
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            minLength: 1
            maxLength: 262144
    responses:
      "204":
        description: The chunk was durably accepted or had already been accepted.
      "400":
        description: The chunk offset or body is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: The controller credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run does not belong to the authenticated controller.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The offset is already occupied by different bytes or the log is closed.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "413":
        description: The chunk exceeds the maximum accepted size.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The chunk could not be stored durably.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

runLog:
  get:
    operationId: getRunLogCursor
    summary: Get the durable Run log cursor
    security:
      - ControllerBearer: []
    tags: [Controllers]
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: The next durable byte offset and lifecycle state.
        content:
          application/json:
            schema:
              $ref: ../components/artifacts.yaml#/LogCursor
      "401":
        description: The controller credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run does not belong to this controller.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The cursor could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  post:
    operationId: sealRunLog
    summary: Seal the durable Run log
    security:
      - ControllerBearer: []
    tags: [Controllers]
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/artifacts.yaml#/LogSeal
    responses:
      "204": { description: The log was sealed or already matched the seal. }
      "400":
        description: The seal is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: The controller credential is missing or invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run does not belong to this controller.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The seal conflicts with the durable bytes.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The log could not be sealed.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
