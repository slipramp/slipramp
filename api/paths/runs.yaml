runs:
  get:
    operationId: listRuns
    summary: List recent Runs
    description: >-
      Lists Runs in descending creation order with offset pagination.
      Repository, commit, input artifact, target, cluster, phase, and review
      state filters scope execution history.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Runs
    parameters:
      - name: repositoryId
        in: query
        required: false
        description: Limit results to one repository.
        schema:
          type: string
          format: uuid
      - name: targetId
        in: query
        required: false
        description: Limit results to one durable Target.
        schema:
          type: string
          format: uuid
      - name: commitSha
        in: query
        required: false
        description: >-
          Limit results to Runs pinned to this full Git object ID. Requires
          repositoryId.
        schema:
          type: string
          pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
      - name: inputArtifactId
        in: query
        required: false
        description: Limit results to Runs that consume this exact artifact.
        schema:
          type: string
          format: uuid
      - name: cluster
        in: query
        required: false
        description: Limit results to Runs assigned to one execution cluster.
        schema:
          $ref: ../components/runs.yaml#/CatalogName
      - name: phase
        in: query
        required: false
        description: Limit results to one durable lifecycle phase.
        schema:
          type: string
          enum: [queued, assigned, preparing, running, finished]
      - name: reviewState
        in: query
        required: false
        description: Limit results to one Run review state.
        schema:
          $ref: ../components/runs.yaml#/RunReviewState
      - name: limit
        in: query
        required: false
        description: Maximum number of recent Runs to return.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        required: false
        description: Zero-based offset into the matching Runs.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Recent Runs matching the requested filters.
        content:
          application/json:
            schema:
              $ref: ../components/runs.yaml#/RunList
      "400":
        description: A filter or pagination value is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Run history could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  post:
    operationId: createRun
    summary: Create an action run
    description: >-
      Resolves an action against the repository's active catalog revision, or
      the producing revision when explicit artifact inputs are selected, and
      persists an immutable queued Run. The Run remains pinned to the resolved
      catalog revision and Git commit even if the repository refreshes later.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Runs
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Optional key that makes retries of the same run request return the
          originally created Run. Authenticated keys are scoped to the calling
          principal. Reusing a key for a different request is a conflict.
        schema:
          type: string
          minLength: 1
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/runs.yaml#/RunCreate
    responses:
      "201":
        description: The queued Run was created or recovered by idempotency key.
        content:
          application/json:
            schema:
              $ref: ../components/runs.yaml#/Run
      "400":
        description: The run request or supplied parameters are invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Operator permission and runs-write scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: >-
          The active Target, catalog, action, runtime, or placement
          required by the request does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The idempotency key was already used for another request.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Run could not be created.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

run:
  get:
    operationId: getRun
    summary: Get a Run
    security:
      - ProductSession: []
      - ProductBearer: []
    tags: [Runs]
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: The immutable Run and its observed lifecycle state.
        content:
          application/json:
            schema:
              $ref: ../components/runs.yaml#/Run
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Run could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

cancelRun:
  post:
    operationId: cancelRun
    summary: Cancel a Run
    description: >-
      Records a cancel request idempotently. A queued Run finishes as canceled
      immediately; an active Run remains active until its cluster controller
      removes the execution Job and reports the canceled outcome.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Runs
    parameters:
      - name: runId
        in: path
        required: true
        description: Run to cancel.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Cancel was requested or had already been requested.
        content:
          application/json:
            schema:
              $ref: ../components/runs.yaml#/Run
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Operator permission and runs-write scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: The Run already finished without a cancel request.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Run could not be canceled.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

rerunRun:
  post:
    operationId: rerunRun
    summary: Rerun a finished Run
    description: >-
      Creates a new immutable queued Run from a finished Run. Exact mode reuses
      the original frozen execution snapshot. Latest mode resolves the same
      target, action, and parameters against the active catalog and current
      placement configuration. Latest mode is unavailable when the original
      Run has artifact inputs.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Runs
    parameters:
      - name: runId
        in: path
        required: true
        description: Finished Run to execute again.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Optional key that makes retries of the same rerun request return the
          originally created Run. Authenticated keys are scoped to the calling
          principal. Reusing a key for a different request is a conflict.
        schema:
          type: string
          minLength: 1
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/runs.yaml#/RunRerun
    responses:
      "201":
        description: The queued rerun was created or recovered by idempotency key.
        content:
          application/json:
            schema:
              $ref: ../components/runs.yaml#/Run
      "400":
        description: The request or parameters are invalid for the selected mode.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Operator permission and runs-write scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: >-
          The original Run or a current catalog resource required by latest
          mode does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: >-
          The original Run is unfinished, latest mode cannot reuse its artifact
          inputs, an exact input is unavailable, or the idempotency key conflicts.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The rerun could not be created.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

decideRunReview:
  post:
    operationId: decideRunReview
    summary: Decide a Run review
    description: >-
      Approves or rejects a queued Git-triggered Run awaiting review. Approval
      makes the existing Run eligible for ordinary FIFO assignment. Rejection
      finishes it as canceled. An optional comment is recorded immutably with
      the decision.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Runs
    parameters:
      - name: runId
        in: path
        required: true
        description: Queued Run awaiting review.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/runs.yaml#/RunReviewDecisionRequest
    responses:
      "200":
        description: The decision was recorded or an identical decision was repeated.
        content:
          application/json:
            schema:
              $ref: ../components/runs.yaml#/Run
      "400":
        description: The decision is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Operator permission and runs-review scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Run does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: >-
          The Run is no longer queued and pending review, or already has a
          different decision or deciding Principal.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Run review could not be decided.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
