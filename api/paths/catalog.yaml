repositoryCatalog:
  get:
    operationId: getRepositoryCatalog
    summary: Get the active repository catalog
    description: >-
      Returns the immutable catalog revision currently active for an existing
      repository. A repository without an accepted catalog does not have this
      resource yet.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Catalog
    parameters:
      - name: repositoryId
        in: path
        required: true
        description: Stable identity of the repository registration.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The repository's active catalog revision.
        content:
          application/json:
            schema:
              $ref: ../components/catalog.yaml#/CatalogRevision
      "400":
        description: The repository identity is not a valid UUID.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: >-
          The active repository does not exist or does not have an accepted
          catalog revision.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The active catalog could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

actionExplanation:
  get:
    operationId: explainTargetAction
    summary: Explain an Action from an active Target
    description: >-
      Returns the effective execution contract for one Action using the
      Slipramp Server's current Placement configuration. Required parameters
      may be omitted for this read-only explanation; Run creation remains
      strict. Credential values and arbitrary Placement pod configuration are
      never returned.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Catalog
    parameters:
      - name: targetId
        in: path
        required: true
        description: Stable identity of the Target.
        schema:
          type: string
          format: uuid
      - name: actionName
        in: path
        required: true
        description: Stable technical name of the Action.
        schema:
          $ref: ../components/runs.yaml#/CatalogName
    responses:
      "200":
        description: The effective Action execution contract and provenance.
        content:
          application/json:
            schema:
              $ref: ../components/catalog.yaml#/CatalogExplanation
      "400":
        description: A path parameter is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: >-
          The active Target or Action does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Action explanation could not be resolved.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

targets:
  get:
    operationId: listTargets
    summary: List active targets
    description: >-
      Lists target summaries across active repository catalogs, ordered by
      display title, repository name, and target name. Search matches target
      names and titles, repository names, and action names.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Catalog
    parameters:
      - name: repositoryId
        in: query
        required: false
        description: Limit targets to one active repository.
        schema:
          type: string
          format: uuid
      - name: runtime
        in: query
        required: false
        description: Limit targets to an exact target-level Runtime default.
        schema:
          $ref: ../components/runs.yaml#/CatalogName
      - name: placement
        in: query
        required: false
        description: Limit targets to an exact target-level Placement default.
        schema:
          $ref: ../components/runs.yaml#/CatalogName
      - name: q
        in: query
        required: false
        description: Case-insensitive target, repository, or action search.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: limit
        in: query
        required: false
        description: Maximum number of target summaries to return.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        required: false
        description: Zero-based offset into the matching target summaries.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Active targets matching the requested filters.
        content:
          application/json:
            schema:
              $ref: ../components/catalog.yaml#/TargetSummaryList
      "400":
        description: A filter, limit, or offset is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Active targets could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

target:
  get:
    operationId: getTarget
    summary: Get a Target
    description: >-
      Returns a durable Target with its most recently accepted definition.
      Archived Targets remain addressable for historical navigation.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Catalog
    parameters:
      - name: targetId
        in: path
        required: true
        description: Stable identity of the Target.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The Target and its most recently accepted definition.
        content:
          application/json:
            schema:
              $ref: ../components/catalog.yaml#/Target
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The Target does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The Target could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
