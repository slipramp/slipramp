repositories:
  get:
    operationId: listRepositories
    summary: List repositories
    description: Lists active repository registrations ordered by name.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: refreshStatus
        in: query
        description: Limit results to the latest repository refresh result.
        schema:
          type: string
          enum: [pending, succeeded, failed]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Active repository registrations.
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/RepositoryList
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "400":
        description: The list window is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Repository registrations could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  post:
    operationId: createRepository
    summary: Register a repository
    description: >-
      Registers one Git repository and branch for later refresh. Credential
      name fields refer to configured secret sources; secret values are not
      accepted.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/repositories.yaml#/RepositoryConfig
    responses:
      "201":
        description: Repository registered.
        headers:
          Location:
            description: URL of the repository registration.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/Repository
      "400":
        description: The repository configuration is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "409":
        description: An active repository already uses the requested name.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The repository could not be registered.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

repository:
  patch:
    operationId: updateRepository
    summary: Update a repository
    description: Updates mutable indexing behavior for an active repository registration.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: repositoryId
        in: path
        required: true
        description: Stable identity of the repository registration.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/repositories.yaml#/RepositoryUpdate
    responses:
      "200":
        description: Updated repository registration.
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/Repository
      "400":
        description: The repository update is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The active repository does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The repository could not be updated.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  delete:
    operationId: removeRepository
    summary: Remove a repository
    description: >-
      Removes a repository from the active set without erasing its durable
      identity or future historical references.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: repositoryId
        in: path
        required: true
        description: Stable identity of the repository registration.
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Repository removed.
      "400":
        description: The repository identity is not a valid UUID.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The active repository does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The repository could not be removed.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

repositoryRefreshAttempts:
  get:
    operationId: listRepositoryRefreshAttempts
    summary: List repository refresh attempts
    description: Lists the retained immutable refresh attempts for one active repository, newest first.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Retained refresh attempt history.
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/RepositoryRefreshAttemptList
      "400":
        description: The list window or repository identity is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The active repository does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Refresh attempts could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  post:
    operationId: refreshRepository
    summary: Refresh a repository now
    description: >-
      Starts one requested repository refresh through the same serialized fetch,
      validation, catalog activation, and Git-trigger delivery path used by
      periodic refreshes. The response is the completed durable attempt.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "201":
        description: Requested refresh completed and its attempt was recorded.
        headers:
          Location:
            description: API collection containing the retained attempt history.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/RepositoryRefreshAttempt
      "400":
        description: The repository identity is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The active repository does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The repository refresh could not be completed or recorded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

repositoryCommits:
  get:
    operationId: listCommits
    summary: List indexed commits
    description: >-
      Lists commits reachable from the most recently indexed tracked branch
      head, newest first. The result may lag the observed branch head while a
      history index is pending.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: repositoryId
        in: query
        description: Limit results to one repository registration.
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Match a commit SHA, title, or author name.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Indexed commits reachable from the tracked branch.
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/RepositoryCommitList
      "400":
        description: The list window is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Indexed commits could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

repositoryCommit:
  get:
    operationId: getCommit
    summary: Get a known commit
    description: >-
      Gets a commit known to Slipramp for an active repository. Known commits
      include indexed branch history and commits referenced by product state.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: commitSha
        in: path
        required: true
        schema:
          type: string
          pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
    responses:
      "200":
        description: The known commit and its repository.
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/RepositoryCommit
      "400":
        description: The repository ID or commit SHA is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The active repository or known commit does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The commit could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

failedGitTriggerDeliveries:
  get:
    operationId: listFailedGitTriggerDeliveries
    summary: List failed Git-trigger deliveries
    description: >-
      Terminal failures creating automatic Runs, newest failure first. Delivery
      retries never retry execution of a Run. Diagnostics exclude underlying
      errors, credentials, and parameter values.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Repositories
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
    responses:
      "200":
        description: Terminal failed Git-trigger deliveries.
        content:
          application/json:
            schema:
              $ref: ../components/repositories.yaml#/FailedGitTriggerDeliveryList
      "400":
        description: The list window is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: The authenticated principal cannot read product state.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: Failed deliveries could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
