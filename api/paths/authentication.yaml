      "500":
        description: API key metadata could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  post:
    operationId: createPrincipalAPIKey
    summary: Create an API key for a service-account Principal
    description: >-
      Creates a credential only when the selected Principal is a service
      account. The complete token is returned once and is never available from
      later reads.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Authentication
    requestBody:
      required: true
