        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  delete:
    operationId: revokePrincipalAPIKeys
    summary: Revoke every API key for a product principal
    description: >-
      Idempotently revokes every API key for the Principal while retaining its
      credential metadata and original revocation timestamps.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Authentication
    responses:
