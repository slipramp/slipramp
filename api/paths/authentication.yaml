            schema:
              $ref: ../components/common.yaml#/Problem

principal:
  parameters:
    - name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getPrincipal
    summary: Get a product principal
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Authentication
    responses:
      "200":
        description: Product principal identity and state.
        content:
          application/json:
            schema:
              $ref: ../components/authentication.yaml#/Principal
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The principal does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The principal could not be loaded.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
  patch:
    operationId: updatePrincipal
    summary: Enable or disable a product principal
    description: >-
      Idempotently changes the Principal disabled state. Disabling immediately
      prevents its existing sessions and API keys from authenticating without
      revoking those credentials.
    security:
      - ProductSession: []
      - ProductBearer: []
    tags:
      - Authentication
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/authentication.yaml#/PrincipalUpdate
    responses:
      "200":
        description: The updated product principal.
        content:
          application/json:
            schema:
              $ref: ../components/authentication.yaml#/Principal
      "400":
        description: The principal state update is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and scope are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The principal does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
        description: The principal state could not be changed.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem

