            schema:
              $ref: ../components/authentication.yaml#/APIKeyCredential
      "400":
        description: The API key or principal identity is invalid.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "401":
        description: A valid product session or bearer credential is required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "403":
        description: Administrator permission and a service-account Principal are required.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "404":
        description: The principal does not exist.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "405":
        description: The HTTP method is not supported for this resource.
        content:
          application/problem+json:
            schema:
              $ref: ../components/common.yaml#/Problem
      "500":
