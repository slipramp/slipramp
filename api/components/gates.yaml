GateSummary:
  type: object
  required:
    - state
    - requirements
  properties:
    state:
      $ref: "#/GateSummaryState"
    requirements:
      type: array
      items:
        $ref: "#/GateRequirement"
      description: Required Gates in their stable attachment order.

GateSummaryState:
  type: string
  description: Stopped means cancellation ended the wait before Gate release.
  enum:
    - not-required
    - waiting
    - stopped
    - released

GateRequirement:
  type: object
  required:
    - name
    - state
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    title:
      type: string
      minLength: 1
    state:
      $ref: "#/GateRequirementState"
    queryUrl:
      type: string
      format: uri
      description: Opens the active or released PromQL in the configured viewer at the observation time, when available.
    definitionDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: Digest of the active or released Gate definition.
    overrides:
      type: array
      description: Operator decisions in chronological order. The latest applies when its digest matches the definition.
      items:
        $ref: "#/GateOverride"
    value:
      type: number
      format: double
      description: Finite observed value from current or immutable release evidence.
    operator:
      $ref: "#/GateOperator"
    threshold:
      type: number
      format: double
      description: Finite comparison threshold from the current or released definition.
    evaluatedAt:
      type: string
      format: date-time
    releasedAt:
      type: string
      format: date-time
    diagnostic:
      type: string
      minLength: 1
      maxLength: 512
      description: Bounded sanitized explanation for an unavailable requirement.

GateRequirementState:
  type: string
  description: Stopped requirements retain the attached Gate name and have no release evidence or current observation.
  enum:
    - unevaluated
    - passing
    - blocking
    - unavailable
    - stopped
    - released

GateOperator:
  type: string
  enum:
    - equal
    - not-equal
    - less-than
    - less-than-or-equal
    - greater-than
    - greater-than-or-equal
  x-enum-varnames:
    - GateOperatorEqual
    - GateOperatorNotEqual
    - GateOperatorLessThan
    - GateOperatorLessThanOrEqual
    - GateOperatorGreaterThan
    - GateOperatorGreaterThanOrEqual

GateOverrideRequest:
  type: object
  additionalProperties: false
  required: [definitionDigest, reason]
  properties:
    definitionDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
    reason:
      type: string
      minLength: 1
      maxLength: 1024

GateOverride:
  type: object
  required: [definitionDigest, reason, actor, recordedAt, observedState]
  properties:
    definitionDigest:
      type: string
    reason:
      type: string
    actor:
      $ref: ./common.yaml#/ActorSnapshot
    recordedAt:
      type: string
      format: date-time
    observedState:
      $ref: "#/GateRequirementState"
    observedValue:
      type: number
      format: double
    evaluatedAt:
      type: string
      format: date-time
    diagnostic:
      type: string
