GateSummary:
  type: object
  required:
    - state
    - requirements
  properties:
    state:
      $ref: "#/GateSummaryState"
    requirements:
      type: array
      items:
        $ref: "#/GateRequirement"
      description: Required Gates in their stable attachment order.

GateSummaryState:
  type: string
  description: Stopped means cancellation ended the wait before Gate release.
  enum:
    - not-required
    - waiting
    - stopped
    - released

GateRequirement:
  type: object
  required:
    - name
    - state
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    title:
      type: string
      minLength: 1
    state:
      $ref: "#/GateRequirementState"
    value:
      type: number
      format: double
      description: Finite observed value from current or immutable release evidence.
    operator:
      $ref: "#/GateOperator"
    threshold:
      type: number
      format: double
      description: Finite comparison threshold from the current or released definition.
    evaluatedAt:
      type: string
      format: date-time
    releasedAt:
      type: string
      format: date-time
    diagnostic:
      type: string
      minLength: 1
      maxLength: 512
      description: Bounded sanitized explanation for an unavailable requirement.

GateRequirementState:
  type: string
  description: Stopped requirements retain the attached Gate name and have no release evidence or current observation.
  enum:
    - unevaluated
    - passing
    - blocking
    - unavailable
    - stopped
    - released

GateOperator:
  type: string
  enum:
    - equal
    - not-equal
    - less-than
    - less-than-or-equal
    - greater-than
    - greater-than-or-equal
  x-enum-varnames:
    - GateOperatorEqual
    - GateOperatorNotEqual
    - GateOperatorLessThan
    - GateOperatorLessThanOrEqual
    - GateOperatorGreaterThan
    - GateOperatorGreaterThanOrEqual
