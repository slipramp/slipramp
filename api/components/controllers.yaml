Cluster:
  type: object
  required:
    - name
    - connectionState
    - firstSeenAt
    - lastSeenAt
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Stable logical name of the execution cluster.
    connectionState:
      type: string
      enum:
        - connected
        - unreachable
      description: >-
        Whether the cluster controller has contacted the Server within the
        connection window.
    firstSeenAt:
      type: string
      format: date-time
      description: Time at which this Server first observed the controller.
    lastSeenAt:
      type: string
      format: date-time
      description: Time at which the Server most recently heard from the controller.

ClusterList:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/Cluster"

RunObservation:
  type: object
  required:
    - phase
  properties:
    phase:
      type: string
      enum:
        - preparing
        - running
        - finished
      description: Lifecycle phase observed from the Run's Kubernetes Job.
    outcome:
      type: string
      enum:
        - succeeded
        - failed
        - canceled
        - timed-out
      description: Terminal result; required when phase is finished.
    jobUid:
      type: string
      minLength: 1
      description: >-
        Kubernetes UID of the materialized Job. Required for preparing and
        running observations and for every observation after the Run is bound
        to a Job.
    reason:
      type: string
      minLength: 1
    message:
      type: string
      minLength: 1
    exitCode:
      type: integer
      format: int32
      minimum: 0

ControllerCommand:
  type: object
  required:
    - type
    - assignment
  properties:
    type:
      type: string
      enum:
        - run-assignment
    assignment:
      $ref: "#/RunAssignment"

RunAssignment:
  type: object
  required:
    - id
    - catalogRevisionId
    - commitSha
    - parameters
    - repository
    - target
    - action
    - runtime
    - placement
  properties:
    id:
      type: string
      format: uuid
      description: Stable Run identity used to derive Kubernetes object names.
    catalogRevisionId:
      type: string
      format: uuid
      description: Immutable catalog revision against which the Run was resolved.
    commitSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Exact Git commit the execution Job must check out.
    parameters:
      type: object
      additionalProperties:
        $ref: ./runs.yaml#/ParameterValue
      description: Validated values for the action's declared parameters.
    repository:
      $ref: "#/RunAssignmentRepository"
    target:
      $ref: "#/RunAssignmentTarget"
    action:
      $ref: "#/RunAssignmentAction"
    runtime:
      $ref: "#/RunAssignmentRuntime"
    placement:
      $ref: "#/RunAssignmentPlacement"

RunAssignmentRepository:
  type: object
  required:
    - name
    - cloneUrl
    - branch
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cloneUrl:
      type: string
      minLength: 1
    branch:
      type: string
      minLength: 1
    checkoutCredentialName:
      $ref: ./runs.yaml#/CatalogName

RunAssignmentTarget:
  type: object
  required:
    - name
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    path:
      type: string
      minLength: 1

RunAssignmentAction:
  type: object
  required:
    - name
    - command
    - runtime
    - placement
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    intent:
      type: string
      minLength: 1
    command:
      type: array
      minItems: 1
      items:
        type: string
    runtime:
      $ref: ./runs.yaml#/CatalogName
    placement:
      $ref: ./runs.yaml#/CatalogName
    credentials:
      type: object
      additionalProperties:
        $ref: ./runs.yaml#/CatalogName
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: ./catalog.yaml#/ResourceRequirements
    parameterDefinitions:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/Parameter
    artifacts:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/ArtifactDeclaration
    inputs:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/ArtifactInput

RunAssignmentRuntime:
  type: object
  required:
    - name
    - image
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    image:
      type: string
      minLength: 1
    workingDirectory:
      type: string
      minLength: 1
    environment:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/RuntimeCredential

RunAssignmentPlacement:
  type: object
  required:
    - name
    - cluster
    - jobNamespace
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    jobNamespace:
      $ref: ./runs.yaml#/CatalogName
    serviceAccountName:
      type: string
      minLength: 1
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: ./catalog.yaml#/ResourceRequirements
    nodeSelector:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: "#/RunAssignmentCredential"
    podTemplate:
      type: object
      additionalProperties: true
      description: Validated placement PodTemplateSpec extensions.

RunAssignmentCredential:
  type: object
  required:
    - secretName
  properties:
    secretName:
      type: string
      minLength: 1
