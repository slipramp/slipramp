Cluster:
  type: object
  required:
    - name
    - connectionState
    - firstSeenAt
    - lastSeenAt
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Stable logical name of the execution cluster.
    connectionState:
      type: string
      enum:
        - connected
        - unreachable
      description: >-
        Whether the cluster controller has contacted the Server within the
        connection window.
    firstSeenAt:
      type: string
      format: date-time
      description: Time at which this Server first observed the controller.
    lastSeenAt:
      type: string
      format: date-time
      description: Time at which the Server most recently heard from the controller.

ClusterList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Cluster"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

ControllerEnrollment:
  type: object
  required:
    - clusterName
    - credentialSha256
  properties:
    clusterName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Cluster identity authorized by the enrollment credential.
    credentialSha256:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: >-
        SHA-256 digest of the controller-generated bearer credential that will
        identify this cluster after enrollment.

RunObservation:
  type: object
  required:
    - phase
  properties:
    phase:
      type: string
      enum:
        - preparing
        - running
        - finished
      description: Lifecycle phase observed from the Run's Kubernetes Job.
    outcome:
      type: string
      enum:
        - succeeded
        - failed
        - canceled
        - timed-out
      description: Terminal result; required when phase is finished.
    jobUid:
      type: string
      minLength: 1
      description: >-
        Kubernetes UID of the materialized Job. Required for preparing and
        running observations and for every observation after the Run is bound
        to a Job.
    images:
      $ref: ./common.yaml#/ExecutionImages
    reason:
      type: string
      minLength: 1
    message:
      type: string
      minLength: 1
    exitCode:
      type: integer
      format: int32
      minimum: 0

ControllerCommand:
  type: object
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - run-assignment
        - cancel-run
        - create-kargo-promotion
        - reconcile-kargo-promotion
        - placement-preflight
    assignment:
      $ref: "#/RunAssignment"
      description: Present when type is run-assignment.
    cancel:
      $ref: "#/CancelRunCommand"
      description: Present when type is cancel-run.
    promotion:
      $ref: "#/KargoPromotionCreationCommand"
      description: Present when type is create-kargo-promotion.
    promotionReconciliation:
      $ref: "#/KargoPromotionReconciliationCommand"
      description: Present when type is reconcile-kargo-promotion.
    placementPreflight:
      $ref: "#/PlacementPreflightCommand"
      description: Present when type is placement-preflight.

PlacementPreflightCommand:
  type: object
  additionalProperties: false
  required:
    - id
    - placementName
    - configurationChecksum
    - cluster
    - jobNamespace
    - timeoutSeconds
  properties:
    id:
      type: string
      format: uuid
    placementName:
      $ref: ./runs.yaml#/CatalogName
    configurationChecksum:
      type: string
      pattern: ^[0-9a-f]{64}$
    cluster:
      $ref: ./runs.yaml#/CatalogName
    jobNamespace:
      $ref: ./runs.yaml#/CatalogName
    serviceAccountName:
      type: string
      minLength: 1
      maxLength: 253
    timeoutSeconds:
      type: integer
      format: int32
      minimum: 10
      maximum: 600
    resources:
      $ref: ./catalog.yaml#/ResourceRequirements
    nodeSelector:
      type: object
      additionalProperties:
        type: string
    podTemplate:
      type: object
      additionalProperties: true
      description: Validated Placement PodTemplateSpec extensions.

PlacementPreflightReport:
  type: object
  additionalProperties: false
  required:
    - state
    - cleanupState
  properties:
    state:
      type: string
      enum:
        - running
        - succeeded
        - failed
    cleanupState:
      type: string
      enum:
        - pending
        - not-required
        - succeeded
        - failed
    jobUid:
      type: string
      minLength: 1
      maxLength: 200
    reason:
      type: string
      minLength: 1
      maxLength: 200
    message:
      type: string
      minLength: 1
      maxLength: 4096
    diagnostics:
      type: array
      maxItems: 20
      items:
        $ref: ./placements.yaml#/PlacementPreflightDiagnostic

KargoPromotionCreationCommand:
  type: object
  required:
    - id
    - attempt
    - externalName
    - integration
    - project
    - stage
    - stageUid
    - freight
  properties:
    id:
      type: string
      format: uuid
      description: Durable Slipramp Promotion identity.
    attempt:
      type: integer
      minimum: 1
      description: Monotonic dispatch attempt used to reject stale reports.
    externalName:
      type: string
      minLength: 1
      maxLength: 253
      description: Deterministic name for the Kargo Promotion resource.
    integration:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
      description: Kubernetes namespace containing the Kargo project.
    stage:
      type: string
      minLength: 1
      maxLength: 253
      description: Exact target Kargo Stage name.
    stageUid:
      type: string
      minLength: 1
      maxLength: 200
      description: Observed Kubernetes UID of the target Stage.
    freight:
      type: string
      minLength: 1
      maxLength: 253
      description: Exact Kargo Freight name to promote.

KargoPromotionDispatchReport:
  type: object
  required:
    - attempt
    - result
  properties:
    attempt:
      type: integer
      minimum: 1
      description: Dispatch attempt from the creation command.
    result:
      type: string
      enum:
        - created
        - retryable
        - failed
    kargoUid:
      type: string
      minLength: 1
      maxLength: 200
      description: Kubernetes UID; required when result is created.
    kargoName:
      type: string
      minLength: 1
      maxLength: 253
      description: Admission-assigned Kargo Promotion name; required when result is created.
    diagnostic:
      type: string
      minLength: 1
      maxLength: 4096
      description: Bounded failure detail; required for retryable and failed results.

KargoPromotionReconciliationCommand:
  type: object
  required:
    - id
    - source
    - integration
    - project
    - stage
    - kargoName
  properties:
    id:
      type: string
      format: uuid
      description: Durable Slipramp Promotion identity carried by the stable annotation.
    integration:
      $ref: ./runs.yaml#/CatalogName
    source:
      $ref: ./promotions.yaml#/PromotionSource
    project:
      $ref: ./runs.yaml#/CatalogName
      description: Kubernetes namespace containing the Kargo project.
    stage:
      type: string
      minLength: 1
      maxLength: 253
      description: Exact Kargo Stage recorded in the durable Promotion snapshot.
    kargoName:
      type: string
      minLength: 1
      maxLength: 253
      description: Canonical admission-assigned Kargo Promotion name.
    kargoUid:
      type: string
      minLength: 1
      maxLength: 200
      description: Kubernetes UID already bound to the Promotion, if observed.

KargoPromotionReconciliationReport:
  type: object
  required:
    - kargoName
    - kargoUid
  properties:
    kargoName:
      type: string
      minLength: 1
      maxLength: 253
      description: Canonical name of the observed Kargo Promotion.
    kargoUid:
      type: string
      minLength: 1
      maxLength: 200
      description: Kubernetes UID of the observed Kargo Promotion.
    phase:
      type: string
      enum:
        - Failed
        - Errored
        - Aborted
        - Succeeded
      description: Exact terminal Kargo phase, omitted when only binding Kubernetes identity.
    diagnostic:
      type: string
      maxLength: 4096
      minLength: 1
      description: Bounded sanitized terminal diagnostic, when Kargo provides one.

CancelRunCommand:
  type: object
  required:
    - id
    - jobNamespace
  properties:
    id:
      type: string
      format: uuid
      description: Stable Run identity used to derive the Kubernetes Job name.
    jobNamespace:
      $ref: ./runs.yaml#/CatalogName
    jobUid:
      type: string
      minLength: 1
      description: Kubernetes UID already recorded for the execution Job, if known.

RunAssignment:
  type: object
  required:
    - id
    - catalogRevisionId
    - commitSha
    - parameters
    - repository
    - target
    - action
    - runtime
    - placement
    - artifactAccess
  properties:
    id:
      type: string
      format: uuid
      description: Stable Run identity used to derive Kubernetes object names.
    catalogRevisionId:
      type: string
      format: uuid
      description: Immutable catalog revision against which the Run was resolved.
    commitSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Exact Git commit the execution Job must check out.
    parameters:
      type: object
      additionalProperties:
        $ref: ./runs.yaml#/ParameterValue
      description: Validated values for the action's declared parameters.
    repository:
      $ref: "#/RunAssignmentRepository"
    target:
      $ref: "#/RunAssignmentTarget"
    action:
      $ref: "#/RunAssignmentAction"
    runtime:
      $ref: "#/RunAssignmentRuntime"
    placement:
      $ref: "#/RunAssignmentPlacement"
    artifactAccess:
      $ref: "#/RunArtifactAccess"

RunAssignmentRepository:
  type: object
  required:
    - name
    - cloneUrl
    - branch
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cloneUrl:
      type: string
      minLength: 1
    branch:
      type: string
      minLength: 1
    checkoutCredentialName:
      $ref: ./runs.yaml#/CatalogName

RunAssignmentTarget:
  type: object
  required:
    - name
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    path:
      type: string
      minLength: 1

RunAssignmentAction:
  type: object
  required:
    - name
    - command
    - runtime
    - placement
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    intent:
      type: string
      minLength: 1
    command:
      type: array
      minItems: 1
      items:
        type: string
    runtime:
      $ref: ./runs.yaml#/CatalogName
    placement:
      $ref: ./runs.yaml#/CatalogName
    credentials:
      type: object
      additionalProperties:
        $ref: ./runs.yaml#/CatalogName
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: ./catalog.yaml#/ResourceRequirements
    parameterDefinitions:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/Parameter
    artifacts:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/ArtifactDeclaration
    inputs:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/ArtifactInput

RunAssignmentRuntime:
  type: object
  required:
    - name
    - image
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    image:
      type: string
      minLength: 1
    workingDirectory:
      type: string
      minLength: 1
    environment:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: ./catalog.yaml#/RuntimeCredential

RunAssignmentPlacement:
  type: object
  required:
    - name
    - cluster
    - jobNamespace
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    jobNamespace:
      $ref: ./runs.yaml#/CatalogName
    serviceAccountName:
      type: string
      minLength: 1
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: ./catalog.yaml#/ResourceRequirements
    nodeSelector:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: "#/RunAssignmentCredential"
    podTemplate:
      type: object
      additionalProperties: true
      description: Validated placement PodTemplateSpec extensions.

RunAssignmentCredential:
  type: object
  required:
    - secretName
  properties:
    secretName:
      type: string
      minLength: 1

RunArtifactAccess:
  type: object
  required:
    - token
  properties:
    token:
      type: string
      minLength: 1
      description: Run-scoped bearer credential for declared outputs and inputs.
