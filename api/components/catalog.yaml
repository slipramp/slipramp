CatalogRevision:
  type: object
  required:
    - id
    - commit
    - createdAt
    - runtimes
    - targets
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of the immutable catalog revision.
    commit:
      $ref: ./common.yaml#/GitCommit
      description: Exact Git commit from which the catalog was accepted.
    createdAt:
      type: string
      format: date-time
      description: Time at which the catalog revision was first accepted.
    runtimes:
      type: array
      items:
        $ref: "#/Runtime"
    targets:
      type: array
      items:
        $ref: "#/Target"

TargetSummaryList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/TargetSummary"
    total:
      type: integer
      format: int64
      minimum: 0
      description: Total number of active targets matching the filters.
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

TargetSummary:
  type: object
  required:
    - repositoryId
    - repositoryName
    - catalogRevisionId
    - catalogCommit
    - name
    - actions
    - desiredCommit
  properties:
    repositoryId:
      type: string
      format: uuid
    repositoryName:
      type: string
      minLength: 1
    catalogRevisionId:
      type: string
      format: uuid
    catalogCommit:
      $ref: ./common.yaml#/GitCommit
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    title:
      type: string
      minLength: 1
    actions:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    runtime:
      type: string
      minLength: 1
    placement:
      type: string
      minLength: 1
    desiredCommit:
      $ref: ./common.yaml#/GitCommit

Runtime:
  type: object
  required:
    - apiVersion
    - kind
    - metadata
    - spec
    - source
  properties:
    apiVersion:
      type: string
      enum:
        - slipramp.com/v1alpha1
      x-enum-varnames:
        - RuntimeAPIVersionV1Alpha1
    kind:
      type: string
      enum:
        - Runtime
      x-enum-varnames:
        - RuntimeKindRuntime
    metadata:
      $ref: "#/ResourceMetadata"
    spec:
      $ref: "#/RuntimeSpec"
    source:
      $ref: "#/CatalogSource"

Target:
  type: object
  required:
    - apiVersion
    - kind
    - metadata
    - spec
    - source
    - status
  properties:
    apiVersion:
      type: string
      enum:
        - slipramp.com/v1alpha1
      x-enum-varnames:
        - TargetAPIVersionV1Alpha1
    kind:
      type: string
      enum:
        - Target
      x-enum-varnames:
        - TargetKindTarget
    metadata:
      $ref: "#/ResourceMetadata"
    spec:
      $ref: "#/TargetSpec"
    source:
      $ref: "#/CatalogSource"
    status:
      $ref: "#/TargetStatus"

TargetStatus:
  type: object
  required:
    - desiredCommit
  properties:
    desiredCommit:
      $ref: ./common.yaml#/GitCommit
      description: >-
        Latest accepted Git commit whose changed paths matched this target's
        watch patterns, or the commit where the target most recently became
        active.

ResourceMetadata:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    title:
      type: string
      minLength: 1

CatalogSource:
  type: object
  required:
    - path
    - document
  properties:
    path:
      type: string
      minLength: 1
    document:
      type: integer
      minimum: 1

RuntimeSpec:
  type: object
  required:
    - image
  properties:
    image:
      type: string
      minLength: 1
    workingDirectory:
      type: string
      minLength: 1
    environment:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: "#/RuntimeCredential"

RuntimeCredential:
  type: object
  required:
    - inject
  properties:
    inject:
      $ref: "#/CredentialInjection"

CredentialInjection:
  type: object
  properties:
    environment:
      type: object
      additionalProperties:
        $ref: "#/CredentialEnvironmentVariable"
    environmentFrom:
      type: boolean
    files:
      type: array
      items:
        $ref: "#/CredentialFile"
    directory:
      $ref: "#/CredentialDirectory"

CredentialEnvironmentVariable:
  type: object
  required:
    - key
  properties:
    key:
      type: string
      minLength: 1

CredentialFile:
  type: object
  required:
    - key
    - path
  properties:
    key:
      type: string
      minLength: 1
    path:
      type: string
      minLength: 1
    mode:
      type: integer
      format: uint32
      minimum: 0

CredentialDirectory:
  type: object
  required:
    - path
  properties:
    path:
      type: string
      minLength: 1
    mode:
      type: integer
      format: uint32
      minimum: 0

TargetSpec:
  type: object
  required:
    - actions
  properties:
    path:
      type: string
      minLength: 1
    watch:
      type: array
      items:
        type: string
        minLength: 1
    runtime:
      type: string
      minLength: 1
    placement:
      type: string
      minLength: 1
    credentials:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: "#/ResourceRequirements"
    actions:
      type: object
      additionalProperties:
        $ref: "#/Action"

Action:
  type: object
  required:
    - command
  properties:
    intent:
      type: string
      minLength: 1
    command:
      type: array
      minItems: 1
      items:
        type: string
    runtime:
      type: string
      minLength: 1
    placement:
      type: string
      minLength: 1
    credentials:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: "#/ResourceRequirements"
    parameters:
      type: object
      additionalProperties:
        $ref: "#/Parameter"
    artifacts:
      type: object
      additionalProperties:
        $ref: "#/ArtifactDeclaration"
    inputs:
      type: object
      additionalProperties:
        $ref: "#/ArtifactInput"
    triggers:
      type: array
      items:
        $ref: "#/ActionTrigger"

ActionTrigger:
  type: object
  required:
    - name
    - git
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    git:
      $ref: "#/GitTrigger"
    parameters:
      type: object
      additionalProperties:
        $ref: ./runs.yaml#/ParameterValue

GitTrigger:
  type: object
  additionalProperties: false
  description: >-
    Runs the action when a newly accepted repository head changes a path
    matching the containing target's watch patterns.

ResourceRequirements:
  type: object
  properties:
    requests:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    limits:
      type: object
      additionalProperties:
        type: string
        minLength: 1

Parameter:
  type: object
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - string
        - boolean
        - number
        - enum
      x-enum-varnames:
        - ParameterTypeString
        - ParameterTypeBoolean
        - ParameterTypeNumber
        - ParameterTypeEnum
    required:
      type: boolean
    values:
      type: array
      items:
        type: string
    environment:
      type: string
      minLength: 1
    argument:
      $ref: "#/ParameterArgument"

ParameterArgument:
  type: object
  properties:
    name:
      type: string
      minLength: 1

ArtifactDeclaration:
  type: object
  required:
    - path
  properties:
    path:
      type: string
      minLength: 1
    mediaType:
      type: string
      minLength: 1
    sensitive:
      type: boolean

ArtifactInput:
  type: object
  required:
    - artifact
    - mountPath
  properties:
    artifact:
      $ref: "#/ArtifactInputSource"
    mountPath:
      type: string
      minLength: 1

ArtifactInputSource:
  type: object
  required:
    - fromAction
  properties:
    fromAction:
      type: string
      minLength: 1
    compatibility:
      type: string
      enum:
        - exact-catalog-revision
      x-enum-varnames:
        - ArtifactCompatibilityExactCatalogRevision
