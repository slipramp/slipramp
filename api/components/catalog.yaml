CatalogRevision:
  type: object
  required:
    - id
    - commit
    - createdAt
    - runtimes
    - targets
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of the immutable catalog revision.
    commit:
      $ref: ./common.yaml#/GitCommit
      description: Exact Git commit from which the catalog was accepted.
    createdAt:
      type: string
      format: date-time
      description: Time at which the catalog revision was first accepted.
    runtimes:
      type: array
      items:
        $ref: "#/Runtime"
    targets:
      type: array
      items:
        $ref: "#/TargetDefinition"

CatalogExplanation:
  type: object
  additionalProperties: false
  x-go-type: catalog.Explanation
  x-go-type-import:
    name: catalog
    path: github.com/slipramp/slipramp/internal/catalog
  required:
    - schemaVersion
    - validationLevel
    - target
    - action
    - actionTitle
    - actionDescription
    - actionDocumentationUrl
    - intent
    - process
    - parameters
    - runtime
    - placement
    - timeout
    - resources
    - credentials
    - outputs
    - inputs
    - watch
    - triggers
    - diagnostics
  properties:
    schemaVersion:
      type: integer
      const: 1
    validationLevel:
      type: string
      enum:
        - portable
        - deployment
    target:
      $ref: "#/ExplainedResourceMetadata"
    action:
      $ref: "#/ExplainedString"
    actionTitle:
      $ref: "#/ExplainedString"
    actionDescription:
      $ref: "#/ExplainedString"
    actionDocumentationUrl:
      $ref: "#/ExplainedString"
    intent:
      $ref: "#/ExplainedString"
    process:
      $ref: "#/ProcessExplanation"
    parameters:
      type: array
      items:
        $ref: "#/ParameterExplanation"
    runtime:
      $ref: "#/RuntimeExplanation"
    placement:
      $ref: "#/PlacementExplanation"
    timeout:
      $ref: "#/ExplainedString"
    resources:
      $ref: "#/ResourcesExplanation"
    credentials:
      type: array
      items:
        $ref: "#/CredentialExplanation"
    outputs:
      type: array
      items:
        $ref: "#/OutputExplanation"
    inputs:
      type: array
      items:
        $ref: "#/InputExplanation"
    watch:
      $ref: "#/ExplainedStringList"
    triggers:
      type: array
      items:
        $ref: "#/ExplainedActionTrigger"
    diagnostics:
      type: array
      items:
        $ref: "#/CatalogDiagnostic"

ExplanationOrigin:
  type: object
  additionalProperties: false
  required:
    - kind
    - name
    - fieldPath
  properties:
    kind:
      type: string
    name:
      type: string
    fieldPath:
      type: string
    location:
      $ref: "#/CatalogSourceRange"

CatalogSourceRange:
  type: object
  additionalProperties: false
  required:
    - path
    - document
  properties:
    path:
      type: string
    document:
      type: integer
      minimum: 1
    line:
      type: integer
      minimum: 1
    column:
      type: integer
      minimum: 1
    endLine:
      type: integer
      minimum: 1
    endColumn:
      type: integer
      minimum: 1
    fieldPath:
      type: string

ExplainedString:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      type: string
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ExplainedBoolean:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      type: boolean
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ExplainedStringList:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      type: array
      items:
        type: string
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ExplainedStringMap:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      type:
        - object
        - "null"
      additionalProperties:
        type: string
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ExplainedResourceMetadata:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/ResourceMetadata"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ProcessExplanation:
  type: object
  additionalProperties: false
  required:
    - repositoryMount
    - targetPath
    - workingDirectory
    - command
    - argv
    - environment
  properties:
    repositoryMount:
      $ref: "#/ExplainedString"
    targetPath:
      $ref: "#/ExplainedString"
    workingDirectory:
      $ref: "#/ExplainedString"
    command:
      $ref: "#/ExplainedStringList"
    argv:
      $ref: "#/ExplainedStringList"
    environment:
      type: object
      additionalProperties:
        $ref: "#/ExplainedString"

ParameterExplanation:
  type: object
  additionalProperties: false
  required:
    - name
    - declaration
    - supplied
    - value
    - delivery
  properties:
    name:
      type: string
    declaration:
      $ref: "#/ExplainedParameter"
    supplied:
      type: boolean
    value:
      oneOf:
        - $ref: ./runs.yaml#/ParameterValue
        - type: "null"
    delivery:
      $ref: "#/ExplainedParameterDelivery"

ExplainedParameter:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/Parameter"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ParameterDelivery:
  type: object
  additionalProperties: false
  required:
    - arguments
    - environment
  properties:
    arguments:
      type: array
      items:
        type: string
    environment:
      type: object
      additionalProperties:
        type: string

ExplainedParameterDelivery:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/ParameterDelivery"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

RuntimeExplanation:
  type: object
  additionalProperties: false
  required:
    - name
    - image
    - workingDirectory
    - environment
  properties:
    name:
      $ref: "#/ExplainedString"
    image:
      $ref: "#/ExplainedString"
    workingDirectory:
      $ref: "#/ExplainedString"
    environment:
      type: object
      additionalProperties:
        $ref: "#/ExplainedString"

PlacementExplanation:
  type: object
  additionalProperties: false
  required:
    - name
    - configurationAvailable
    - cluster
    - namespace
    - serviceAccount
    - nodeSelector
    - podExtensions
  properties:
    name:
      $ref: "#/ExplainedString"
    configurationAvailable:
      type: boolean
    cluster:
      $ref: "#/ExplainedString"
    namespace:
      $ref: "#/ExplainedString"
    serviceAccount:
      $ref: "#/ExplainedString"
    nodeSelector:
      $ref: "#/ExplainedStringMap"
    podExtensions:
      $ref: "#/ExplainedBoolean"

ResourcesExplanation:
  type: object
  additionalProperties: false
  required:
    - requests
    - limits
    - placementDefaultsResolved
  properties:
    requests:
      type: object
      additionalProperties:
        $ref: "#/ExplainedString"
    limits:
      type: object
      additionalProperties:
        $ref: "#/ExplainedString"
    placementDefaultsResolved:
      type: boolean
    unresolvedReason:
      type: string

CredentialSourceExplanation:
  type: object
  additionalProperties: false
  required:
    - secretName
  properties:
    secretName:
      type: string

ExplainedCredentialSource:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/CredentialSourceExplanation"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ExplainedCredentialInjection:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/CredentialInjection"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

CredentialExplanation:
  type: object
  additionalProperties: false
  required:
    - requirement
    - binding
    - source
    - injection
  properties:
    requirement:
      type: string
    binding:
      $ref: "#/ExplainedString"
    source:
      $ref: "#/ExplainedCredentialSource"
    injection:
      $ref: "#/ExplainedCredentialInjection"

ExplainedArtifact:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/ArtifactDeclaration"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

ArtifactConsumerExplanation:
  type: object
  additionalProperties: false
  required:
    - action
    - mountPath
    - compatibility
  properties:
    action:
      type: string
    mountPath:
      type: string
    compatibility:
      $ref: "#/ExplainedString"

OutputExplanation:
  type: object
  additionalProperties: false
  required:
    - name
    - producerAction
    - artifact
    - consumers
  properties:
    name:
      type: string
    producerAction:
      type: string
    artifact:
      $ref: "#/ExplainedArtifact"
    consumers:
      type: array
      items:
        $ref: "#/ArtifactConsumerExplanation"

ExplainedArtifactInput:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/ArtifactInput"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

InputExplanation:
  type: object
  additionalProperties: false
  required:
    - name
    - input
    - compatibility
    - producer
  properties:
    name:
      type: string
    input:
      $ref: "#/ExplainedArtifactInput"
    compatibility:
      $ref: "#/ExplainedString"
    producer:
      $ref: "#/ExplainedArtifact"

ExplainedActionTrigger:
  type: object
  additionalProperties: false
  required:
    - value
    - resolved
    - provenance
  properties:
    value:
      $ref: "#/ActionTrigger"
    resolved:
      type: boolean
    provenance:
      type: array
      items:
        $ref: "#/ExplanationOrigin"
    unresolvedReason:
      type: string

CatalogDiagnostic:
  type: object
  additionalProperties: false
  required:
    - code
    - severity
    - message
    - location
  properties:
    code:
      type: string
    severity:
      type: string
      enum:
        - error
        - warning
    message:
      type: string
    hint:
      type: string
    location:
      $ref: "#/CatalogSourceRange"
    related:
      type: array
      items:
        $ref: "#/CatalogRelatedLocation"

CatalogRelatedLocation:
  type: object
  additionalProperties: false
  required:
    - message
    - location
  properties:
    message:
      type: string
    location:
      $ref: "#/CatalogSourceRange"

TargetSummaryList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/TargetSummary"
    total:
      type: integer
      format: int64
      minimum: 0
      description: Total number of active targets matching the filters.
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

TargetSummary:
  type: object
  required:
    - id
    - repositoryId
    - repositoryName
    - catalogRevisionId
    - catalogCommit
    - name
    - actions
    - desiredCommit
    - reconciliation
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of the durable Target.
    repositoryId:
      type: string
      format: uuid
    repositoryName:
      type: string
      minLength: 1
    catalogRevisionId:
      type: string
      format: uuid
    catalogCommit:
      $ref: ./common.yaml#/GitCommit
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    title:
      type: string
      minLength: 1
    actions:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    runtime:
      type: string
      minLength: 1
    placement:
      type: string
      minLength: 1
    desiredCommit:
      $ref: ./common.yaml#/GitCommit
      description: >-
        Latest accepted Git commit whose changed paths matched this target's
        watch patterns, or the commit where the target most recently became
        active. This is a target-scoped relevance marker for scheduling and Git
        delivery coalescing, not an applied-infrastructure or Run checkout
        revision.
    reconciliation:
      $ref: "#/TargetReconciliationStatus"

Runtime:
  type: object
  required:
    - apiVersion
    - kind
    - metadata
    - spec
    - source
  properties:
    apiVersion:
      type: string
      enum:
        - slipramp.com/v1alpha1
      x-enum-varnames:
        - RuntimeAPIVersionV1Alpha1
    kind:
      type: string
      enum:
        - Runtime
      x-enum-varnames:
        - RuntimeKindRuntime
    metadata:
      $ref: "#/ResourceMetadata"
    spec:
      $ref: "#/RuntimeSpec"
    source:
      $ref: "#/CatalogSource"

Target:
  type: object
  required:
    - id
    - repositoryId
    - repositoryName
    - catalogRevisionId
    - catalogCommit
    - definition
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of the durable Target.
    repositoryId:
      type: string
      format: uuid
    repositoryName:
      type: string
      minLength: 1
    catalogRevisionId:
      type: string
      format: uuid
    catalogCommit:
      $ref: ./common.yaml#/GitCommit
    archivedAt:
      type: string
      format: date-time
      description: Present when the Target is absent from the active repository catalog.
    definition:
      $ref: "#/TargetDefinition"

TargetDefinition:
  type: object
  required:
    - apiVersion
    - kind
    - metadata
    - spec
    - source
    - status
  properties:
    apiVersion:
      type: string
      enum:
        - slipramp.com/v1alpha1
      x-enum-varnames:
        - TargetAPIVersionV1Alpha1
    kind:
      type: string
      enum:
        - Target
      x-enum-varnames:
        - TargetKindTarget
    metadata:
      $ref: "#/ResourceMetadata"
    spec:
      $ref: "#/TargetSpec"
    source:
      $ref: "#/CatalogSource"
    status:
      $ref: "#/TargetStatus"

TargetStatus:
  type: object
  required:
    - desiredCommit
    - reconciliation
  properties:
    desiredCommit:
      $ref: ./common.yaml#/GitCommit
      description: >-
        Latest accepted Git commit whose changed paths matched this target's
        watch patterns, or the commit where the target most recently became
        active. This is a target-scoped relevance marker for scheduling and Git
        delivery coalescing, not an applied-infrastructure or Run checkout
        revision.
    reconciliation:
      $ref: "#/TargetReconciliationStatus"

TargetReconciliationStatus:
  type: object
  additionalProperties: false
  required:
    - comparison
  properties:
    comparison:
      type: string
      enum:
        - matched
        - different
        - unknown
      description: >-
        Factual comparison of the active Target's desired relevance commit
        with its last successful sync Run marker. Archived Targets, Targets
        without a current sync Action, and Targets without a trustworthy
        successful marker report unknown.
    lastAttemptedSync:
      $ref: "#/TargetSyncRunCheckpoint"
      description: >-
        Most recently assigned Run for the Action whose technical name is
        exactly sync. A queued cancellation is not an attempt.
    lastSuccessfulSync:
      $ref: "#/TargetSyncRunCheckpoint"
      description: >-
        Most recently assigned sync Run that finished with outcome succeeded.

TargetSyncRunCheckpoint:
  type: object
  additionalProperties: false
  required:
    - runId
    - phase
    - createdAt
    - assignedAt
  properties:
    runId:
      type: string
      format: uuid
    relevanceCommit:
      $ref: ./common.yaml#/GitCommit
      description: >-
        Target relevance commit frozen by the Run. It is absent when the Run
        predates trustworthy relevance markers or exactly reruns such a Run.
    phase:
      $ref: ./runs.yaml#/RunPhase
    outcome:
      $ref: ./runs.yaml#/RunOutcome
    createdAt:
      type: string
      format: date-time
    assignedAt:
      type: string
      format: date-time
    preparingAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
    cancellationRequestedAt:
      type: string
      format: date-time

ResourceMetadata:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    title:
      type: string
      minLength: 1

CatalogSource:
  type: object
  required:
    - path
    - document
  properties:
    path:
      type: string
      minLength: 1
    document:
      type: integer
      minimum: 1

RuntimeSpec:
  type: object
  required:
    - image
  properties:
    image:
      type: string
      minLength: 1
    workingDirectory:
      type: string
      minLength: 1
    environment:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: "#/RuntimeCredential"

RuntimeCredential:
  type: object
  required:
    - inject
  properties:
    inject:
      $ref: "#/CredentialInjection"

CredentialInjection:
  type: object
  properties:
    environment:
      type: object
      additionalProperties:
        $ref: "#/CredentialEnvironmentVariable"
    environmentFrom:
      type: boolean
    files:
      type: array
      items:
        $ref: "#/CredentialFile"
    directory:
      $ref: "#/CredentialDirectory"

CredentialEnvironmentVariable:
  type: object
  required:
    - key
  properties:
    key:
      type: string
      minLength: 1

CredentialFile:
  type: object
  required:
    - key
    - path
  properties:
    key:
      type: string
      minLength: 1
    path:
      type: string
      minLength: 1
    mode:
      type: integer
      format: uint32
      minimum: 0

CredentialDirectory:
  type: object
  required:
    - path
  properties:
    path:
      type: string
      minLength: 1
    mode:
      type: integer
      format: uint32
      minimum: 0

TargetSpec:
  type: object
  required:
    - actions
  properties:
    path:
      type: string
      minLength: 1
    watch:
      type: array
      items:
        type: string
        minLength: 1
    runtime:
      type: string
      minLength: 1
    placement:
      type: string
      minLength: 1
    credentials:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: "#/ResourceRequirements"
    actions:
      type: object
      additionalProperties:
        $ref: "#/Action"

Action:
  type: object
  required:
    - command
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: Operator-facing display title. The action map key remains its stable identity.
    description:
      type: string
      minLength: 1
      maxLength: 2000
    documentationUrl:
      type: string
      format: uri
      pattern: ^https?://
      minLength: 1
      maxLength: 2048
    intent:
      type: string
      minLength: 1
    command:
      type: array
      minItems: 1
      items:
        type: string
    runtime:
      type: string
      minLength: 1
    placement:
      type: string
      minLength: 1
    credentials:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: "#/ResourceRequirements"
    parameters:
      type: object
      additionalProperties:
        $ref: "#/Parameter"
    artifacts:
      type: object
      additionalProperties:
        $ref: "#/ArtifactDeclaration"
    inputs:
      type: object
      additionalProperties:
        $ref: "#/ArtifactInput"
    triggers:
      type: array
      items:
        $ref: "#/ActionTrigger"

ActionTrigger:
  type: object
  required:
    - name
    - git
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    git:
      $ref: "#/GitTrigger"
    parameters:
      type: object
      additionalProperties:
        $ref: ./runs.yaml#/ParameterValue

GitTrigger:
  type: object
  additionalProperties: false
  description: >-
    Runs the action when a newly accepted repository head changes a path
    matching the containing target's watch patterns.

ResourceRequirements:
  type: object
  properties:
    requests:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    limits:
      type: object
      additionalProperties:
        type: string
        minLength: 1

Parameter:
  type: object
  required:
    - type
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: Operator-facing form label. The parameter map key remains its stable identity.
    description:
      type: string
      minLength: 1
      maxLength: 2000
    type:
      type: string
      enum:
        - string
        - boolean
        - number
        - enum
      x-enum-varnames:
        - ParameterTypeString
        - ParameterTypeBoolean
        - ParameterTypeNumber
        - ParameterTypeEnum
    required:
      type: boolean
    values:
      type: array
      items:
        type: string
    environment:
      type: string
      minLength: 1
    argument:
      $ref: "#/ParameterArgument"

ParameterArgument:
  type: object
  properties:
    name:
      type: string
      minLength: 1

ArtifactDeclaration:
  type: object
  required:
    - path
  properties:
    description:
      type: string
      minLength: 1
      maxLength: 2000
    path:
      type: string
      minLength: 1
    mediaType:
      type: string
      minLength: 1
    sensitive:
      type: boolean

ArtifactInput:
  type: object
  required:
    - artifact
    - mountPath
  properties:
    artifact:
      $ref: "#/ArtifactInputSource"
    mountPath:
      type: string
      minLength: 1

ArtifactInputSource:
  type: object
  required:
    - fromAction
  properties:
    fromAction:
      type: string
      minLength: 1
    compatibility:
      type: string
      enum:
        - exact-catalog-revision
      x-enum-varnames:
        - ArtifactCompatibilityExactCatalogRevision
