RunReportEnvelope:
  type: object
  required:
    - artifactId
    - runId
    - kind
    - schemaVersion
    - adapterVersion
    - tool
    - mode
    - createdAt
  properties:
    artifactId:
      type: string
      format: uuid
    runId:
      type: string
      format: uuid
    kind:
      type: string
      enum:
        - terraform-plan
        - opentofu-plan
        - pyinfra-deploy
    schemaVersion:
      type: integer
      minimum: 1
    adapterVersion:
      type: integer
      minimum: 1
    tool:
      type: string
      minLength: 1
      maxLength: 64
    toolVersion:
      type: string
      minLength: 1
      maxLength: 128
    mode:
      type: string
      enum:
        - preview
        - apply
    createdAt:
      type: string
      format: date-time

RunReportSummary:
  oneOf:
    - $ref: "#/TerraformPlanReportSummary"
    - $ref: "#/OpenTofuPlanReportSummary"
    - $ref: "#/PyinfraDeployReportSummary"
  discriminator:
    propertyName: kind
    mapping:
      terraform-plan: "#/TerraformPlanReportSummary"
      opentofu-plan: "#/OpenTofuPlanReportSummary"
      pyinfra-deploy: "#/PyinfraDeployReportSummary"

RunReport:
  oneOf:
    - $ref: "#/TerraformPlanReport"
    - $ref: "#/OpenTofuPlanReport"
    - $ref: "#/PyinfraDeployReport"
  discriminator:
    propertyName: kind
    mapping:
      terraform-plan: "#/TerraformPlanReport"
      opentofu-plan: "#/OpenTofuPlanReport"
      pyinfra-deploy: "#/PyinfraDeployReport"

TerraformPlanReportSummary:
  allOf:
    - $ref: "#/RunReportEnvelope"
    - type: object
      required:
        - kind
        - summary
      properties:
        kind:
          type: string
          enum:
            - terraform-plan
        mode:
          type: string
          enum:
            - preview
        summary:
          $ref: "#/InfrastructurePlanSummary"

TerraformPlanReport:
  allOf:
    - $ref: "#/RunReportEnvelope"
    - type: object
      required:
        - kind
        - summary
        - resourceChanges
        - resourceDrift
      properties:
        kind:
          type: string
          enum:
            - terraform-plan
        mode:
          type: string
          enum:
            - preview
        summary:
          $ref: "#/InfrastructurePlanSummary"
        resourceChanges:
          type: array
          maxItems: 20000
          items:
            $ref: "#/InfrastructureResourceChange"
        resourceDrift:
          type: array
          maxItems: 20000
          items:
            $ref: "#/InfrastructureResourceChange"

OpenTofuPlanReportSummary:
  allOf:
    - $ref: "#/RunReportEnvelope"
    - type: object
      required:
        - kind
        - summary
      properties:
        kind:
          type: string
          enum:
            - opentofu-plan
        mode:
          type: string
          enum:
            - preview
        summary:
          $ref: "#/InfrastructurePlanSummary"

OpenTofuPlanReport:
  allOf:
    - $ref: "#/RunReportEnvelope"
    - type: object
      required:
        - kind
        - summary
        - resourceChanges
        - resourceDrift
      properties:
        kind:
          type: string
          enum:
            - opentofu-plan
        mode:
          type: string
          enum:
            - preview
        summary:
          $ref: "#/InfrastructurePlanSummary"
        resourceChanges:
          type: array
          maxItems: 20000
          items:
            $ref: "#/InfrastructureResourceChange"
        resourceDrift:
          type: array
          maxItems: 20000
          items:
            $ref: "#/InfrastructureResourceChange"

InfrastructurePlanSummary:
  type: object
  required:
    - resourceChanges
    - driftedResources
    - checks
    - outputChanges
  properties:
    resourceChanges:
      $ref: "#/InfrastructureActionCounts"
    driftedResources:
      type: integer
      minimum: 0
      maximum: 20000
    checks:
      $ref: "#/InfrastructureCheckCounts"
    outputChanges:
      $ref: "#/InfrastructureActionCounts"
    applyable:
      type: boolean
    complete:
      type: boolean
    errored:
      type: boolean

InfrastructureActionCounts:
  type: object
  required:
    - total
    - noOp
    - create
    - read
    - update
    - delete
    - forget
    - replace
  properties:
    total:
      type: integer
      minimum: 0
      maximum: 20000
    noOp:
      type: integer
      minimum: 0
      maximum: 20000
    create:
      type: integer
      minimum: 0
      maximum: 20000
    read:
      type: integer
      minimum: 0
      maximum: 20000
    update:
      type: integer
      minimum: 0
      maximum: 20000
    delete:
      type: integer
      minimum: 0
      maximum: 20000
    forget:
      type: integer
      minimum: 0
      maximum: 20000
    replace:
      type: integer
      minimum: 0
      maximum: 20000

InfrastructureCheckCounts:
  type: object
  required:
    - total
    - pass
    - fail
    - error
    - unknown
  properties:
    total:
      type: integer
      minimum: 0
      maximum: 10000
    pass:
      type: integer
      minimum: 0
      maximum: 10000
    fail:
      type: integer
      minimum: 0
      maximum: 10000
    error:
      type: integer
      minimum: 0
      maximum: 10000
    unknown:
      type: integer
      minimum: 0
      maximum: 10000

InfrastructureResourceChange:
  type: object
  required:
    - address
    - mode
    - type
    - name
    - providerName
    - action
  properties:
    address:
      type: string
      minLength: 1
      maxLength: 2048
    replacedObjectKey:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque plan key distinguishing an old object retained during replacement from the current object at the same address.
    previousAddress:
      type: string
      minLength: 1
      maxLength: 2048
    moduleAddress:
      type: string
      minLength: 1
      maxLength: 2048
    mode:
      type: string
      minLength: 1
      maxLength: 64
    type:
      type: string
      minLength: 1
      maxLength: 256
    name:
      type: string
      minLength: 1
      maxLength: 256
    providerName:
      type: string
      minLength: 1
      maxLength: 512
    action:
      type: string
      enum:
        - no-op
        - create
        - read
        - update
        - delete
        - forget
        - replace
    replacementOrder:
      type: string
      enum:
        - destroy-before-create
        - create-before-destroy
    actionReason:
      type: string
      minLength: 1
      maxLength: 256

PyinfraDeployReportSummary:
  allOf:
    - $ref: "#/RunReportEnvelope"
    - type: object
      required:
        - kind
        - mode
        - summary
      properties:
        kind:
          type: string
          enum:
            - pyinfra-deploy
        mode:
          type: string
          enum:
            - preview
            - apply
        summary:
          $ref: "#/PyinfraDeploySummary"

PyinfraDeployReport:
  allOf:
    - $ref: "#/RunReportEnvelope"
    - type: object
      required:
        - kind
        - mode
        - summary
        - operations
        - failedHosts
      properties:
        kind:
          type: string
          enum:
            - pyinfra-deploy
        mode:
          type: string
          enum:
            - preview
            - apply
        summary:
          $ref: "#/PyinfraDeploySummary"
        operations:
          type: array
          maxItems: 10000
          items:
            $ref: "#/PyinfraOperation"
        failedHosts:
          $ref: "#/PyinfraHostList"

PyinfraDeploySummary:
  type: object
  required:
    - plan
  properties:
    plan:
      $ref: "#/PyinfraPlanSummary"
    results:
      $ref: "#/PyinfraResultSummary"

PyinfraPlanSummary:
  type: object
  required:
    - totalOperations
    - changedOperations
    - unchangedOperations
    - affectedHosts
    - plannedHostOperations
    - conditionalHostOperations
  properties:
    totalOperations:
      type: integer
      minimum: 0
      maximum: 10000
    changedOperations:
      type: integer
      minimum: 0
      maximum: 10000
    unchangedOperations:
      type: integer
      minimum: 0
      maximum: 10000
    affectedHosts:
      type: integer
      minimum: 0
      maximum: 200000
    plannedHostOperations:
      type: integer
      minimum: 0
      maximum: 200000
    conditionalHostOperations:
      type: integer
      minimum: 0
      maximum: 200000

PyinfraResultSummary:
  type: object
  required:
    - hostOperations
    - changedHostOperations
    - failedHostOperations
    - unchangedHostOperations
    - failedHosts
  properties:
    hostOperations:
      type: integer
      minimum: 0
      maximum: 200000
    changedHostOperations:
      type: integer
      minimum: 0
      maximum: 200000
    failedHostOperations:
      type: integer
      minimum: 0
      maximum: 200000
    unchangedHostOperations:
      type: integer
      minimum: 0
      maximum: 200000
    failedHosts:
      type: integer
      minimum: 0
      maximum: 200000

PyinfraOperation:
  type: object
  required:
    - names
    - hostsWithChanges
    - hostsWithConditionalChanges
  properties:
    names:
      type: array
      minItems: 1
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 512
    hostsWithChanges:
      $ref: "#/PyinfraHostList"
    hostsWithConditionalChanges:
      $ref: "#/PyinfraHostList"
    result:
      $ref: "#/PyinfraOperationResult"

PyinfraOperationResult:
  type: object
  required:
    - changedHosts
    - failedHosts
    - unchangedHosts
  properties:
    changedHosts:
      $ref: "#/PyinfraHostList"
    failedHosts:
      $ref: "#/PyinfraHostList"
    unchangedHosts:
      $ref: "#/PyinfraHostList"

PyinfraHostList:
  type: array
  maxItems: 200000
  items:
    type: string
    minLength: 1
    maxLength: 512
