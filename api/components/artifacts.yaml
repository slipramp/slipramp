Artifact:
  type: object
  required:
    - id
    - runId
    - name
    - kind
    - state
    - mediaType
    - sizeBytes
    - sensitive
    - retentionState
    - provenance
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    runId:
      type: string
      format: uuid
    name:
      $ref: ./runs.yaml#/CatalogName
    description:
      type: string
      minLength: 1
      maxLength: 2000
      description: Frozen description from the producing Action's artifact declaration.
    kind:
      type: string
      enum:
        - log
        - output
    state:
      type: string
      enum:
        - open
        - sealed
        - failed
    mediaType:
      type: string
      minLength: 1
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    sensitive:
      type: boolean
    retentionState:
      type: string
      enum:
        - retained
        - expired
        - deleted
    provenance:
      $ref: "#/ArtifactProvenance"
    createdAt:
      type: string
      format: date-time
    sealedAt:
      type: string
      format: date-time

ArtifactProvenance:
  type: object
  required:
    - producerRunId
    - repositoryId
    - target
    - action
    - commit
    - catalogRevisionId
  properties:
    producerRunId:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    target:
      $ref: ./runs.yaml#/CatalogName
    action:
      $ref: ./runs.yaml#/CatalogName
    commit:
      $ref: ./common.yaml#/GitCommit
    catalogRevisionId:
      type: string
      format: uuid

ArtifactList:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/Artifact"

ArtifactStorageUsage:
  type: object
  description: >-
    Aggregate logical artifact-content consumption recorded in PostgreSQL.
    Artifacts in retained or expired retention state are included across open,
    sealed, and failed content lifecycle states. Artifacts marked deleted are
    excluded.
  required:
    - artifactCount
    - recordedBytes
  properties:
    artifactCount:
      type: integer
      format: int64
      minimum: 0
      description: Number of included artifact metadata records.
    recordedBytes:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Sum of the included records' sizeBytes values. For open or failed logs,
        this is the durable recorded prefix. Expired artifacts remain included
        until content deletion finishes and metadata is marked deleted.

LogCursor:
  type: object
  required:
    - nextOffsetBytes
    - state
  properties:
    nextOffsetBytes:
      type: integer
      format: int64
      minimum: 0
    state:
      type: string
      enum:
        - open
        - sealed
        - failed
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$

LogSeal:
  type: object
  required:
    - sizeBytes
    - sha256
  properties:
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$

LogEvent:
  type: object
  required:
    - offsetBytes
    - nextOffsetBytes
    - contentsBase64
  properties:
    offsetBytes:
      type: integer
      format: int64
      minimum: 0
    nextOffsetBytes:
      type: integer
      format: int64
      minimum: 0
    contentsBase64:
      type: string
      format: byte
