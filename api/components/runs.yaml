RunCreate:
  type: object
  required:
    - targetId
    - action
  properties:
    targetId:
      type: string
      format: uuid
      description: Durable Target containing the Action.
    action:
      $ref: "#/CatalogName"
    parameters:
      type: object
      additionalProperties:
        $ref: "#/ParameterValue"
      description: Values for parameters declared by the selected action.
    inputs:
      type: object
      additionalProperties:
        type: string
        format: uuid
      description: >-
        Explicit bindings from declared input names to sealed artifacts. Exact
        catalog compatibility pins the new Run to the producer's commit and
        catalog revision.

RunRerun:
  type: object
  required:
    - mode
  properties:
    mode:
      $ref: "#/RunRerunMode"
      description: >-
        Exact reuses the original Run's frozen commit, catalog, parameters,
        artifact inputs, and execution configuration. Latest resolves the
        original target, action, and parameters against the active catalog and
        current placement configuration.

RunRerunMode:
  type: string
  enum:
    - exact
    - latest
  x-enum-varnames:
    - RunRerunModeExact
    - RunRerunModeLatest

RunList:
  type: object
  required:
    - items
    - limit
    - offset
    - total
  properties:
    items:
      type: array
      items:
        $ref: "#/Run"
    limit:
      type: integer
      minimum: 1
      description: Maximum number of Runs requested for this page.
    offset:
      type: integer
      minimum: 0
      description: Zero-based offset used for this page.
    total:
      type: integer
      minimum: 0
      description: Total matching Runs across all pages.

Run:
  type: object
  required:
    - id
    - phase
    - targetId
    - repositoryId
    - catalogRevisionId
    - commit
    - target
    - action
    - parameters
    - runtime
    - placement
    - cluster
    - source
    - inputs
    - artifactConsumers
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of the immutable action execution.
    phase:
      $ref: "#/RunPhase"
      description: Durable lifecycle position of the Run.
    targetId:
      type: string
      format: uuid
      description: Stable identity of the durable Target selected for this Run.
    observationState:
      type: string
      enum:
        - current
        - pending
        - unknown
      x-enum-varnames:
        - RunObservationStateCurrent
        - RunObservationStatePending
        - RunObservationStateUnknown
      description: >-
        Derived freshness of the execution observation. Present only while the
        Run is assigned, preparing, or running. Pending means a connected
        controller has not yet observed a recently assigned Run. Unknown means
        the controller is unreachable or its observation is stale; neither
        state changes the durable lifecycle phase.
    outcome:
      $ref: "#/RunOutcome"
      description: Terminal result, present only when phase is finished.
    repositoryId:
      type: string
      format: uuid
    catalogRevisionId:
      type: string
      format: uuid
    commit:
      $ref: ./common.yaml#/GitCommit
    targetRelevanceCommit:
      $ref: ./common.yaml#/GitCommit
      description: >-
        Target desired relevance commit frozen when the Run was created. This
        is independent of the checkout commit. It is absent for historical
        Runs whose relevance marker is not trustworthy.
    target:
      $ref: "#/CatalogName"
    action:
      $ref: "#/CatalogName"
    actionTitle:
      type: string
      minLength: 1
      maxLength: 200
      description: Frozen operator-facing title from the selected Action.
    actionDescription:
      type: string
      minLength: 1
      maxLength: 2000
      description: Frozen operator-facing description from the selected Action.
    actionDocumentationUrl:
      type: string
      format: uri
      pattern: ^https?://
      minLength: 1
      maxLength: 2048
      description: Frozen documentation link from the selected Action.
    parameters:
      type: object
      additionalProperties:
        $ref: "#/ParameterValue"
    runtime:
      $ref: "#/CatalogName"
    placement:
      $ref: "#/CatalogName"
    cluster:
      $ref: "#/CatalogName"
    source:
      $ref: "#/RunSource"
    rerunOfRunId:
      type: string
      format: uuid
      description: Immediate parent Run when this Run was created by a rerun operation.
    rerunMode:
      $ref: "#/RunRerunMode"
      description: Resolution mode used to rerun the parent Run.
    createdBy:
      $ref: "#/RunActor"
    canceledBy:
      $ref: "#/RunActor"
    inputs:
      type: object
      additionalProperties:
        $ref: "#/RunArtifactInput"
    artifactConsumers:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/RunArtifactConsumer"
      description: >-
        Directly runnable actions, grouped by produced artifact name, that can
        consume that one artifact without other required inputs or parameters.
    createdAt:
      type: string
      format: date-time
    assignedAt:
      type: string
      format: date-time
    preparingAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
    lastObservedAt:
      type: string
      format: date-time
      description: Time the controller most recently confirmed execution state.
    cancellationRequestedAt:
      type: string
      format: date-time
    jobUid:
      type: string
      minLength: 1
      description: Kubernetes UID of the materialized Job.
    outcomeReason:
      type: string
      minLength: 1
    outcomeMessage:
      type: string
      minLength: 1
    exitCode:
      type: integer
      format: int32
      minimum: 0

RunPhase:
  type: string
  enum:
    - queued
    - assigned
    - preparing
    - running
    - finished

RunOutcome:
  type: string
  enum:
    - succeeded
    - failed
    - canceled
    - timed-out

RunArtifactInput:
  type: object
  required:
    - artifactId
    - producerRunId
    - name
    - mediaType
    - sizeBytes
    - sha256
    - sensitive
    - retentionState
    - commit
    - catalogRevisionId
  properties:
    artifactId:
      type: string
      format: uuid
    producerRunId:
      type: string
      format: uuid
    name:
      $ref: "#/CatalogName"
    description:
      type: string
      minLength: 1
      maxLength: 2000
      description: Frozen description of the producer's artifact declaration.
    mediaType:
      type: string
      minLength: 1
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    sensitive:
      type: boolean
    retentionState:
      type: string
      enum:
        - retained
        - expired
        - deleted
    commit:
      $ref: ./common.yaml#/GitCommit
    catalogRevisionId:
      type: string
      format: uuid

RunArtifactConsumer:
  type: object
  required:
    - action
    - input
  properties:
    action:
      $ref: "#/CatalogName"
    actionTitle:
      type: string
      minLength: 1
      maxLength: 200
    input:
      $ref: "#/CatalogName"

RunSource:
  type: object
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - manual
        - api
        - git
        - promotion
      description: Boundary that submitted the Run.
    git:
      $ref: "#/GitRunSource"
    promotion:
      $ref: ./promotions.yaml#/PromotionRunSource

GitRunSource:
  type: object
  required:
    - triggerName
    - deliveryId
  properties:
    triggerName:
      $ref: "#/CatalogName"
    deliveryId:
      type: string
      format: uuid
      description: Stable Git-trigger delivery identity used for Run idempotency.

RunActor:
  type: object
  required:
    - principalId
    - kind
    - displayName
  properties:
    principalId:
      type: string
      format: uuid
      description: Durable product principal responsible for the operation.
    kind:
      type: string
      enum:
        - user
        - service-account
    displayName:
      type: string
      minLength: 1
      maxLength: 200
      description: Immutable display-name snapshot captured with the operation.

ParameterValue:
  oneOf:
    - type: string
    - type: boolean
    - type: number
      format: double

CatalogName:
  type: string
  minLength: 1
  maxLength: 63
  pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
