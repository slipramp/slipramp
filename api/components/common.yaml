HealthResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - ok

ReadinessResponse:
  type: object
  required:
    - status
    - database
    - artifactStorage
  properties:
    status:
      type: string
      enum:
        - ready
        - not-ready
    database:
      $ref: "#/DependencyStatus"
    artifactStorage:
      $ref: "#/DependencyStatus"

DependencyStatus:
  type: string
  enum:
    - available
    - unavailable

Problem:
  type: object
  description: An RFC 9457 problem detail.
  required:
    - type
    - title
    - status
  properties:
    type:
      type: string
      format: uri-reference
      description: URI reference identifying the problem type.
      default: about:blank
    title:
      type: string
      description: Short, human-readable summary of the problem type.
    status:
      type: integer
      minimum: 400
      maximum: 599
      description: HTTP status code generated for this occurrence.
    detail:
      type: string
      description: Human-readable explanation specific to this occurrence.
    instance:
      type: string
      format: uri-reference
      description: URI reference identifying this occurrence.
