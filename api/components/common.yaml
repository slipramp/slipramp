HealthResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - ok

ReadinessResponse:
  type: object
  required:
    - status
    - database
    - artifactStorage
  properties:
    status:
      type: string
      enum:
        - ready
        - not-ready
    database:
      $ref: "#/DependencyStatus"
    artifactStorage:
      $ref: "#/DependencyStatus"

DependencyStatus:
  type: string
  enum:
    - available
    - unavailable

GitCommit:
  type: object
  additionalProperties: false
  required:
    - sha
  properties:
    sha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Exact Git object identity.
    title:
      type: string
      description: Commit subject when it has been read from the Git object.
    author:
      type: string
      description: Commit author name when it has been read from the Git object.
    authoredAt:
      type: string
      format: date-time
      description: Commit author timestamp when it has been read from the Git object.
    committedAt:
      type: string
      format: date-time
      description: Commit timestamp when it has been read from the Git object.
    url:
      type: string
      format: uri
      description: Provider commit page when the repository supports web links.

ExecutionImages:
  type: object
  additionalProperties: false
  description: >-
    Actual image identities reported by Kubernetes for the containers that
    participated in execution. Fields appear as each container starts and are
    retained as Run provenance.
  properties:
    action:
      type: string
      minLength: 1
      maxLength: 2048
      description: Kubernetes status.imageID for the Action container.
    checkout:
      type: string
      minLength: 1
      maxLength: 2048
      description: Kubernetes status.imageID for the checkout init container.
    harness:
      type: string
      minLength: 1
      maxLength: 2048
      description: Kubernetes status.imageID for the Harness install init container.

Problem:
  type: object
  description: An RFC 9457 problem detail.
  required:
    - type
    - title
    - status
  properties:
    type:
      type: string
      format: uri-reference
      description: URI reference identifying the problem type.
      default: about:blank
    title:
      type: string
      description: Short, human-readable summary of the problem type.
    status:
      type: integer
      minimum: 400
      maximum: 599
      description: HTTP status code generated for this occurrence.
    detail:
      type: string
      description: Human-readable explanation specific to this occurrence.
    instance:
      type: string
      format: uri-reference
      description: URI reference identifying this occurrence.
