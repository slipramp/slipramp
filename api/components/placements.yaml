Placement:
  type: object
  additionalProperties: false
  required:
    - name
    - cluster
    - controllerConnectionState
    - namespace
    - serviceAccount
    - resources
    - credentialNames
    - targetCount
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    controllerConnectionState:
      type: string
      enum:
        - connected
        - unreachable
      description: >-
        Whether the configured Cluster's Controller has checked in within the
        connection window. A Controller that has never checked in is unreachable.
    controllerLastSeenAt:
      type: string
      format: date-time
      description: Most recent Controller contact, absent when it has never checked in.
    namespace:
      type: string
      minLength: 1
      maxLength: 63
    serviceAccount:
      type: string
      minLength: 1
      maxLength: 253
      description: Effective Kubernetes service account, including the default.
    timeout:
      type: string
      minLength: 1
      description: Placement timeout default when one is configured.
    resources:
      $ref: "#/PlacementResourceRequirements"
    credentialNames:
      type: array
      uniqueItems: true
      description: Logical credential sources offered by this Placement.
      items:
        $ref: ./runs.yaml#/CatalogName
    targetCount:
      type: integer
      format: int64
      minimum: 0
      description: Number of active Targets with at least one Action using this Placement.

PlacementResourceRequirements:
  type: object
  additionalProperties: false
  required:
    - requests
    - limits
  properties:
    requests:
      type: object
      additionalProperties:
        type: string
        minLength: 1
    limits:
      type: object
      additionalProperties:
        type: string
        minLength: 1

PlacementList:
  type: object
  additionalProperties: false
  required:
    - items
    - configurationChecksum
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Placement"
    configurationChecksum:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: SHA-256 checksum of the validated effective Placement set.
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PlacementDetail:
  type: object
  additionalProperties: false
  required:
    - placement
    - configurationChecksum
    - definition
  properties:
    placement:
      $ref: "#/Placement"
    configurationChecksum:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: SHA-256 checksum of the validated effective Placement set.
    definition:
      $ref: "#/PlacementDefinition"

PlacementDefinition:
  type: object
  additionalProperties: false
  required:
    - apiVersion
    - kind
    - placements
  properties:
    apiVersion:
      type: string
      enum:
        - slipramp.com/v1alpha1
      x-enum-varnames:
        - PlacementDefinitionAPIVersionV1Alpha1
    kind:
      type: string
      enum:
        - PlacementConfig
      x-enum-varnames:
        - PlacementDefinitionKindPlacementConfig
    clusters:
      type: object
      additionalProperties:
        $ref: "#/PlacementClusterConfiguration"
      description: Configuration for the selected Placement's Cluster, when present.
    placements:
      type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        $ref: "#/PlacementConfiguration"
      description: The selected validated Placement configuration.

PlacementClusterConfiguration:
  type: object
  additionalProperties: false
  properties:
    maximumActiveRuns:
      type: integer
      format: int32
      minimum: 1

PlacementConfiguration:
  type: object
  additionalProperties: false
  required:
    - cluster
    - jobNamespace
  properties:
    cluster:
      $ref: ./runs.yaml#/CatalogName
    jobNamespace:
      $ref: ./runs.yaml#/CatalogName
    maximumActiveRuns:
      type: integer
      format: int32
      minimum: 1
    serviceAccountName:
      type: string
      minLength: 1
      maxLength: 253
    timeout:
      type: string
      minLength: 1
    resources:
      $ref: ./catalog.yaml#/ResourceRequirements
    nodeSelector:
      type: object
      additionalProperties:
        type: string
    credentials:
      type: object
      additionalProperties:
        $ref: "#/PlacementCredentialSource"
    podTemplate:
      type: object
      additionalProperties: true
      description: Validated Kubernetes PodTemplateSpec extensions.
    actionVolumes:
      type: array
      description: Operator-defined Kubernetes volumes exposed only to the Action container.
      items:
        type: object
        additionalProperties: true
    actionVolumeMounts:
      type: array
      description: Operator-defined mounts for the Placement action volumes.
      items:
        type: object
        additionalProperties: true

PlacementCredentialSource:
  type: object
  additionalProperties: false
  required:
    - secretRef
  properties:
    secretRef:
      $ref: "#/PlacementSecretReference"

PlacementSecretReference:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1

PlacementPreflight:
  type: object
  additionalProperties: false
  required:
    - id
    - placementName
    - cluster
    - configurationChecksum
    - state
    - cleanupState
    - requestedBy
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    placementName:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    configurationChecksum:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Placement configuration version captured when the probe was requested.
    state:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
    cleanupState:
      type: string
      enum:
        - pending
        - not-required
        - succeeded
        - failed
    requestedBy:
      $ref: ./runs.yaml#/RunActor
    createdAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
    jobUid:
      type: string
      minLength: 1
      maxLength: 200
    reason:
      type: string
      minLength: 1
      maxLength: 200
    message:
      type: string
      minLength: 1
      maxLength: 4096
      description: Bounded, sanitized result detail.
    diagnostics:
      type: array
      maxItems: 20
      items:
        $ref: "#/PlacementPreflightDiagnostic"

PlacementPreflightDiagnostic:
  type: object
  additionalProperties: false
  required:
    - reason
    - message
    - count
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 200
    message:
      type: string
      minLength: 1
      maxLength: 1024
    count:
      type: integer
      format: int32
      minimum: 1
    firstObservedAt:
      type: string
      format: date-time
    lastObservedAt:
      type: string
      format: date-time

PlacementPreflightList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PlacementPreflight"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0
