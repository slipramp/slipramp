RepositoryConfig:
  type: object
  required:
    - name
    - cloneUrl
    - branch
    - commitIndexing
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Unique human-readable name of the active repository.
    cloneUrl:
      type: string
      minLength: 1
      maxLength: 2048
      description: HTTPS, SSH, or SCP-style Git clone URL without embedded secrets.
    branch:
      type: string
      minLength: 1
      maxLength: 255
      description: Git branch tracked by repository refresh.
    commitIndexing:
      $ref: "#/RepositoryCommitIndexingMode"
    commitUrlTemplate:
      type: string
      minLength: 1
      maxLength: 2048
      description: >-
        Optional absolute HTTP or HTTPS commit-page template containing one
        {sha} placeholder. Known public Git providers are inferred when this is
        omitted.
    refreshCredentialName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Optional name of a Server credential source used to refresh this
        repository. The referenced secret value is never persisted in
        PostgreSQL.
    checkoutCredentialName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Optional logical credential name resolved by each execution cluster to
        a cluster-local Kubernetes Secret.

RepositoryCommitIndexingMode:
  type: string
  enum:
    - disabled
    - observedHeads
    - trackedBranchHistory
  x-enum-varnames:
    - RepositoryCommitIndexingDisabled
    - RepositoryCommitIndexingObservedHeads
    - RepositoryCommitIndexingTrackedBranchHistory
  description: >-
    Controls whether refresh records no presentation metadata, metadata only
    for observed branch heads, or metadata for the complete tracked branch
    history. Exact commit SHAs required by product records are retained in all
    modes.

RepositoryUpdate:
  type: object
  required:
    - commitIndexing
    - commitUrlTemplate
    - refreshCredentialName
    - checkoutCredentialName
  properties:
    commitIndexing:
      $ref: "#/RepositoryCommitIndexingMode"
    commitUrlTemplate:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 2048
      description: >-
        Replacement commit-page template, or null to use provider inference.
    refreshCredentialName:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Replacement Server refresh credential reference, or null for no
        credential. Secret values are not accepted or persisted.
    checkoutCredentialName:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Replacement logical execution checkout credential reference, or null
        for no credential.

RepositoryConnectionTestRequest:
  type: object
  required:
    - cloneUrl
    - branch
  properties:
    cloneUrl:
      type: string
      minLength: 1
      maxLength: 2048
      description: Proposed HTTPS, SSH, or SCP-style Git clone URL without embedded secrets.
    branch:
      type: string
      minLength: 1
      maxLength: 255
      description: Proposed Git branch to probe without fetching repository contents.
    refreshCredentialName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Optional Server refresh credential reference. The referenced secret is
        resolved only for the probe and is never returned or persisted.

RepositoryConnectionTestResult:
  type: object
  required:
    - status
    - durationMilliseconds
  properties:
    status:
      type: string
      enum:
        - succeeded
        - failed
      x-enum-varnames:
        - RepositoryConnectionTestSucceeded
        - RepositoryConnectionTestFailed
    durationMilliseconds:
      type: integer
      format: int64
      minimum: 0
      description: Elapsed Git probe time in milliseconds.
    commitSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Exact tracked branch head returned by a successful probe.
    diagnostic:
      type: string
      minLength: 1
      maxLength: 512
      description: Bounded non-sensitive explanation for a failed probe.

Repository:
  allOf:
    - $ref: "#/RepositoryConfig"
    - type: object
      required:
        - id
        - createdAt
        - refresh
      properties:
        id:
          type: string
          format: uuid
          description: Stable identity of the repository registration.
        createdAt:
          type: string
          format: date-time
          description: Time at which the repository was registered.
        refresh:
          $ref: "#/RepositoryRefresh"
        commitHistoryIndex:
          $ref: "#/RepositoryCommitHistoryIndex"

RepositoryCommitHistoryIndex:
  type: object
  required:
    - status
    - commitCount
  properties:
    status:
      type: string
      enum:
        - pending
        - succeeded
        - failed
      x-enum-varnames:
        - RepositoryCommitHistoryIndexStatusPending
        - RepositoryCommitHistoryIndexStatusSucceeded
        - RepositoryCommitHistoryIndexStatusFailed
    desiredHeadSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Current tracked branch head awaiting or represented by the index.
    indexedHeadSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Tracked branch head represented by the indexed commit set.
    commitCount:
      type: integer
      minimum: 0
      description: Number of commits currently reachable from the indexed tracked branch head.
    lastAttemptedAt:
      type: string
      format: date-time
    lastSucceededAt:
      type: string
      format: date-time
    failureReason:
      type: string
      minLength: 1

RepositoryRefresh:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - pending
        - succeeded
        - failed
      x-enum-varnames:
        - RepositoryRefreshStatusPending
        - RepositoryRefreshStatusSucceeded
        - RepositoryRefreshStatusFailed
      description: Result of the most recent branch refresh attempt.
    commit:
      allOf:
        - $ref: ./common.yaml#/GitCommit
      description: Most recently fetched commit, retained when a later refresh fails.
    attemptedAt:
      type: string
      format: date-time
      description: Time of the most recent refresh attempt.
    succeededAt:
      type: string
      format: date-time
      description: Time of the most recent successful refresh.
    failureReason:
      type: string
      minLength: 1
      description: Diagnostic from the most recent failed refresh attempt.

RepositoryRefreshAttempt:
  type: object
  required:
    - id
    - repositoryId
    - source
    - outcome
    - startedAt
    - durationMilliseconds
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of this immutable refresh attempt.
    repositoryId:
      type: string
      format: uuid
    source:
      type: string
      enum:
        - periodic
        - requested
      description: Whether the Server interval or an operator request started the attempt.
    outcome:
      type: string
      enum:
        - accepted
        - fetch-failed
        - catalog-rejected
      description: >-
        Accepted catalogs become active. A catalog-rejected attempt fetched Git
        successfully but did not pass catalog loading and validation.
    startedAt:
      type: string
      format: date-time
    durationMilliseconds:
      type: integer
      format: int64
      minimum: 0
      description: Elapsed fetch and catalog processing time in milliseconds.
    commit:
      allOf:
        - $ref: ./common.yaml#/GitCommit
      description: Fetched branch head, present for accepted and catalog-rejected attempts.
    diagnostic:
      type: string
      minLength: 1
      maxLength: 4096
      description: Bounded non-sensitive diagnostic for an unsuccessful attempt.

RepositoryRefreshAttemptList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/RepositoryRefreshAttempt"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

RepositoryList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Repository"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

RepositoryCommitList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/RepositoryCommit"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

RepositoryCommit:
  type: object
  required:
    - repositoryId
    - repositoryName
    - commit
  properties:
    repositoryId:
      type: string
      format: uuid
    repositoryName:
      type: string
    commit:
      $ref: ./common.yaml#/GitCommit

FailedGitTriggerDelivery:
  type: object
  required:
    - id
    - repositoryId
    - repositoryName
    - catalogRevisionId
    - commitSha
    - target
    - action
    - trigger
    - failureCount
    - diagnostic
    - failedAt
  properties:
    id:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    repositoryName:
      type: string
    catalogRevisionId:
      type: string
      format: uuid
    commitSha:
      type: string
    target:
      type: string
    action:
      type: string
    trigger:
      type: string
    failureCount:
      type: integer
      minimum: 1
    diagnostic:
      type: string
      maxLength: 512
      description: Fixed non-sensitive explanation without underlying error details or parameters.
    failedAt:
      type: string
      format: date-time

FailedGitTriggerDeliveryList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/FailedGitTriggerDelivery"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0
