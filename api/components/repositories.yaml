RepositoryConfig:
  type: object
  required:
    - name
    - cloneUrl
    - branch
    - commitIndexing
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Unique human-readable name of the active repository.
    cloneUrl:
      type: string
      minLength: 1
      maxLength: 2048
      description: HTTPS, SSH, or SCP-style Git clone URL without embedded secrets.
    branch:
      type: string
      minLength: 1
      maxLength: 255
      description: Git branch tracked by repository refresh.
    commitIndexing:
      $ref: "#/RepositoryCommitIndexingMode"
    commitUrlTemplate:
      type: string
      minLength: 1
      maxLength: 2048
      description: >-
        Optional absolute HTTP or HTTPS commit-page template containing one
        {sha} placeholder. Known public Git providers are inferred when this is
        omitted.
    refreshCredentialName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Optional name of a Server credential source used to refresh this
        repository. The referenced secret value is never persisted in
        PostgreSQL.
    checkoutCredentialName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: >-
        Optional logical credential name resolved by each execution cluster to
        a cluster-local Kubernetes Secret.

RepositoryCommitIndexingMode:
  type: string
  enum:
    - disabled
    - observedHeads
    - trackedBranchHistory
  x-enum-varnames:
    - RepositoryCommitIndexingDisabled
    - RepositoryCommitIndexingObservedHeads
    - RepositoryCommitIndexingTrackedBranchHistory
  description: >-
    Controls whether refresh records no presentation metadata, metadata only
    for observed branch heads, or metadata for the complete tracked branch
    history. Exact commit SHAs required by product records are retained in all
    modes.

RepositoryUpdate:
  type: object
  required:
    - commitIndexing
  properties:
    commitIndexing:
      $ref: "#/RepositoryCommitIndexingMode"

Repository:
  allOf:
    - $ref: "#/RepositoryConfig"
    - type: object
      required:
        - id
        - createdAt
        - refresh
      properties:
        id:
          type: string
          format: uuid
          description: Stable identity of the repository registration.
        createdAt:
          type: string
          format: date-time
          description: Time at which the repository was registered.
        refresh:
          $ref: "#/RepositoryRefresh"
        commitHistoryIndex:
          $ref: "#/RepositoryCommitHistoryIndex"

RepositoryCommitHistoryIndex:
  type: object
  required:
    - status
    - commitCount
  properties:
    status:
      type: string
      enum:
        - pending
        - succeeded
        - failed
      x-enum-varnames:
        - RepositoryCommitHistoryIndexStatusPending
        - RepositoryCommitHistoryIndexStatusSucceeded
        - RepositoryCommitHistoryIndexStatusFailed
    desiredHeadSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Current tracked branch head awaiting or represented by the index.
    indexedHeadSha:
      type: string
      pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
      description: Tracked branch head represented by the indexed commit set.
    commitCount:
      type: integer
      minimum: 0
      description: Number of commits currently reachable from the indexed tracked branch head.
    lastAttemptedAt:
      type: string
      format: date-time
    lastSucceededAt:
      type: string
      format: date-time
    failureReason:
      type: string
      minLength: 1

RepositoryRefresh:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - pending
        - succeeded
        - failed
      x-enum-varnames:
        - RepositoryRefreshStatusPending
        - RepositoryRefreshStatusSucceeded
        - RepositoryRefreshStatusFailed
      description: Result of the most recent branch refresh attempt.
    commit:
      allOf:
        - $ref: ./common.yaml#/GitCommit
      description: Most recently fetched commit, retained when a later refresh fails.
    attemptedAt:
      type: string
      format: date-time
      description: Time of the most recent refresh attempt.
    succeededAt:
      type: string
      format: date-time
      description: Time of the most recent successful refresh.
    failureReason:
      type: string
      minLength: 1
      description: Diagnostic from the most recent failed refresh attempt.

RepositoryList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Repository"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

RepositoryCommitList:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/RepositoryCommit"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

RepositoryCommit:
  type: object
  required:
    - repositoryId
    - repositoryName
    - commit
  properties:
    repositoryId:
      type: string
      format: uuid
    repositoryName:
      type: string
    commit:
      $ref: ./common.yaml#/GitCommit
