PromotionStatus:
  type: string
  enum:
    - creating
    - preparing
    - pending
    - approved
    - rejected
    - expired
    - error

PromotionSource:
  type: string
  enum:
    - kargo
    - slipramp

PromotionPolicyMode:
  type: string
  enum:
    - automatic
    - review-required

PromotionPipelineAttention:
  type: string
  enum:
    - any
    - drifted
    - outdated

PromotionFreight:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionFreightItem"

PromotionFreightItem:
  type: object
  additionalProperties: false
  required:
    - origin
    - name
    - artifacts
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    name:
      type: string
      minLength: 1
      maxLength: 253
    artifacts:
      type: array
      items:
        $ref: "#/PromotionFreightArtifact"

PromotionFreightArtifact:
  type: object
  additionalProperties: false
  required:
    - kind
    - version
  properties:
    kind:
      type: string
      enum:
        - git
        - image
        - chart
    repository:
      type: string
      minLength: 1
      maxLength: 2048
    version:
      type: string
      minLength: 1
      maxLength: 512

PromotionFreightRequest:
  type: object
  additionalProperties: false
  required:
    - origin
    - direct
    - sourceStages
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    direct:
      type: boolean
    sourceStages:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 253
        pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$

KargoPromotionRequest:
  type: object
  additionalProperties: false
  required:
    - externalPromotionId
    - project
    - stage
    - baseRevision
    - candidateRevision
    - candidateBranch
  properties:
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 253
    project:
      $ref: ./runs.yaml#/CatalogName
    stage:
      type: string
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    baseRevision:
      $ref: "#/GitRevision"
    candidateRevision:
      $ref: "#/GitRevision"
    candidateBranch:
      type: string
      minLength: 17
      maxLength: 255
      pattern: ^kargo/promotion/.+$

KargoPromotionResponse:
  type: object
  additionalProperties: false
  required:
    - id
    - externalPromotionId
    - status
    - reviewRequired
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 253
    status:
      $ref: "#/PromotionStatus"
    reviewRequired:
      type: boolean
    message:
      type: string
      minLength: 1
      maxLength: 4096
    updatedAt:
      type: string
      format: date-time

PromotionStageObservation:
  type: object
  additionalProperties: false
  required:
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - application
    - environment
    - repositoryUrl
    - targetBranch
    - sourcePaths
    - requestedFreight
    - freight
    - directFreight
    - autoPromotionEnabled
  properties:
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionFreightRequest"
    freight:
      $ref: "#/PromotionFreight"
    directFreight:
      $ref: "#/PromotionFreight"
      description: Latest directly sourced Freight observed for each requested origin.
    autoPromotionEnabled:
      type: boolean
      description: Effective Kargo auto-promotion state for this Stage.
    healthStatus:
      type: string
      minLength: 1
      maxLength: 200
      description: Aggregate health status reported by Kargo for this Stage.
    argoApplicationNamespace:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Namespace of the matching Argo CD Application reported by Kargo health output.
    successfulRenderAcknowledgement:
      $ref: "#/SuccessfulRenderAcknowledgement"

KargoStageSnapshot:
  type: object
  additionalProperties: false
  required:
    - snapshotId
    - observedAt
    - stages
  properties:
    snapshotId:
      type: string
      format: uuid
    observedAt:
      type: string
      format: date-time
    stages:
      type: array
      items:
        $ref: "#/PromotionStageObservation"

PromotionProject:
  type: object
  additionalProperties: false
  required:
    - integration
    - cluster
    - project
    - stageCount
    - applicationCount
    - lastObservedAt
  properties:
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    stageCount:
      type: integer
      minimum: 1
    applicationCount:
      type: integer
      minimum: 1
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Project in the configured Kargo UI.

PromotionProjectList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionProject"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionStage:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - application
    - environment
    - repository
    - repositoryUrl
    - targetBranch
    - sourcePaths
    - requestedFreight
    - freight
    - autoPromotionEnabled
    - policy
    - pendingPromotionCount
    - firstObservedAt
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repository:
      $ref: ./runs.yaml#/CatalogName
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 1024
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionFreightRequest"
    freight:
      $ref: "#/PromotionFreight"
    autoPromotionEnabled:
      type: boolean
      description: Effective Kargo auto-promotion state for this Stage.
    successfulRenderAcknowledgement:
      $ref: "#/SuccessfulRenderAcknowledgement"
    policy:
      $ref: "#/PromotionStagePolicy"
    pendingPromotionCount:
      type: integer
      minimum: 0
    firstObservedAt:
      type: string
      format: date-time
    lastObservedAt:
      type: string
      format: date-time
    archivedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionStageList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionStage"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionPipelineStage:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - environment
    - freight
    - promotionSources
    - availableFreight
    - autoPromotionEnabled
    - policy
    - pendingPromotionCount
    - observationStale
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 253
    environment:
      type: string
      minLength: 1
      maxLength: 200
    freight:
      $ref: "#/PromotionFreight"
    promotionSources:
      type: array
      items:
        $ref: "#/PromotionFreightSource"
    availableFreight:
      $ref: "#/PromotionFreight"
      description: Exact observed Freight not currently deployed to this Stage.
    autoPromotionEnabled:
      type: boolean
      description: Effective Kargo auto-promotion state for this Stage.
    policy:
      $ref: "#/PromotionStagePolicy"
    pendingPromotionCount:
      type: integer
      minimum: 0
    healthStatus:
      type: string
      minLength: 1
      maxLength: 200
      description: Most recently observed aggregate Kargo health status for this Stage.
    observationStale:
      type: boolean
      description: Whether the Stage observation exceeds the integration freshness limit.
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.
    argoCdUrl:
      type: string
      format: uri
      description: Direct link to the observed Application in the configured Argo CD UI.

PromotionFreightSource:
  type: object
  additionalProperties: false
  required:
    - stageId
    - stageName
    - environment
    - freight
  properties:
    stageId:
      type: string
      format: uuid
    stageName:
      type: string
      minLength: 1
      maxLength: 253
    environment:
      type: string
      minLength: 1
      maxLength: 200
    freight:
      $ref: "#/PromotionFreight"

PromotionPipeline:
  type: object
  additionalProperties: false
  required:
    - integration
    - cluster
    - project
    - repository
    - application
    - environmentOrder
    - stages
  properties:
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    repository:
      $ref: ./runs.yaml#/CatalogName
    application:
      type: string
      minLength: 1
      maxLength: 200
    environmentOrder:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 200
    stages:
      type: array
      minItems: 1
      items:
        $ref: "#/PromotionPipelineStage"

PromotionPipelineList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionPipeline"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionBranchDriftStatus:
  type: string
  enum:
    - current
    - drifted
    - unknown

PromotionBranchDriftStage:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - application
    - environment
    - targetBranch
    - sourcePaths
    - freight
    - policy
    - status
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024
    freight:
      $ref: "#/PromotionFreight"
    policy:
      $ref: "#/PromotionStagePolicy"
    status:
      $ref: "#/PromotionBranchDriftStatus"
    acknowledgedSourceCommit:
      $ref: ./common.yaml#/GitCommit
    acknowledgedRenderBaseCommit:
      $ref: ./common.yaml#/GitCommit
    acknowledgedRenderCommit:
      $ref: ./common.yaml#/GitCommit
    sourceBranchCommit:
      $ref: ./common.yaml#/GitCommit
    targetBranchCommit:
      $ref: ./common.yaml#/GitCommit
    sourceDrift:
      type: boolean
    targetDrift:
      type: boolean
    noOpRender:
      type: boolean
    message:
      type: string
      minLength: 1
      maxLength: 4096
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionBranchDriftRepository:
  type: object
  additionalProperties: false
  required:
    - repository
    - scannedAt
    - stages
  properties:
    repository:
      $ref: ./runs.yaml#/CatalogName
    sourceBranch:
      type: string
      minLength: 1
      maxLength: 255
    scannedAt:
      type: string
      format: date-time
    error:
      type: string
      minLength: 1
      maxLength: 4096
    stages:
      type: array
      minItems: 1
      items:
        $ref: "#/PromotionBranchDriftStage"

PromotionBranchDriftList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      description: Repository groups containing only the matching Stages on this page.
      items:
        $ref: "#/PromotionBranchDriftRepository"
    total:
      type: integer
      minimum: 0
      description: Total number of matching Stages across all Repository groups.
    limit:
      type: integer
      minimum: 1
      description: Maximum number of Stages on this page across all Repository groups.
    offset:
      type: integer
      minimum: 0
      description: Number of matching Stages skipped across all Repository groups.

PromotionStagePolicy:
  type: object
  additionalProperties: false
  required:
    - configuredMode
    - effectiveMode
  properties:
    configuredMode:
      $ref: "#/PromotionPolicyMode"
    effectiveMode:
      $ref: "#/PromotionPolicyMode"
    expiresAt:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 4096
    updatedBy:
      $ref: ./runs.yaml#/RunActor
    updatedAt:
      type: string
      format: date-time

PromotionStagePolicyUpdate:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      $ref: "#/PromotionPolicyMode"
    expiresAt:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 4096

PromotionDecision:
  type: object
  additionalProperties: false
  required:
    - decision
    - decidedBy
    - decidedAt
  properties:
    decision:
      type: string
      enum:
        - approved
        - rejected
    comment:
      type: string
      minLength: 1
      maxLength: 4096
    decidedBy:
      $ref: ./runs.yaml#/RunActor
    decidedAt:
      type: string
      format: date-time

PromotionDecisionUpdate:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - approved
        - rejected
    comment:
      type: string
      minLength: 1
      maxLength: 4096

SuccessfulRenderAcknowledgement:
  type: object
  additionalProperties: false
  properties:
    sourceRevision:
      type: string
    targetRevision:
      type: string
    resultRevision:
      type: string

PromotionStageSnapshot:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - application
    - environment
    - repository
    - repositoryUrl
    - targetBranch
    - sourcePaths
    - requestedFreight
    - freight
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repository:
      $ref: ./runs.yaml#/CatalogName
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 1024
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionFreightRequest"
    freight:
      $ref: "#/PromotionFreight"
    successfulRenderAcknowledgement:
      $ref: "#/SuccessfulRenderAcknowledgement"
    lastObservedAt:
      type: string
      format: date-time

PromotionRepositorySnapshot:
  type: object
  additionalProperties: false
  required:
    - name
    - cloneUrl
    - branch
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cloneUrl:
      type: string
    branch:
      type: string
    checkoutCredentialName:
      type: string

KargoPromotionOutcome:
  type: object
  additionalProperties: false
  required:
    - phase
    - observedAt
  properties:
    phase:
      type: string
      enum:
        - Succeeded
        - Failed
        - Errored
        - Aborted
      description: Exact terminal phase reported by Kargo.
    observedAt:
      type: string
      format: date-time
      description: Time Slipramp accepted the Controller's terminal observation.
    diagnostic:
      type: string
      minLength: 1
      maxLength: 4096
      description: Bounded sanitized Kargo diagnostic, when available.

Promotion:
  type: object
  additionalProperties: false
  required:
    - id
    - source
    - integration
    - externalPromotionId
    - stageId
    - stageSnapshot
    - repositoryId
    - repositorySnapshot
    - targetBranch
    - policySnapshot
    - reviewRequired
    - status
    - dispatchAttemptCount
    - requestedBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    source:
      $ref: "#/PromotionSource"
    integration:
      $ref: ./runs.yaml#/CatalogName
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 253
    stageId:
      type: string
      format: uuid
    sourceStageId:
      type: string
      format: uuid
    stageSnapshot:
      $ref: "#/PromotionStageSnapshot"
    repositoryId:
      type: string
      format: uuid
    repositorySnapshot:
      $ref: "#/PromotionRepositorySnapshot"
    baseCommit:
      $ref: ./common.yaml#/GitCommit
    candidateCommit:
      $ref: ./common.yaml#/GitCommit
    candidateBranch:
      type: string
      minLength: 17
      maxLength: 255
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    policySnapshot:
      $ref: "#/PromotionStagePolicy"
    selectedFreight:
      $ref: "#/PromotionFreightItem"
    reviewRequired:
      type: boolean
    status:
      $ref: "#/PromotionStatus"
    message:
      type: string
      minLength: 1
      maxLength: 4096
    dispatchAttemptCount:
      type: integer
      minimum: 0
    nextDispatchAt:
      type: string
      format: date-time
    lastDispatchAt:
      type: string
      format: date-time
    dispatchedAt:
      type: string
      format: date-time
    kargoPromotionUid:
      type: string
      minLength: 1
      maxLength: 200
    nextReconciliationAt:
      type: string
      format: date-time
      description: >-
        Next durable inspection time while the responsible Controller awaits
        callback hydration or a terminal Kargo outcome.
    lastReconciliationAt:
      type: string
      format: date-time
      description: Most recent time reconciliation work was claimed by the responsible Controller.
    kargoOutcome:
      $ref: "#/KargoPromotionOutcome"
    preparationRunId:
      type: string
      format: uuid
    preparationRun:
      $ref: ./runs.yaml#/Run
    gitDiffArtifactId:
      type: string
      format: uuid
    gitDiffArtifact:
      $ref: ./artifacts.yaml#/Artifact
    argoDiffArtifactId:
      type: string
      format: uuid
    argoDiffArtifact:
      $ref: ./artifacts.yaml#/Artifact
    requestedBy:
      $ref: ./runs.yaml#/RunActor
    decision:
      $ref: "#/PromotionDecision"
    createdAt:
      type: string
      format: date-time
    preparationCompletedAt:
      type: string
      format: date-time
    decidedAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Promotion in the configured Kargo UI.
    argoCdUrl:
      type: string
      format: uri
      description: Direct link to the snapshotted Stage Application in the configured Argo CD UI.

PromotionCreate:
  type: object
  additionalProperties: false
  required:
    - freightName
  properties:
    sourceStageId:
      type: string
      format: uuid
      description: Source Stage supplying the Freight. Omit for directly requested Warehouse Freight.
    freightName:
      type: string
      minLength: 1
      maxLength: 253
    policy:
      $ref: "#/PromotionStagePolicyUpdate"
      description: Optional Stage policy change applied atomically before this Promotion snapshots policy.

PromotionList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Promotion"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionRunSource:
  type: object
  additionalProperties: false
  required:
    - promotionId
  properties:
    promotionId:
      type: string
      format: uuid

GitRevision:
  type: string
  pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
