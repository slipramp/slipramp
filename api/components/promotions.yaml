PromotionStatus:
  type: string
  enum:
    - preparing
    - pending
    - approved
    - rejected
    - expired
    - error

PromotionPolicyMode:
  type: string
  enum:
    - automatic
    - review-required

PromotionFreight:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionFreightItem"

PromotionFreightItem:
  type: object
  additionalProperties: false
  required:
    - origin
    - name
    - artifacts
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    name:
      type: string
      minLength: 1
      maxLength: 253
    artifacts:
      type: array
      items:
        $ref: "#/PromotionFreightArtifact"

PromotionFreightArtifact:
  type: object
  additionalProperties: false
  required:
    - kind
    - version
  properties:
    kind:
      type: string
      enum:
        - git
        - image
        - chart
    repository:
      type: string
      minLength: 1
      maxLength: 2048
    version:
      type: string
      minLength: 1
      maxLength: 512

KargoPromotionRequest:
  type: object
  additionalProperties: false
  required:
    - externalPromotionId
    - project
    - stage
    - baseRevision
    - candidateRevision
    - candidateBranch
  properties:
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 200
    project:
      $ref: ./runs.yaml#/CatalogName
    stage:
      type: string
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    baseRevision:
      $ref: "#/GitRevision"
    candidateRevision:
      $ref: "#/GitRevision"
    candidateBranch:
      type: string
      minLength: 17
      maxLength: 255
      pattern: ^kargo/promotion/.+$

KargoPromotionResponse:
  type: object
  additionalProperties: false
  required:
    - id
    - externalPromotionId
    - status
    - reviewRequired
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 200
    status:
      $ref: "#/PromotionStatus"
    reviewRequired:
      type: boolean
    message:
      type: string
      minLength: 1
      maxLength: 4096
    updatedAt:
      type: string
      format: date-time

PromotionStageObservation:
  type: object
  additionalProperties: false
  required:
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - application
    - environment
    - repositoryUrl
    - targetBranch
    - sourcePaths
    - freight
  properties:
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024
    freight:
      $ref: "#/PromotionFreight"
    successfulRenderAcknowledgement:
      type: object
      additionalProperties: true

KargoStageSnapshot:
  type: object
  additionalProperties: false
  required:
    - snapshotId
    - observedAt
    - stages
  properties:
    snapshotId:
      type: string
      format: uuid
    observedAt:
      type: string
      format: date-time
    stages:
      type: array
      items:
        $ref: "#/PromotionStageObservation"

PromotionStage:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - application
    - environment
    - repository
    - repositoryUrl
    - targetBranch
    - sourcePaths
    - freight
    - policy
    - pendingPromotionCount
    - firstObservedAt
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repository:
      $ref: ./runs.yaml#/CatalogName
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 1024
    freight:
      $ref: "#/PromotionFreight"
    successfulRenderAcknowledgement:
      type: object
      additionalProperties: true
    policy:
      $ref: "#/PromotionStagePolicy"
    pendingPromotionCount:
      type: integer
      minimum: 0
    firstObservedAt:
      type: string
      format: date-time
    lastObservedAt:
      type: string
      format: date-time
    archivedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionStageList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionStage"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionPipelineStage:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - environment
    - freight
    - pendingPromotionCount
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 253
    environment:
      type: string
      minLength: 1
      maxLength: 200
    freight:
      $ref: "#/PromotionFreight"
    pendingPromotionCount:
      type: integer
      minimum: 0
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionPipeline:
  type: object
  additionalProperties: false
  required:
    - integration
    - cluster
    - project
    - repository
    - application
    - environmentOrder
    - stages
  properties:
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    repository:
      $ref: ./runs.yaml#/CatalogName
    application:
      type: string
      minLength: 1
      maxLength: 200
    environmentOrder:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 200
    stages:
      type: array
      minItems: 1
      items:
        $ref: "#/PromotionPipelineStage"

PromotionPipelineList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionPipeline"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionBranchDriftStatus:
  type: string
  enum:
    - current
    - drifted
    - unknown

PromotionBranchDriftStage:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - application
    - environment
    - targetBranch
    - sourcePaths
    - status
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024
    status:
      $ref: "#/PromotionBranchDriftStatus"
    acknowledgedSourceCommit:
      $ref: ./common.yaml#/GitCommit
    acknowledgedRenderBaseCommit:
      $ref: ./common.yaml#/GitCommit
    acknowledgedRenderCommit:
      $ref: ./common.yaml#/GitCommit
    sourceBranchCommit:
      $ref: ./common.yaml#/GitCommit
    targetBranchCommit:
      $ref: ./common.yaml#/GitCommit
    sourceDrift:
      type: boolean
    targetDrift:
      type: boolean
    noOpRender:
      type: boolean
    message:
      type: string
      minLength: 1
      maxLength: 4096
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionBranchDriftRepository:
  type: object
  additionalProperties: false
  required:
    - repository
    - scannedAt
    - stages
  properties:
    repository:
      $ref: ./runs.yaml#/CatalogName
    sourceBranch:
      type: string
      minLength: 1
      maxLength: 255
    scannedAt:
      type: string
      format: date-time
    error:
      type: string
      minLength: 1
      maxLength: 4096
    stages:
      type: array
      minItems: 1
      items:
        $ref: "#/PromotionBranchDriftStage"

PromotionBranchDriftList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionBranchDriftRepository"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionStagePolicy:
  type: object
  additionalProperties: false
  required:
    - configuredMode
    - effectiveMode
  properties:
    configuredMode:
      $ref: "#/PromotionPolicyMode"
    effectiveMode:
      $ref: "#/PromotionPolicyMode"
    expiresAt:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 4096
    updatedBy:
      $ref: ./runs.yaml#/RunActor
    updatedAt:
      type: string
      format: date-time

PromotionStagePolicyUpdate:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      $ref: "#/PromotionPolicyMode"
    expiresAt:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 4096

PromotionDecision:
  type: object
  additionalProperties: false
  required:
    - decision
    - decidedBy
    - decidedAt
  properties:
    decision:
      type: string
      enum:
        - approved
        - rejected
    comment:
      type: string
      minLength: 1
      maxLength: 4096
    decidedBy:
      $ref: ./runs.yaml#/RunActor
    decidedAt:
      type: string
      format: date-time

PromotionDecisionUpdate:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - approved
        - rejected
    comment:
      type: string
      minLength: 1
      maxLength: 4096

Promotion:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - externalPromotionId
    - stageId
    - stageSnapshot
    - repositoryId
    - repositorySnapshot
    - baseCommit
    - candidateCommit
    - candidateBranch
    - targetBranch
    - policySnapshot
    - reviewRequired
    - status
    - requestedBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 200
    stageId:
      type: string
      format: uuid
    stageSnapshot:
      type: object
      additionalProperties: true
    repositoryId:
      type: string
      format: uuid
    repositorySnapshot:
      type: object
      additionalProperties: true
    baseCommit:
      $ref: ./common.yaml#/GitCommit
    candidateCommit:
      $ref: ./common.yaml#/GitCommit
    candidateBranch:
      type: string
      minLength: 17
      maxLength: 255
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    policySnapshot:
      type: object
      additionalProperties: true
    reviewRequired:
      type: boolean
    status:
      $ref: "#/PromotionStatus"
    message:
      type: string
      minLength: 1
      maxLength: 4096
    preparationRunId:
      type: string
      format: uuid
    preparationRun:
      $ref: ./runs.yaml#/Run
    gitDiffArtifactId:
      type: string
      format: uuid
    gitDiffArtifact:
      $ref: ./artifacts.yaml#/Artifact
    argoDiffArtifactId:
      type: string
      format: uuid
    argoDiffArtifact:
      $ref: ./artifacts.yaml#/Artifact
    requestedBy:
      $ref: ./runs.yaml#/RunActor
    decision:
      $ref: "#/PromotionDecision"
    createdAt:
      type: string
      format: date-time
    preparationCompletedAt:
      type: string
      format: date-time
    decidedAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Promotion in the configured Kargo UI.

PromotionList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Promotion"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionRunSource:
  type: object
  additionalProperties: false
  required:
    - promotionId
  properties:
    promotionId:
      type: string
      format: uuid

GitRevision:
  type: string
  pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
