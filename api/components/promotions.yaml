PromotionStatus:
  type: string
  enum:
    - creating
    - preparing
    - pending
    - approved
    - rejected
    - expired
    - error

PromotionSource:
  type: string
  enum:
    - kargo
    - slipramp

PromotionPolicyMode:
  type: string
  enum:
    - automatic
    - review-required

PromotionFreight:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionFreightItem"

PromotionFreightItem:
  type: object
  additionalProperties: false
  required:
    - origin
    - name
    - artifacts
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    name:
      type: string
      minLength: 1
      maxLength: 253
    artifacts:
      type: array
      items:
        $ref: "#/PromotionFreightArtifact"
    approvedFor:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 253
    verifiedIn:
      type: array
      items:
        $ref: "#/PromotionFreightVerification"
    currentlyIn:
      type: array
      items:
        $ref: "#/PromotionFreightOccupancy"

PromotionFreightVerification:
  type: object
  additionalProperties: false
  required:
    - stage
    - longestCompletedSoak
  properties:
    stage:
      type: string
      minLength: 1
      maxLength: 253
    longestCompletedSoak:
      type: string
      description: Go duration representing the longest completed continuous occupancy.

PromotionFreightOccupancy:
  type: object
  additionalProperties: false
  required:
    - stage
    - since
  properties:
    stage:
      type: string
      minLength: 1
      maxLength: 253
    since:
      type: string
      format: date-time

PromotionFreightArtifact:
  type: object
  additionalProperties: false
  required:
    - kind
    - version
  properties:
    kind:
      type: string
      enum:
        - git
        - image
        - chart
    repository:
      type: string
      minLength: 1
      maxLength: 2048
    version:
      type: string
      minLength: 1
      maxLength: 512

PromotionFreightRequest:
  type: object
  additionalProperties: false
  required:
    - origin
    - direct
    - sourceStages
    - availabilityStrategy
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    direct:
      type: boolean
    sourceStages:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 253
        pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    availabilityStrategy:
      type: string
      enum: [OneOf, All]
    requiredSoakTime:
      type: string
      description: Optional Kargo duration required in an upstream Stage.

KargoPromotionRequest:
  type: object
  additionalProperties: false
  description: >-
    Native Kargo Promotion identity with optional Git audit context. Supply baseRevision,
    candidateRevision, and candidateBranch together or omit all three. Git audit context is
    required when the effective policy requires Slipramp review.
  required:
    - externalPromotionId
    - project
    - stage
  properties:
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 253
    project:
      $ref: ./runs.yaml#/CatalogName
    stage:
      type: string
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    baseRevision:
      description: Base Git revision for Slipramp review and audit context.
      $ref: "#/GitRevision"
    candidateRevision:
      description: Candidate Git revision for Slipramp review and audit context.
      $ref: "#/GitRevision"
    candidateBranch:
      description: Candidate branch for Slipramp review and audit context.
      type: string
      minLength: 17
      maxLength: 255
      pattern: ^kargo/promotion/.+$

KargoPromotionResponse:
  type: object
  additionalProperties: false
  required:
    - id
    - externalPromotionId
    - status
    - reviewRequired
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 253
    status:
      $ref: "#/PromotionStatus"
    reviewRequired:
      type: boolean
    message:
      type: string
      minLength: 1
      maxLength: 4096
    updatedAt:
      type: string
      format: date-time

PromotionStageObservation:
  type: object
  additionalProperties: false
  required:
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - requestedFreight
    - freight
    - candidateFreight
    - autoPromotionEnabled
    - controlFlow
    - conditions
  properties:
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionFreightRequest"
    freight:
      $ref: "#/PromotionFreight"
    candidateFreight:
      $ref: "#/PromotionFreight"
      description: Latest observed Freight for each requested origin, including Kargo eligibility evidence.
    autoPromotionEnabled:
      type: boolean
      description: Effective Kargo auto-promotion state for this Stage.
    controlFlow:
      type: boolean
      description: Whether the Stage has no Promotion steps and only describes control flow.
    conditions:
      type: array
      items:
        $ref: "#/PromotionStageCondition"
    currentPromotion:
      $ref: "#/PromotionStagePromotionReference"
    lastPromotion:
      $ref: "#/PromotionStagePromotionReference"
    healthStatus:
      type: string
      minLength: 1
      maxLength: 200
      description: Aggregate health status reported by Kargo for this Stage.
    argoApplicationNamespace:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      description: Namespace of the matching Argo CD Application reported by Kargo health output.
    successfulRenderAcknowledgement:
      $ref: "#/SuccessfulRenderAcknowledgement"

PromotionStageCondition:
  type: object
  additionalProperties: false
  required:
    - type
    - status
  properties:
    type:
      type: string
      minLength: 1
      maxLength: 200
    status:
      type: string
      minLength: 1
      maxLength: 32
    reason:
      type: string
      minLength: 1
      maxLength: 200
    message:
      type: string
      minLength: 1
      maxLength: 4096
    lastTransitionTime:
      type: string
      format: date-time

PromotionStagePromotionReference:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 253
    phase:
      type: string
      minLength: 1
      maxLength: 100
    finishedAt:
      type: string
      format: date-time

KargoStageSnapshot:
  type: object
  additionalProperties: false
  required:
    - snapshotId
    - observedAt
    - stages
  properties:
    snapshotId:
      type: string
      format: uuid
    observedAt:
      type: string
      format: date-time
    stages:
      type: array
      items:
        $ref: "#/PromotionStageObservation"

PromotionProject:
  type: object
  additionalProperties: false
  required:
    - integration
    - cluster
    - project
    - stageCount
    - unhealthyStageCount
    - staleStageCount
    - pendingReviewCount
    - freightDifferenceCount
    - unknownFreightComparisonCount
    - latestObservedAt
  properties:
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    stageCount:
      type: integer
      minimum: 1
    unhealthyStageCount:
      type: integer
      minimum: 0
    staleStageCount:
      type: integer
      minimum: 0
    pendingReviewCount:
      type: integer
      minimum: 0
    freightDifferenceCount:
      type: integer
      minimum: 0
      description: Number of requested source Stage relationships with different current Freight.
    unknownFreightComparisonCount:
      type: integer
      minimum: 0
      description: Number of requested source Stage relationships without usable comparison evidence.
    latestObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Project in the configured Kargo UI.

PromotionProjectList:
  type: object
  additionalProperties: false
  required:
    - items
    - summary
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionProject"
    summary:
      $ref: "#/PromotionProjectListSummary"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionProjectListSummary:
  type: object
  additionalProperties: false
  required:
    - freightDifferenceCount
    - unknownFreightComparisonCount
  properties:
    freightDifferenceCount:
      type: integer
      minimum: 0
      description: Freight differences across all Projects matching the filters before pagination.
    unknownFreightComparisonCount:
      type: integer
      minimum: 0
      description: Unknown Freight comparisons across all Projects matching the filters before pagination.

PromotionProjectDetail:
  type: object
  additionalProperties: false
  required:
    - integration
    - cluster
    - project
    - stages
  properties:
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    kargoUrl:
      type: string
      format: uri
    stages:
      type: array
      items:
        $ref: "#/PromotionProjectStage"

PromotionProjectStage:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - kubernetesUid
    - resourceVersion
    - observationStale
    - controlFlow
    - conditions
    - requestedFreight
    - freightAlignments
    - freight
    - autoPromotionEnabled
    - policy
    - pendingPromotionCount
    - firstObservedAt
    - lastObservedAt
    - capabilities
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 253
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    observationStale:
      type: boolean
    controlFlow:
      type: boolean
    conditions:
      type: array
      items:
        $ref: "#/PromotionStageCondition"
    currentPromotion:
      $ref: "#/PromotionStagePromotionReference"
    lastPromotion:
      $ref: "#/PromotionStagePromotionReference"
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionProjectFreightRequest"
    freightAlignments:
      type: array
      description: >-
        Exact requested source Stage relationships evaluated from durable current Freight observations.
      items:
        $ref: "#/PromotionFreightAlignment"
    freight:
      $ref: "#/PromotionFreight"
    autoPromotionEnabled:
      type: boolean
    healthStatus:
      type: string
      minLength: 1
      maxLength: 200
    policy:
      $ref: "#/PromotionStagePolicy"
    pendingPromotionCount:
      type: integer
      minimum: 0
    enrichment:
      $ref: "#/PromotionStageEnrichment"
    capabilities:
      $ref: "#/PromotionStageCapabilities"
    firstObservedAt:
      type: string
      format: date-time
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
    argoCdUrl:
      type: string
      format: uri

PromotionProjectFreightRequest:
  type: object
  additionalProperties: false
  required:
    - origin
    - direct
    - sources
    - availabilityStrategy
    - candidates
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    direct:
      type: boolean
    sources:
      type: array
      items:
        $ref: "#/PromotionProjectStageSource"
    availabilityStrategy:
      type: string
      enum: [OneOf, All]
    requiredSoakTime:
      type: string
    candidates:
      type: array
      items:
        $ref: "#/PromotionFreightCandidate"

PromotionProjectStageSource:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 253
    stageId:
      type: string
      format: uuid

PromotionFreightAlignmentStatus:
  type: string
  enum: [aligned, different, unknown]

PromotionFreightAlignment:
  type: object
  additionalProperties: false
  required:
    - origin
    - sourceStageName
    - targetStageId
    - status
  properties:
    origin:
      type: string
      minLength: 1
      maxLength: 512
    sourceStageName:
      type: string
      minLength: 1
      maxLength: 253
    sourceStageId:
      type: string
      format: uuid
      description: Resolved active source Stage identity when it exists in the same Project boundary.
    targetStageId:
      type: string
      format: uuid
    status:
      $ref: "#/PromotionFreightAlignmentStatus"
    sourceCurrentFreight:
      $ref: "#/PromotionFreightItem"
    targetCurrentFreight:
      $ref: "#/PromotionFreightItem"
    reason:
      type: string
      minLength: 1
      maxLength: 4096
      description: Concise explanation for a different or unknown comparison.

PromotionFreightCandidate:
  type: object
  additionalProperties: false
  required:
    - freight
    - readiness
    - evidence
  properties:
    freight:
      $ref: "#/PromotionFreightItem"
    readiness:
      type: string
      enum: [ready, unavailable, unknown]
    reason:
      type: string
      minLength: 1
      maxLength: 4096
    evidence:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 512

PromotionStageEnrichment:
  type: object
  additionalProperties: false
  properties:
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repository:
      $ref: ./runs.yaml#/CatalogName
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024

PromotionStageCapabilities:
  type: object
  additionalProperties: false
  required:
    - promotion
    - review
    - branchDrift
  properties:
    promotion:
      $ref: "#/PromotionStageCapability"
      description: Native Kargo Promotion capability using exact observed Freight.
    review:
      $ref: "#/PromotionStageCapability"
      description: Slipramp preparation, preview, and operator review capability.
    branchDrift:
      $ref: "#/PromotionStageCapability"
      description: Cached Git branch-drift capability.

PromotionStageCapability:
  type: object
  additionalProperties: false
  required:
    - status
  properties:
    status:
      type: string
      enum: [ready, unavailable]
    reason:
      type: string
      minLength: 1
      maxLength: 512

PromotionStage:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - sourcePaths
    - requestedFreight
    - freight
    - autoPromotionEnabled
    - policy
    - pendingPromotionCount
    - firstObservedAt
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    repository:
      $ref: ./runs.yaml#/CatalogName
    repositoryUrl:
      type: string
      minLength: 1
      maxLength: 2048
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 1024
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionFreightRequest"
    freight:
      $ref: "#/PromotionFreight"
    autoPromotionEnabled:
      type: boolean
      description: Effective Kargo auto-promotion state for this Stage.
    successfulRenderAcknowledgement:
      $ref: "#/SuccessfulRenderAcknowledgement"
    policy:
      $ref: "#/PromotionStagePolicy"
    pendingPromotionCount:
      type: integer
      minimum: 0
    firstObservedAt:
      type: string
      format: date-time
    lastObservedAt:
      type: string
      format: date-time
    archivedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionStageList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/PromotionStage"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionBranchDriftStatus:
  type: string
  enum:
    - current
    - drifted
    - unknown

PromotionBranchDriftStage:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - targetBranch
    - sourcePaths
    - freight
    - policy
    - capabilities
    - status
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    application:
      type: string
      minLength: 1
      maxLength: 200
    environment:
      type: string
      minLength: 1
      maxLength: 200
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    sourcePaths:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1024
    freight:
      $ref: "#/PromotionFreight"
    policy:
      $ref: "#/PromotionStagePolicy"
    capabilities:
      $ref: "#/PromotionStageCapabilities"
    status:
      $ref: "#/PromotionBranchDriftStatus"
    acknowledgedSourceCommit:
      $ref: ./common.yaml#/GitCommit
    acknowledgedRenderBaseCommit:
      $ref: ./common.yaml#/GitCommit
    acknowledgedRenderCommit:
      $ref: ./common.yaml#/GitCommit
    sourceBranchCommit:
      $ref: ./common.yaml#/GitCommit
    targetBranchCommit:
      $ref: ./common.yaml#/GitCommit
    sourceDrift:
      type: boolean
    targetDrift:
      type: boolean
    noOpRender:
      type: boolean
    message:
      type: string
      minLength: 1
      maxLength: 4096
    lastObservedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Stage in the configured Kargo UI.

PromotionBranchDriftRepository:
  type: object
  additionalProperties: false
  required:
    - repository
    - scannedAt
    - stages
  properties:
    repository:
      $ref: ./runs.yaml#/CatalogName
    sourceBranch:
      type: string
      minLength: 1
      maxLength: 255
    scannedAt:
      type: string
      format: date-time
    error:
      type: string
      minLength: 1
      maxLength: 4096
    stages:
      type: array
      minItems: 1
      items:
        $ref: "#/PromotionBranchDriftStage"

PromotionBranchDriftList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      description: Repository groups containing only the matching Stages on this page.
      items:
        $ref: "#/PromotionBranchDriftRepository"
    total:
      type: integer
      minimum: 0
      description: Total number of matching Stages across all Repository groups.
    limit:
      type: integer
      minimum: 1
      description: Maximum number of Stages on this page across all Repository groups.
    offset:
      type: integer
      minimum: 0
      description: Number of matching Stages skipped across all Repository groups.

PromotionStagePolicy:
  type: object
  additionalProperties: false
  required:
    - configuredMode
    - effectiveMode
  properties:
    configuredMode:
      $ref: "#/PromotionPolicyMode"
    effectiveMode:
      $ref: "#/PromotionPolicyMode"
    expiresAt:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 4096
    updatedBy:
      $ref: ./runs.yaml#/RunActor
    updatedAt:
      type: string
      format: date-time

PromotionStagePolicyUpdate:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      $ref: "#/PromotionPolicyMode"
    expiresAt:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 4096

PromotionDecision:
  type: object
  additionalProperties: false
  required:
    - decision
    - decidedBy
    - decidedAt
  properties:
    decision:
      type: string
      enum:
        - approved
        - rejected
    comment:
      type: string
      minLength: 1
      maxLength: 4096
    decidedBy:
      $ref: ./runs.yaml#/RunActor
    decidedAt:
      type: string
      format: date-time

PromotionDecisionUpdate:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - approved
        - rejected
    comment:
      type: string
      minLength: 1
      maxLength: 4096

SuccessfulRenderAcknowledgement:
  type: object
  additionalProperties: false
  properties:
    sourceRevision:
      type: string
    targetRevision:
      type: string
    resultRevision:
      type: string

PromotionStageSnapshot:
  type: object
  additionalProperties: false
  required:
    - id
    - integration
    - cluster
    - project
    - name
    - kubernetesUid
    - resourceVersion
    - requestedFreight
    - freight
    - lastObservedAt
  properties:
    id:
      type: string
      format: uuid
    integration:
      $ref: ./runs.yaml#/CatalogName
    cluster:
      $ref: ./runs.yaml#/CatalogName
    project:
      $ref: ./runs.yaml#/CatalogName
    name:
      type: string
      minLength: 1
      maxLength: 253
    kubernetesUid:
      type: string
      minLength: 1
      maxLength: 200
    resourceVersion:
      type: string
      minLength: 1
      maxLength: 200
    enrichment:
      $ref: "#/PromotionStageEnrichment"
    requestedFreight:
      type: array
      items:
        $ref: "#/PromotionFreightRequest"
    freight:
      $ref: "#/PromotionFreight"
    successfulRenderAcknowledgement:
      $ref: "#/SuccessfulRenderAcknowledgement"
    lastObservedAt:
      type: string
      format: date-time

PromotionRepositorySnapshot:
  type: object
  additionalProperties: false
  required:
    - name
    - cloneUrl
    - branch
  properties:
    name:
      $ref: ./runs.yaml#/CatalogName
    cloneUrl:
      type: string
    branch:
      type: string
    checkoutCredentialName:
      type: string

PromotionGitContext:
  type: object
  additionalProperties: false
  required:
    - baseCommit
    - candidateCommit
    - candidateBranch
  properties:
    baseCommit:
      $ref: ./common.yaml#/GitCommit
    candidateCommit:
      $ref: ./common.yaml#/GitCommit
    candidateBranch:
      type: string
      minLength: 17
      maxLength: 255

PromotionReviewContext:
  type: object
  additionalProperties: false
  required:
    - repositoryId
    - repositorySnapshot
    - targetBranch
  properties:
    repositoryId:
      type: string
      format: uuid
    repositorySnapshot:
      $ref: "#/PromotionRepositorySnapshot"
    targetBranch:
      type: string
      minLength: 1
      maxLength: 255
    git:
      $ref: "#/PromotionGitContext"

PromotionCreationDispatch:
  type: object
  additionalProperties: false
  required:
    - phase
    - attemptCount
  properties:
    phase:
      $ref: "#/PromotionCreationDispatchPhase"
    attemptCount:
      type: integer
      minimum: 0
    nextAttemptAt:
      type: string
      format: date-time
    lastAttemptAt:
      type: string
      format: date-time
    deliveredAt:
      type: string
      format: date-time
    failedAt:
      type: string
      format: date-time
    diagnostic:
      type: string
      minLength: 1
      maxLength: 4096

PromotionCreationDispatchPhase:
  type: string
  enum:
    - not-applicable
    - awaiting-delivery
    - delivered
    - failed

KargoPromotionOutcome:
  type: object
  additionalProperties: false
  required:
    - phase
    - observedAt
  properties:
    phase:
      $ref: "#/KargoPromotionOutcomePhase"
      description: Exact terminal phase reported by Kargo.
    observedAt:
      type: string
      format: date-time
      description: Time Slipramp accepted the Controller's terminal observation.
    diagnostic:
      type: string
      minLength: 1
      maxLength: 4096
      description: Bounded sanitized Kargo diagnostic, when available.

KargoPromotionOutcomePhase:
  type: string
  enum:
    - Succeeded
    - Failed
    - Errored
    - Aborted

Promotion:
  type: object
  additionalProperties: false
  required:
    - id
    - source
    - integration
    - externalPromotionId
    - stageId
    - stageSnapshot
    - policySnapshot
    - reviewRequired
    - status
    - creationDispatch
    - requestedBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    source:
      $ref: "#/PromotionSource"
    integration:
      $ref: ./runs.yaml#/CatalogName
    externalPromotionId:
      type: string
      minLength: 1
      maxLength: 253
    stageId:
      type: string
      format: uuid
    sourceStageId:
      type: string
      format: uuid
    stageSnapshot:
      $ref: "#/PromotionStageSnapshot"
    reviewContext:
      $ref: "#/PromotionReviewContext"
    policySnapshot:
      $ref: "#/PromotionStagePolicy"
    selectedFreight:
      $ref: "#/PromotionFreightItem"
    reviewRequired:
      type: boolean
    status:
      $ref: "#/PromotionStatus"
    message:
      type: string
      minLength: 1
      maxLength: 4096
    creationDispatch:
      $ref: "#/PromotionCreationDispatch"
    kargoPromotionUid:
      type: string
      minLength: 1
      maxLength: 200
    nextReconciliationAt:
      type: string
      format: date-time
      description: >-
        Next durable inspection time while the responsible Controller awaits
        a terminal Kargo outcome.
    lastReconciliationAt:
      type: string
      format: date-time
      description: Most recent time reconciliation work was claimed by the responsible Controller.
    kargoOutcome:
      $ref: "#/KargoPromotionOutcome"
    preparationRunId:
      type: string
      format: uuid
    preparationRun:
      $ref: ./runs.yaml#/Run
    gitDiffArtifactId:
      type: string
      format: uuid
    gitDiffArtifact:
      $ref: ./artifacts.yaml#/Artifact
    argoDiffArtifactId:
      type: string
      format: uuid
    argoDiffArtifact:
      $ref: ./artifacts.yaml#/Artifact
    requestedBy:
      $ref: ./runs.yaml#/RunActor
    decision:
      $ref: "#/PromotionDecision"
    createdAt:
      type: string
      format: date-time
    preparationCompletedAt:
      type: string
      format: date-time
    decidedAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    kargoUrl:
      type: string
      format: uri
      description: Direct link to this Promotion in the configured Kargo UI.
    argoCdUrl:
      type: string
      format: uri
      description: Direct link to the snapshotted Stage Application in the configured Argo CD UI.

PromotionCreate:
  type: object
  additionalProperties: false
  required:
    - freightName
  properties:
    sourceStageId:
      type: string
      format: uuid
      description: Source Stage supplying the Freight. Omit for directly requested Warehouse Freight.
    freightName:
      type: string
      minLength: 1
      maxLength: 253
    policy:
      $ref: "#/PromotionStagePolicyUpdate"
      description: Optional Stage policy change applied atomically before this Promotion snapshots policy.

PromotionList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      items:
        $ref: "#/Promotion"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
    offset:
      type: integer
      minimum: 0

PromotionRunSource:
  type: object
  additionalProperties: false
  required:
    - promotionId
  properties:
    promotionId:
      type: string
      format: uuid

GitRevision:
  type: string
  pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
